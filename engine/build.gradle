// FreeCol's Engine (model, server, AI) built from the upstream clone
// at ../freecol plus our patched copies in patches/, which replace the
// upstream file at the same path.
plugins {
    id 'java'
    id 'application'
    id 'org.teavm' version "${teavmVersion}"
}

// The version is set once, in gradle.properties (-PteavmVersion overrides it).
def teavmVersion = project.property('teavmVersion')
def teavmRepo = project.findProperty('teavmRepo')

repositories {
    if (teavmRepo) { maven { url = new File(teavmRepo as String).toURI() } }
    mavenCentral()
}

def freecol = file('../freecol')
def patches = file('patches')

// The patches replace whole upstream files, so build only against the
// FreeCol commit pinned in freecol.sha (../freecol.sh checks it out).
def pinned = file('../freecol.sha').text.trim()
def head = new File(freecol, '.git/HEAD')
def checkedOut = head.exists() ? head.text.trim() : 'no clone'
if (checkedOut != pinned) {
    throw new GradleException("freecol/ is at '$checkedOut', not the pinned $pinned; run ./freecol.sh")
}

def patchedPaths = provider {
    fileTree(patches).matching { include '**/*.java' }.files
        .collect { patches.toPath().relativize(it.toPath()).toString() }
}

tasks.register('engineSources', Sync) {
    from(fileTree("$freecol/src")) { exclude { patchedPaths.get().contains(it.relativePath.pathString) } }
    from(patches)
    into layout.buildDirectory.dir('engine-src')
}

sourceSets.main.java.srcDirs = [layout.buildDirectory.dir('engine-src'), 'src/main/java']
compileJava.dependsOn 'engineSources'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
compileJava {
    options.release = 17   // TeaVM 0.16 needs 17; FreeCol source is Java 11
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-nowarn', '-Xlint:none']
}

dependencies {
    implementation fileTree("$freecol/jars") { include '*.jar' }
    // TeaVM has no StAX; FreeColXMLReader/Writer get Aalto directly.
    implementation 'stax:stax-api:1.0.1'  // has javax.xml.namespace too
    implementation 'com.fasterxml:aalto-xml:1.3.3'
    compileOnly "org.teavm:teavm-extension-spi:${teavmVersion}"
    compileOnly "org.teavm:teavm-extension-apis:${teavmVersion}"
    compileOnly "org.teavm:teavm-jso:${teavmVersion}"
    // FiberSuspendFix, a TeaVM plugin that patches Fiber.suspend (#11).
    compileOnly "org.teavm:teavm-core:${teavmVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    workingDir = freecol   // as for run: data/ is found relative to it
    jvmArgs '-Djava.awt.headless=true'
    // A fork that runs out of heap leaves a dump in build/ (java_pid*.hprof).
    jvmArgs '-XX:+HeapDumpOnOutOfMemoryError', "-XX:HeapDumpPath=${layout.buildDirectory.get().asFile}"
    // Every test starts whole FreeCol games. FreeCol's NameCache kept every
    // game a JVM made reachable, about 17 MB each, until ClearNameCache
    // (#439) cleared it after each test; before that the heap ran out at
    // 512 MB, and at 2 GB under load. A fresh JVM every few test classes
    // stays as a backstop against the next such leak.
    maxHeapSize = '2g'
    forkEvery = 6
    systemProperty 'presets.dir', file('../ui/presets').absolutePath
    systemProperty 'engine.src', file('src').absolutePath
    // -PwriteSave=NAME: SaveGameTest writes a fixture save from this build.
    if (project.hasProperty('writeSave')) systemProperty 'saves.write', project.property('writeSave')
    testLogging { events 'failed'; exceptionFormat 'full'; showStandardStreams = project.hasProperty('verbose') }
}

application { mainClass = 'browsercol.spike.SpikeMain' }
tasks.named('run') {
    workingDir = freecol   // FreeCol finds data/ relative to the working dir
    jvmArgs '-Djava.awt.headless=true'
}

// -Prelease: obfuscated names, for size runs. -Paggressive also turns on
// TeaVM's aggressive optimisation, which breaks the module under 0.16.
def release = project.hasProperty('release')
teavm {
    all {
        mainClass = project.findProperty('main') ?: 'browsercol.spike.SpikeMain'
        optimization = project.hasProperty('aggressive') ? org.teavm.gradle.api.OptimizationLevel.AGGRESSIVE
                               : org.teavm.gradle.api.OptimizationLevel.BALANCED
        // The locales whose CLDR names TeaVM compiles in. Its default, en_EN, names no real country, so
        // English's map of country names is empty, and a lookup in an empty map divides by zero under
        // wasm-gc: LanguageOption naming FreeCol's en_GB translation crashed the Engine. en_GB fills it.
        properties.put('java.util.Locale.available', 'en_GB')
    }
    wasmGC {
        // -Pout=<name>: the module's name, e.g. server or client with
        // -Pmain=browsercol.web.WorkerMain or ClientMain. It names the
        // file and gives the module a folder of its own. Each module's nested
        // build keeps its own task history, and on a build with none Gradle
        // deletes what it takes for stale output in the task's folder: in a
        // shared one, the first client build removed the server's files
        // (#165). Without -Pout, engine.wasm lands in the default wasm-gc.
        def module = project.findProperty('out') as String
        targetFileName = "${module ?: 'engine'}.wasm"
        if (module) relativePathInOutputDir = module
        obfuscated = release
    }
}

// The two browser modules in one invocation: `gradle modules` (add
// -Prelease for obfuscated builds). The TeaVM plugin builds one main class
// per run, so each module is a nested build with its own -Pmain and -Pout.
// Each lands in build/generated/teavm/<module>, e.g. teavm/server.
['server': 'browsercol.web.WorkerMain', 'client': 'browsercol.web.ClientMain'].each { out, main ->
    tasks.register("${out}Module", GradleBuild) {
        buildName = "engine-${out}"
        tasks = ['generateWasmGC', 'copyWasmGCRuntime']
        // Each module keeps its own task history: in a shared one, the other
        // module's -Pmain counts as a change, and every build compiles both.
        startParameter.projectCacheDir = file(".gradle/module-${out}")
        startParameter.projectProperties = [main: main, out: out] +
            (release ? [release: 'true'] : [:]) +
            ['teavmVersion', 'teavmRepo'].findAll { project.hasProperty(it) }
                .collectEntries { [(it): project.property(it)] }
    }
}
tasks.register('modules') {
    dependsOn 'serverModule', 'clientModule'
}
tasks.named('clientModule') { mustRunAfter 'serverModule' }
