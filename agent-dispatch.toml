# agent-dispatch config for browsercol. See
# ~/Programming/agent-dispatch/templates/agent-dispatch.example.toml.

[project]
base_branch = "main"
check_command = "./dev.sh -C engine gradle -q compileJava"
hooks_path = ".githooks"
# The upstream FreeCol clone (gitignored): the spike builds from its source.
data_dirs = ["freecol"]

[sandbox]
mode = "providers"
threat = "accidents"
image = "browsercol-agent" # docker/agent.Dockerfile: the dev image plus Chromium and Firefox
workdir = "/work"
# Share the Gradle and pnpm caches so each job does not download everything again.
mounts = [".cache/gradle:/work/.cache/gradle", ".cache/pnpm-store:/work/.cache/pnpm-store"]
env = { FREECOL_SANDBOX = "1" }  # dev.sh runs commands directly
busy_pattern = "gradle|java|node"
shm_size = "1g"  # browsers crash on Docker's default 64 MB /dev/shm

[daemon]
max = 2
cpus = 6
build_slots = 2
mem_min = 6.0
disk_min = 20.0
timeout = "2h"

[keys]
# Dedicated OpenRouter key with a small credit limit, shared with smac1.5.
openrouter_key = "~/.config/smac-trial/openrouter.key"

# MiniMax M Plan (Explore tier), shared with smac1.5: a 5-hour and a weekly
# allowance. A Flash job takes about 10-20% of the 5-hour window, so two at
# once. Sandboxed with the key made for the agents; no probe, since it would
# run with the host login. Running jobs of both projects count toward max.
[[providers]]
name = "minimax"
match = '^minimax-coding-plan/'
tool = "opencode"
max = 2
per_model = 2
cooldown = 1800
sandbox = true
key_file = "~/.config/smac-trial/keys/minimax.key"
auth_id = "minimax-coding-plan"

# Free models. OpenRouter's free models share one daily request
# allowance per account (about 5 agent runs), also used by smac1.5.
[[providers]]
name = "openrouter-free"
match = '^openrouter/.*:free$'
tool = "opencode"
unmetered = true
probe = false
cooldown = 1800
sandbox = true
sandbox_key = "openrouter"

[[providers]]
name = "zen-free"
match = '^opencode/.*-free$'
tool = "opencode"
unmetered = true
probe = true
cooldown = 900
sandbox = true
sandbox_key = "opencode-zen"
