// Minimal reproducer for #11: Object.wait never returns under TeaVM Wasm GC.
// ./dev.sh -C spike/teavm/wait-repro gradle generateWasmGC copyWasmGCRuntime
// ./dev.sh -C spike/teavm/wait-repro node run.mjs
plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
compileJava { options.release = 17 }

teavm {
    all { mainClass = 'repro.Main' }
    wasmGC { targetFileName = 'repro.wasm' }
}
