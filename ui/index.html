<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeCol Online</title>
    <style>
      body {
        margin: 0;
        font: 13px/1.4 monospace;
        background: #222;
        color: #ddd;
        display: flex;
        gap: 12px;
        height: 100vh;
      }
      /* The map takes what the side panel leaves; main.tsx sizes its canvas to this box. */
      #map {
        flex: 1;
        min-width: 320px;
        min-height: 240px;
        position: relative;
        overflow: hidden;
      }
      #map canvas {
        position: absolute;
        inset: 0 auto auto 0;
      }
      #side {
        flex: none;
        width: 348px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      #info {
        white-space: pre;
        overflow: auto;
        min-height: 8em;
        border: 1px solid #555;
        padding: 4px;
      }
      #out {
        white-space: pre;
        overflow: auto;
        flex: 1;
      }
      #unasked {
        color: #fc6;
      }
      #unasked ul {
        margin: 0;
        padding-left: 1.5em;
      }
      /* The WebGUI's dialogs (src/panels.tsx), modal over the page. */
      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 40%);
      }
      .dialog {
        max-width: 36em;
        max-height: 80vh;
        overflow: auto;
        padding: 12px 16px;
        background: #333;
        border: 1px solid #777;
        font-family: sans-serif;
      }
      .dialog h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .dialog .text {
        white-space: pre-wrap;
      }
      .dialog a {
        color: #9cf;
      }
      .dialog input {
        width: 100%;
        box-sizing: border-box;
      }
      .dialog .choices {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .choices .default {
        font-weight: bold;
      }
      .dialog .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="side"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
