<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeCol Online</title>
    <style>
      body {
        margin: 0;
        font: var(--fs-s) / 1.4 var(--font);
        background: var(--page);
        color: var(--ink);
        display: flex;
        gap: 12px;
        height: 100vh;
      }
      /* The menu bar over the map, and the map below it in what the side panel leaves. */
      #game {
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
      }
      /* main.tsx sizes the map's canvas to this box. */
      #map {
        flex: 1;
        min-height: 240px;
        position: relative;
        overflow: hidden;
      }
      #map canvas {
        position: absolute;
        inset: 0 auto auto 0;
      }
      #side {
        flex: none;
        width: 348px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
        background: var(--panel);
        border-left: 2px solid var(--line);
        overflow: auto;
      }
      /* Buttons and fields, in the side panel and in dialogs. */
      button {
        font: inherit;
        color: var(--btn-ink);
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #info {
        white-space: pre;
        overflow: auto;
        min-height: 8em;
        border: 1px solid var(--line);
        background: var(--box);
        font-family: var(--font-mono);
        padding: 4px;
      }
      #out {
        font-family: var(--font-mono);
        color: var(--muted);
        white-space: pre;
        overflow: auto;
        flex: 1;
      }
      #unasked {
        color: var(--warn);
      }
      #unasked ul {
        margin: 0;
        padding-left: 1.5em;
      }
      /* The menu bar (src/frame.tsx): FreeCol's menus, then the status line at the right. */
      .menubar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px;
        min-height: 26px;
        background: var(--menubar);
        color: var(--menubar-ink);
        font-size: 14px;
      }
      .menubar [role='menubar'] {
        display: flex;
        gap: 2px;
      }
      .menubar .menu {
        position: relative;
      }
      .menubar button {
        color: inherit;
        background: none;
        border: 0;
        border-radius: 3px;
        padding: 3px 9px;
      }
      .menubar button:hover,
      .menubar button[aria-expanded='true'] {
        background: var(--btn);
        color: var(--btn-ink);
      }
      .menubar [role='menu'] {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 10;
        min-width: 12em;
        display: flex;
        flex-direction: column;
        padding: 2px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgb(0 0 0 / 40%);
      }
      .menubar [role='menu'] button {
        text-align: left;
      }
      .menubar .status {
        margin-left: auto;
        padding-right: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* A window (src/frame.tsx): a title bar in the menu bar's colours over the panel. */
      .frame {
        display: flex;
        flex-direction: column;
        max-height: 100%;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        font: var(--fs) / 1.4 var(--font);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .frame > .title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 1.6em;
        padding: 2px 4px 2px 10px;
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .frame > .title h2 {
        flex: 1;
        margin: 0;
        font-size: var(--fs);
        font-weight: 700;
        color: inherit;
      }
      .frame > .title .close {
        margin-left: auto;
        padding: 0 6px;
        color: inherit;
        background: none;
        border: 0;
      }
      .frame > .body {
        padding: 12px 16px;
        overflow: auto;
        min-height: 0;
      }
      /* A boxed section with its caption at the top-left. */
      .box {
        position: relative;
        padding: 18px 6px 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .box > .cap {
        position: absolute;
        top: 2px;
        left: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--head);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      /* A goods icon and its amount: a gain, a loss, or greyed out for none. */
      .goods {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .goods img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .goods[data-sign='gain'] {
        color: var(--good);
      }
      .goods[data-sign='loss'] {
        color: var(--bad);
      }
      .goods[data-sign='zero'] {
        color: var(--muted);
        font-weight: 400;
        opacity: 0.6;
      }
      /* The WebGUI's dialogs (src/panels.tsx), modal over the page. */
      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--backdrop);
      }
      .dialog {
        max-width: 36em;
        max-height: 80vh;
      }
      .dialog h2 {
        margin: 0 0 8px;
        font-size: var(--fs-h);
        color: var(--head);
      }
      .dialog .text {
        white-space: pre-wrap;
      }
      .dialog a {
        color: var(--link);
      }
      .dialog input {
        width: 100%;
        box-sizing: border-box;
      }
      .dialog input[type='checkbox'] {
        width: auto;
      }
      .dialog .lots {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .lots label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .lots .name {
        flex: 1;
      }
      .dialog .trade-option {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 4px;
      }
      .dialog .trade-option .text {
        flex: 1;
      }
      .dialog .trade-option input {
        width: 6em;
      }
      .dialog .trade-item {
        display: block;
        margin: 2px 0 2px 1em;
      }
      .dialog h3 {
        margin: 8px 0 4px;
        font-size: var(--fs);
        color: var(--head);
      }
      .dialog .field {
        display: block;
        margin-top: 8px;
      }
      .dialog .choices {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .modifiers {
        border-collapse: collapse;
      }
      .dialog .modifiers th,
      .dialog .modifiers td {
        padding: 1px 8px;
        text-align: left;
      }
      .dialog .modifiers .value {
        text-align: right;
      }
      .dialog .choices .default {
        font-weight: bold;
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .high-score dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 1em;
        margin: 0 0 1em;
      }
      .dialog .high-score dl > div {
        display: contents;
      }
      .dialog .high-score dd {
        margin: 0;
        text-align: right;
      }
      .dialog .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .row .text {
        flex: 1;
      }
      .dialog .settlement .entry {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 24px;
      }
      .dialog .settlement .wanted {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
      }
      .dialog .pic {
        max-width: 48px;
        max-height: 48px;
        object-fit: contain;
      }
      .dialog .flavour {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 0 auto 8px;
      }
      .dialog .message[data-dim] .pic,
      .dialog .message[data-dim] .text {
        opacity: 0.4;
      }
      /* The trade routes panel: the routes, and a route's stops and goods. */
      .dialog[data-kind='tradeRoutes'] {
        min-width: 28em;
      }
      .dialog .routes,
      .dialog .stops {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
        padding: 4px;
        min-height: 4em;
        background: var(--box);
        border: 1px solid var(--line);
      }
      .dialog .stops button {
        display: flex;
        gap: 8px;
        align-items: center;
        text-align: left;
      }
      .dialog .stops .name {
        flex: 1;
      }
      .dialog .goods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8em, 1fr));
        gap: 4px;
        margin-top: 8px;
      }
      .dialog button[aria-pressed='true'] {
        border-color: var(--accent);
        outline: 2px solid var(--accent);
        outline-offset: -3px;
        font-weight: bold;
      }
      .dialog .error {
        color: var(--bad);
      }
      .dialog .pic.small {
        max-width: 20px;
        max-height: 20px;
        vertical-align: middle;
      }
      /* Europe (src/panels.tsx), as EuropePanel lays it out: the ships, the docks and cargo, the market. */
      .dialog[data-kind='europe'] {
        width: min(60em, 94vw);
        max-width: none;
      }
      .europe-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .europe {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .europe .box {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
        min-height: 4.5em;
      }
      .europe .box h3 {
        margin: 0 0 4px;
      }
      .europe [data-list='docks'] {
        grid-row: span 2;
      }
      .europe .market {
        grid-column: 1 / -1;
      }
      .europe .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .europe .chip {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--ink);
      }
      .europe button.chip[aria-pressed='true'] {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .europe .goods {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px 8px;
      }
      .europe .good {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .europe .good[data-disabled] {
        opacity: 0.4;
      }
      .europe .price {
        font-variant-numeric: tabular-nums;
      }
      /* The start screen (src/start-screen.tsx): a window of its own over the page, until a game starts. */
      .start {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--ink);
        font: var(--fs) / 1.4 var(--font);
      }
      .start-window {
        width: min(32em, 92vw);
        padding: 0 0 12px;
        background: var(--panel);
        border: 2px solid var(--line);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .start-window h1 {
        margin: 0;
        padding: 6px 16px;
        font-size: var(--fs-h);
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .start-window h2 {
        margin: 12px 16px 4px;
        font-size: var(--fs-h);
        color: var(--head);
      }
      .start-window fieldset {
        margin: 8px 16px 0;
        padding: 6px 10px 8px;
        border: 1px solid var(--line);
        background: var(--box);
      }
      .start-window legend {
        padding: 0 4px;
        color: var(--head);
      }
      .start-window .nations {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .start-window .nation {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 3px 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .start-window .nation[data-selected] {
        border-color: var(--accent);
        font-weight: bold;
      }
      .start-window .swatch {
        width: 14px;
        height: 14px;
        border: 1px solid var(--line);
      }
      .start-window .nation .name {
        flex: 1;
      }
      .start-window .nation .type,
      .start-window .quiet {
        color: var(--muted);
        font-size: var(--fs-s);
        font-weight: normal;
      }
      .start-window .quiet {
        margin: 6px 0 0;
      }
      .start-window fieldset > select {
        width: 100%;
        padding: 3px;
      }
      .start-window .customize {
        margin-top: 6px;
      }
      .start-window .customize > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .start-window .customize .options {
        max-height: 18em;
        overflow-y: auto;
        margin-top: 6px;
      }
      /* The option editor (src/option-editor.tsx), on the start screen and in the in-game panel. */
      .options .box {
        margin: 6px 0;
        padding: 4px 8px;
        background: var(--box);
        border: 1px solid var(--line);
      }
      .options .option {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 1px 0;
      }
      .options .option .name {
        flex: 1;
      }
      .options .option[data-changed] .name {
        font-weight: bold;
      }
      .options input[type='number'] {
        width: 8em;
      }
      .options input[type='text'],
      .options select {
        width: 14em;
      }
      .options input[aria-invalid] {
        outline: 2px solid var(--bad);
      }
      .dialog[data-kind='options'] .options {
        max-height: 60vh;
        overflow-y: auto;
      }
      .start-window .buttons {
        display: flex;
        justify-content: flex-end;
        margin: 12px 16px 0;
      }
      .start-window .buttons .default {
        font-weight: bold;
        border-color: var(--accent);
      }
      .dialog .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      /* The colony panel (src/colony-panel.tsx), laid out as Swing's ColonyPanel (look E, docs/adr/0004). */
      .dialog[data-kind='colony'] {
        max-width: none;
        width: min(1180px, 96vw);
        max-height: 94vh;
      }
      .colony .cbody {
        display: grid;
        grid-template-columns: 1fr 1fr 400px;
        gap: 6px;
      }
      /* The parts FreeCol gives no caption: no room above for one. */
      .colony .population,
      .colony .net,
      .colony .construction {
        padding-top: 6px;
      }
      .colony .muted {
        color: var(--muted);
      }
      .colony .icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
        vertical-align: middle;
      }
      .colony .unit {
        height: 48px;
      }
      .colony .population {
        grid-column: 1 / span 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .colony .population .shield {
        height: 32px;
      }
      .colony .buildings {
        grid-column: 1 / span 2;
        grid-row: 2 / span 2;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 6px;
        align-content: start;
      }
      .colony .building {
        position: relative;
        height: 128px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--box);
        overflow: hidden;
      }
      .colony .building .name {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: var(--fs-s);
        font-weight: 600;
      }
      .colony .building .art {
        position: absolute;
        left: 50%;
        top: 22px;
        height: 70px;
        max-width: 92%;
        object-fit: contain;
        transform: translateX(-50%);
        opacity: 0.85;
      }
      .colony .building .output {
        position: absolute;
        right: 4px;
        top: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .colony .made-goods {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
      }
      .colony .building.site {
        background: none;
        border-style: dashed;
      }
      .colony .upkeep {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        color: var(--bad);
        font-weight: 700;
      }
      .colony .building .workers {
        position: absolute;
        left: 4px;
        bottom: 2px;
        display: flex;
        align-items: end;
      }
      .colony .building .slot {
        width: 22px;
        height: 40px;
        margin: 0 2px;
        border: 1px dashed var(--line);
      }
      .colony .upper {
        grid-column: 3;
        grid-row: 1 / span 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      /* TilesPanel: the map's drawing of the 3x3 (.ground), and over it who works each tile and what it makes. */
      .colony .tiles {
        position: relative;
        flex: none;
      }
      .colony .tiles .ground,
      .colony .tiles .over {
        position: absolute;
        left: 0;
        top: 0;
      }
      .colony .tile {
        position: absolute;
        width: 128px;
        height: 64px;
      }
      .colony .tile .terrain,
      .colony .tile .taken {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .colony .tile .forest {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
      }
      .colony .tile .natives {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* TileViewer: the worker smaller, a quarter of the way in, with its occupation chip. */
      .colony .tile .who {
        position: absolute;
        left: 32px;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .colony .tile .who .unit {
        height: 40px;
      }
      .colony .tile .chip {
        position: absolute;
        left: 42px;
        top: -14px;
        padding: 0 3px;
        font-size: 10px;
        font-weight: 700;
        color: var(--menubar-ink);
        background: var(--menubar);
        border: 1px solid var(--ink);
      }
      .colony .tile .made {
        position: absolute;
        left: 0;
        right: 0;
        top: 4px;
        display: flex;
        justify-content: center;
        gap: 2px;
        color: var(--box);
        text-shadow:
          0 0 3px var(--ink),
          0 0 3px var(--ink);
      }
      .colony .tile .made .goods img {
        width: 20px;
        height: 20px;
      }
      .colony .net,
      .colony .construction {
        width: 100%;
        box-sizing: border-box;
      }
      .colony .net {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .colony .construction {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .colony .buildable {
        width: 80px;
      }
      .colony .needs {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .colony .need {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px;
        align-items: center;
      }
      .colony .bar {
        height: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .colony .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      /* In port beside the cargo of the ship chosen there, then the units outside, then the warehouse. */
      .colony .port,
      .colony .cargo,
      .colony .outside,
      .colony .warehouse {
        min-height: 64px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: end;
      }
      .colony .port {
        grid-column: 1;
      }
      .colony .cargo {
        grid-column: 2 / -1;
      }
      .colony .outside,
      .colony .warehouse {
        grid-column: 1 / -1;
      }
      .colony .ship {
        padding: 2px;
        background: none;
        border: 2px solid transparent;
      }
      .colony .ship[aria-pressed='true'] {
        border-color: var(--accent);
      }
      /* Moving colonists (colony-panel.tsx): units are dragged, or picked by a click; places take drops and clicks. */
      .colony [draggable='true'] {
        cursor: grab;
      }
      .colony [data-picked='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .colony .over-target:not(.tile) {
        outline: 2px dashed var(--accent);
      }
      /* The tiles overlap by their boxes, so only the diamond of each takes a drop, a click or the pointer. */
      .colony .tile {
        pointer-events: none;
      }
      .colony .tile .hit {
        position: absolute;
        inset: 0;
        z-index: 1;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        pointer-events: auto;
      }
      .colony .tile.over-target .hit {
        background: var(--accent);
        opacity: 0.3;
      }
      .colony .tile .who {
        z-index: 2;
        pointer-events: auto;
      }
      /* The picked colonist's other work: the goods it could make where it works. */
      .colony .work {
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .colony .choice {
