      .dialog .palette button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
      }
      .dialog .palette .pic {
        max-width: 28px;
        max-height: 28px;
      }
      @media (max-width: 480px) {
        .dialog .vstop {
          grid-template-columns: 34px 1fr auto;
        }
        /* On a phone the chips go under the name, the ✕ stays beside it. */
        .dialog .vstop .chips {
          grid-row: 2;
          grid-column: 2 / -1;
        }
      }
      .dialog .goods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8em, 1fr));
        gap: 4px;
        margin-top: 8px;
      }
      /* A pick never changes the room a thing takes: colour, outline (drawn inside) and shadow only, never weight, padding, border width or margin. */
      .dialog button[aria-pressed='true'] {
        border-color: var(--accent);
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .error {
        color: var(--bad);
      }
      .dialog .pic.small {
        max-width: 20px;
        max-height: 20px;
        vertical-align: middle;
      }
      /* Europe (src/panels.tsx), as EuropePanel lays it out: the ships, the docks and cargo, the market. */
      /* Europe is a large window over the map. The top bar stays clear above its backdrop, as the gold is read there. */
      body:has(.dialog[data-kind='europe']) #menubar {
        position: relative;
        z-index: 1;
        pointer-events: none;
      }
      .dialog[data-kind='europe'] {
        box-sizing: border-box;
        width: min(80em, 96vw);
        height: min(52em, 88vh);
        max-width: none;
        max-height: none;
      }
      .dialog[data-kind='europe'] > .body {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      /* As Swing's EuropePanel: the name centred, the lists and the sales above the market, the buttons below. */
      .europe-title {
        display: flex;
        justify-content: center;
        align-items: baseline;
      }
      .europe-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      .europe-top {
        display: flex;
        gap: 8px;
        align-items: stretch;
        flex: 1;
        min-height: 0;
      }
      .europe-top > .europe {
        flex: 1;
        min-width: 0;
      }
      /* The turn's purchases and sales (EuropePanel's transaction log), newest last; it scrolls when long. */
      .europe-log {
        flex: 0 0 25%;
        box-sizing: border-box;
        overflow: auto;
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
      }
      .europe-log h3 {
        margin: 0 0 4px;
      }
      .europe-log .entry + .entry {
        margin-top: 8px;
      }
      .europe-log .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      /* A unit of Europe's lists is its picture alone; the name is its tooltip. */
      .europe .chip[data-unit] .name {
        display: none;
      }
      .europe {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(auto, 1fr) minmax(auto, 1fr) minmax(auto, 1fr);
        gap: 8px;
        overflow: auto;
      }
      .europe .box {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
        min-height: 4.5em;
      }
      .europe .box h3 {
        margin: 0 0 4px;
      }
      .europe [data-list='docks'] {
        grid-row: span 2;
      }
      .europe-body > .market {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 8px;
      }
      /* Europe's footer: its buttons at the left, Close alone at the right. */
      .dialog[data-kind='europe'] .buttons {
        justify-content: flex-start;
      }
      .dialog[data-kind='europe'] .buttons [data-answer='close'] {
        margin-left: auto;
      }
      .dialog[data-kind='europe'] .buttons button[aria-pressed='true'] {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .shop {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
        margin-bottom: 8px;
      }
      /* The shop popup: every unit a card of the same size, its picture, name and price stacked. */
      .shop-modal {
        z-index: 5;
      }
      .shop-popup {
        max-width: min(40em, 94vw);
      }
      .shop-popup .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, 9em);
        gap: 8px;
        justify-content: center;
        overflow: auto;
      }
      .shop-popup .card {
        box-sizing: border-box;
        width: 9em;
        height: 8.6em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        padding: 6px;
        text-align: center;
        color: var(--ink);
      }
      /* The picture has a slot of its own height, and the name room for two lines, so a one-line name or a short picture moves nothing. */
      .shop-popup .card .pic {
        flex: none;
        width: 48px;
        height: 48px;
        max-width: none;
        max-height: none;
        object-fit: contain;
        object-position: center bottom;
      }
      .shop-popup .card .name {
        flex: 1;
        display: flex;
        align-items: center;
        line-height: 1.2;
      }
      .shop-popup .card .price {
        min-height: 1.4em;
        font-variant-numeric: tabular-nums;
      }
      .europe .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .europe .chip {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--ink);
        border-radius: 4px;
      }
      /*
       * What is picked (a ship, or goods in the colony) takes a tint of the accent colour. Everything that can be
       * picked has the same 4px of room on every side, so the tint never sits tight against the content.
       */
      .europe [data-list='inPort'] button.chip,
      .colony .ship,
      .colony [data-picked] {
        padding: 4px;
        border: none;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .europe [data-list='inPort'] button.chip[aria-pressed='true'] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        outline: none;
        box-shadow: none;
      }
      .europe-body .goods {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px 8px;
      }
      .europe-body .good {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .europe-body .good[data-disabled] {
        opacity: 0.4;
      }
      /* The market's goods and the cargo's stacks are buttons (they trade), but look as Swing's labels do. */
      .europe-body button.good,
      .europe button.chip {
        background: none;
        border: none;
        padding: 0;
        color: var(--ink);
      }
      /* Goods are traded by a click, not picked: they only show they can be clicked, never in the accent colour. */
      .europe-body button.good:hover,
      .europe .chip[data-drag]:hover,
      .europe button.chip:hover {
        background: var(--box);
        border-radius: 4px;
        outline: none;
      }
      /* Dragging by the icon or the name drags the chip: the picture is not a drag of its own. */
      .europe .chip img,
      .europe .chip .name {
        pointer-events: none;
        user-select: none;
      }
      .europe .chip[data-drag] {
        cursor: grab;
      }
      .europe [data-list='inPort'] button.chip:hover,
      .europe [data-list='inPort'] button.chip:focus-visible {
        outline: none;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .europe [data-list='inPort'] button.chip[aria-pressed='true']:hover {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .europe-body .price {
        font-variant-numeric: tabular-nums;
      }
      /* The start screen (src/start-screen.tsx): a window of its own over the page, until a game starts. */
      .start {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--ink);
        font: var(--fs) / 1.4 var(--font);
      }
      .start-window {
        width: min(32em, 92vw);
        /* Open option editors can make it taller than the page: it scrolls, so Start stays reachable. */
        max-height: 96vh;
        overflow-y: auto;
        padding: 0 0 12px;
        background: var(--panel);
        border: 2px solid var(--line);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .start-window h1 {
        margin: 0;
        padding: 6px 16px;
        font-family: var(--font-title);
        font-size: var(--fs-h);
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .start-window h2 {
        margin: 12px 16px 4px;
        font-size: var(--fs-h);
        color: var(--head);
      }
      .start-window fieldset {
        margin: 8px 16px 0;
        padding: 6px 10px 8px;
        border: 1px solid var(--line);
        background: var(--box);
      }
      .start-window legend {
        padding: 0 4px;
        color: var(--head);
      }
      .start-window .nations {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .start-window .nation {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 3px 6px;
        border: 1px solid transparent;
      }
      .start-window .nation[data-selected] {
        border-color: var(--accent);
        font-weight: bold;
      }
      .start-window .swatch {
        /* In running text (the other nations) an inline swatch has no width, and shows as a bar. */
        display: inline-block;
        vertical-align: middle;
        width: 14px;
        height: 14px;
        border: 1px solid var(--line);
      }
      .start-window .nation .name {
        flex: 1;
      }
      .start-window .nation .type,
      .start-window .quiet {
        color: var(--muted);
        font-size: var(--fs-s);
        font-weight: normal;
      }
      .start-window .quiet {
        margin: 6px 0 0;
      }
      /* The Loading Save game window (src/loading-save.tsx): one choice or field a line. */
      .start-window fieldset > label {
        display: block;
        padding: 2px 0;
      }
      .start-window .loading-save-name {
        margin: 0 16px;
      }
      .start-window fieldset > .ui-select {
        width: 100%;
        padding: 3px;
      }
      .start-window .customize {
        margin-top: 6px;
      }
      .save-picker {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        max-height: 14em;
        overflow-y: auto;
      }
      .save-picker button {
        width: 100%;
        text-align: left;
      }
      .start-window .customize .options {
        max-height: 18em;
        overflow-y: auto;
        margin-top: 6px;
      }
      /* The option editor (src/option-editor.tsx), on the start screen and in the in-game panel. */
      .options .box {
        margin: 6px 0;
        /* The top leaves room for the caption (.box > .cap). */
        padding: 18px 8px 4px;
        background: var(--box);
        border: 1px solid var(--line);
      }
      .options .option {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 1px 0;
      }
      .options .option .name {
        flex: 1;
      }
      .options .option[data-changed] .name {
        font-weight: bold;
      }
      .options .ui-number {
        width: 8em;
      }
      .options input[type='text'],
      .options .ui-select {
        width: 14em;
      }
      .options .slider {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      /* A slider's track and handle: a framed groove and a button-like knob. */
      .options .slider input[type='range'] {
        appearance: none;
        width: 10em;
        height: 1.2em;
        padding: 0;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .options .slider input[type='range']:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .options .slider input[type='range']:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .options .slider input[type='range']::-webkit-slider-runnable-track {
        height: 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']::-moz-range-track {
        height: 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']::-webkit-slider-thumb {
        appearance: none;
        width: 0.9em;
        height: 1.2em;
        margin-top: -7px;
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']::-moz-range-thumb {
        box-sizing: border-box;
        width: 0.9em;
        height: 1.2em;
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']:hover::-webkit-slider-thumb {
        border-color: var(--accent);
      }
      .options .slider input[type='range']:hover::-moz-range-thumb {
        border-color: var(--accent);
      }
      /* A file option's picked name sits beside its Choose button. */
      .options .file {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .options .slider output {
        min-width: 3.5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .options .mute {
        min-width: 5em;
      }
      .options .mute[aria-pressed='true'] {
        font-weight: bold;
      }
      .options .option:has(.mute[aria-pressed='true']) .slider {
        opacity: 0.5;
      }
      .options input[aria-invalid] {
        outline: 2px solid var(--bad);
      }
      /* The Preferences window (src/prefs-dialog.tsx): FreeCol's category tree, and the picked one's options. */
      #preferences .prefs-body {
        display: flex;
        gap: 8px;
        align-items: stretch;
        width: min(46em, calc(100vw - 32px));
        height: min(32em, 70vh);
      }
      #preferences .prefs-tree {
        flex: 0 0 11em;
        overflow-y: auto;
        padding: 4px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #preferences .prefs-tree button,
      #preferences .prefs-tree .heading {
        display: block;
        width: 100%;
        padding: 3px 6px;
        border: 0;
        border-radius: 2px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      #preferences .prefs-tree button:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      /* The picked category: a tint, as other picks, taking the same room. */
      #preferences .prefs-tree button[aria-current] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      #preferences .prefs-tree .heading {
        color: var(--head);
        font-weight: 700;
      }
      #preferences .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin: 8px 0 0;
      }
      #preferences .buttons .default {
        font-weight: bold;
        border-color: var(--accent);
      }
      .customize .tools {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .options .units .unit {
        display: flex;
        gap: 4px;
        align-items: center;
        margin: 2px 0;
      }
      #preferences .prefs-detail {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
      }
      #preferences .prefs-detail .options .option {
        padding: 2px 0;
      }
      #preferences .prefs-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .dialog[data-kind='options'] .options {
        max-height: 60vh;
        overflow-y: auto;
      }
      .start-window .buttons {
        display: flex;
        justify-content: flex-end;
        margin: 12px 16px 0;
      }
      .start-window .buttons .default {
        font-weight: bold;
        border-color: var(--accent);
      }
      /*
       * The new game window (issue 311): wide, with what most players change in three columns and the rarely
       * changed settings in a row of disclosures under them, so nothing usual needs a scroll at 1280x800.
       */
      .start-window.new-game {
        width: min(78em, 96vw);
        max-height: 94vh;
        font-size: var(--fs);
      }
      .new-game .start-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-right: 12px;
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .new-game .sound-toggles {
        display: flex;
        gap: 6px;
      }
      .new-game .sound-toggle {
        padding: 1px 8px;
        font-size: var(--fs-s);
        background: transparent;
        color: var(--menubar-ink);
        border: 1px solid currentColor;
        box-shadow: none;
      }
      .new-game .sound-toggle[aria-pressed='false'] {
        opacity: 0.7;
      }
      .new-game .start-cols {
        display: grid;
        grid-template-columns: minmax(15em, 1fr) minmax(20em, 1.4fr) minmax(14em, 0.9fr);
        gap: 12px;
        margin: 12px 16px 0;
        align-items: stretch;
      }
      .new-game .start-cols fieldset {
        margin: 0;
      }
      .new-game .col-others,
      .new-game .col-game {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .new-game .field-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        margin-top: 2px;
      }
      .new-game .field-grid .ui-select {
        width: 100%;
        padding: 3px;
      }
      .new-game .pedia {
        display: block;
        margin-top: 6px;
        color: var(--link);
        font-size: var(--fs-s);
      }
      .new-game .quiet .pedia {
        display: inline;
      }
      .new-game .rival-groups {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
      .new-game .rival-group h3 {
        margin: 0 0 2px;
        font-size: var(--fs);
        font-weight: normal;
        color: var(--head);
      }
      .new-game .rivals {
        display: flex;
        flex-direction: column;
      }
      .new-game .rivals > label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
      }
      .new-game .start-button {
        padding: 12px;
        font-size: var(--fs-h);
        font-weight: bold;
        border-color: var(--accent);
      }
      .new-game .saved-games {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .new-game .saved-games p {
        margin: 0;
      }
      .new-game .more-options {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0 12px;
        margin: 12px 16px 0;
        padding: 4px 10px;
        border: 1px solid var(--line);
        background: var(--box);
      }
      /* An open disclosure takes the whole row, so its options have the window's width. */
      .new-game .more-options > details[open] {
        grid-column: 1 / -1;
        padding-bottom: 6px;
      }
      .new-game .customize {
        margin: 0;
      }
      .new-game .customize > summary {
        padding: 3px 0;
        color: var(--ink);
        cursor: pointer;
      }
      /* An open option editor uses the width: its options flow in columns, and the window scrolls. */
      .new-game .more-options .options {
        max-height: none;
        columns: 24em;
        column-gap: 24px;
      }
      .new-game .more-options .options .option {
        break-inside: avoid;
      }
      .new-game .more-options .options .box {
        box-decoration-break: clone;
      }
      .new-game .colour-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
        gap: 4px 12px;
        margin-top: 6px;
      }
      /* Narrower: the nation beside the game and Start, the other nations under them. */
      @media (max-width: 1000px) {
        .new-game .start-cols {
          grid-template-columns: 1fr 1fr;
        }
        .new-game .col-game {
          order: 1;
        }
        .new-game .col-others {
          order: 2;
          grid-column: 1 / -1;
        }
        .new-game .more-options {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 640px) {
        .new-game .start-cols,
        .new-game .more-options {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 420px) {
        .new-game .rival-groups {
          grid-template-columns: 1fr;
        }
      }
      /* Wider and taller: the same layout, larger. */
      @media (min-width: 1600px) and (min-height: 960px) {
        .start-window.new-game {
          --fs: 17px;
          --fs-s: 15px;
          --fs-h: 20px;
        }
      }
      /* The licence, source and credits links under the start window (src/credits.tsx). */
      .start .source-links {
        margin: 12px 16px 0;
        color: var(--menubar-ink);
        font-size: var(--fs-s);
      }
      .start .source-links a,
      .start .source-links .linkish {
        color: inherit;
      }
      .linkish {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        text-decoration: underline;
      }
      #credits .credits-body {
        max-height: 70vh;
        overflow-y: auto;
      }
      /* The log (src/log.tsx), over the error banner (z-index 1000) it may be opened from. */
      .modal:has(#log) {
        z-index: 1001;
      }
      #log .log-text {
        width: min(60em, 90vw);
        height: 60vh;
        overflow: auto;
        margin: 0 0 8px;
        padding: 6px;
        background: var(--box);
        font: var(--fs-s) / 1.3 var(--font-mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #credits h3 {
        margin: 12px 0 4px;
      }
      #credits ul {
        margin: 0;
        padding-left: 1.2em;
      }
      .dialog .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      /* The colony panel (src/colony-panel.tsx), laid out as Swing's ColonyPanel (look E, docs/adr/0004). */
      .dialog[data-kind='colony'] {
        max-width: none;
        width: min(1180px, 96vw);
        max-height: 94vh;
      }
      /* Buildings fill the left; the right column holds the population, tiles, production, construction and port; units outside and the warehouse run along the bottom. */
      .colony .cbody {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 6px;
        align-items: start;
      }
      /* The parts FreeCol gives no caption: no room above for one. */
      .colony .net,
      .colony .construction {
        padding-top: 6px;
      }
      .colony .muted {
        color: var(--muted);
      }
      .colony .icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
        vertical-align: middle;
      }
      .colony .unit {
        height: 48px;
      }
      /*
       * UnitLabel's occupation chip in the label's top-left corner, beside the figure (ImageLibrary.createChip: a
       * black border round the owner's colour, which the Engine sends), and a damaged unit's repair status.
       */
      .colony .chip {
        position: absolute;
        left: 0;
        top: 0;
        padding: 3px;
        border: 1px solid var(--chip-border);
        background: var(--nation, var(--box));
        color: var(--nation-ink, var(--ink));
        font-family: var(--font);
        font-weight: bold;
        font-size: 10px;
        line-height: 10px;
      }
      .colony .repair {
        position: absolute;
        left: 2px;
        bottom: 2px;
        color: var(--bad);
        font-size: 10px;
        line-height: 11px;
        max-width: 100%;
        overflow: hidden;
      }
      .colony .outside [data-unit],
      .colony .port .ship {
        position: relative;
      }
      /* UnitLabel: the unit at its own size with a 5px margin each side, so the chip sits beside the figure. */
      .colony .outside [data-unit] {
        padding: 0 5px;
      }
      .colony .outside [data-unit] > .unit {
        height: auto;
      }
      /*
       * ColonyPanel's upperRightPanel: the tiles, the net production and the construction, with the population in
       * the four octagons of its wood (cut from image.colony.upperRight.background) in the tiles' corners. The text
       * is drawn as paintComponent draws it: the title font, larger for the size and its change.
       */
      .colony .board {
        position: relative;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .colony .octagon {
        position: absolute;
        z-index: 1;
        width: 68px;
        height: 66px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
        background-repeat: no-repeat;
        background-color: var(--btn);
        color: var(--paper-ink);
        font-family: var(--font-title);
        font-size: 32px;
        font-weight: 700;
        pointer-events: none;
      }
      .colony .octagon.size,
      .colony .octagon.rebels {
        left: 2px;
      }
      .colony .octagon.change,
      .colony .octagon.royalists {
        right: 2px;
      }
      .colony .octagon.size,
      .colony .octagon.change {
        top: 2px;
      }
      /* Under the muskets and the crown. */
      .colony .octagon.rebels,
      .colony .octagon.royalists {
        top: 158px;
        padding-top: 28px;
        font-size: 18px;
      }
      .colony .buildings {
        grid-column: 1;
        grid-row: 1;
        /* The open ground: the buildings lie spread over all of it (scatter in colony-panel.tsx). */
        position: relative;
        align-self: stretch;
        min-height: 560px;
      }
      .colony .building {
        position: absolute;
        width: 150px;
        height: 112px;
        transform: translate(-50%, -50%);
        border-radius: 3px;
        overflow: hidden;
      }
      .colony .building .name {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: var(--fs-s);
        font-weight: 600;
      }
      .colony .building .art {
        position: absolute;
        left: 50%;
        top: 22px;
        height: 70px;
        max-width: 92%;
        object-fit: contain;
        transform: translateX(-50%);
        opacity: 0.85;
      }
      .colony .building .output {
        position: absolute;
        right: 4px;
        top: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .colony .made-goods {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
      }
      /* BuildingToolTip, put on the page beside the building the pointer is over. */
      .building-tip {
        position: fixed;
        z-index: 1001;
        max-width: 280px;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: var(--box);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 3px;
        box-shadow: 0 2px 8px var(--backdrop);
        pointer-events: none;
      }
      /* RebelToolTip (a hint, Tip): three columns, the label, then two numbers on the right (MigLayout "[300px][50px, right][50px, right]"). */
      .rebel-tip {
        width: 400px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 1fr 50px 50px;
        align-items: center;
        gap: 6px 10px;
      }
      .rebel-tip .tip-row {
        display: contents;
      }
      .rebel-tip .num {
        text-align: right;
      }
      .rebel-tip .span2 {
        grid-column: span 2;
        justify-self: end;
      }
      .rebel-tip .icon {
        height: 24px;
        vertical-align: middle;
      }
      .rebel-tip .tip-bar {
        grid-column: 1 / -1;
        justify-self: center;
        position: relative;
        width: 80%;
        height: 26px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .rebel-tip .tip-bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: var(--line);
        opacity: 0.55;
      }
      .rebel-tip .tip-bar i.step {
        opacity: 0.3;
      }
      .rebel-tip .tip-bar .label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .building-tip .tip-name {
        font-size: var(--fs-s);
      }
      .building-tip .tip-production {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .building-tip .art {
        height: 70px;
      }
      .building-tip .tip-workers {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: end;
        gap: 8px;
      }
      .building-tip .tip-worker {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .building-tip .unit,
      .building-tip .placeholder {
        height: 40px;
      }
      .building-tip .unit.student {
        height: 28px;
      }
      .building-tip .breeding {
        margin: 0;
        font-size: var(--fs-s);
        text-align: center;
      }
      .colony .building.site {
        opacity: 0.6;
      }
      .colony .upkeep {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        color: var(--bad);
        font-weight: 700;
      }
      .colony .building .workers {
        position: absolute;
        left: 4px;
        bottom: 2px;
        display: flex;
        align-items: end;
      }
      .colony .upper {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      /* TilesPanel: the map's drawing of the 3x3 (.ground), and over it who works each tile and what it makes. */
      .colony .tiles {
        position: relative;
        flex: none;
      }
      .colony .tiles .ground,
      .colony .tiles .over {
        position: absolute;
        left: 0;
        top: 0;
      }
      .colony .tile {
        position: absolute;
        width: 128px;
        height: 64px;
      }
      .colony .tile .terrain,
      .colony .tile .taken {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .colony .tile .forest {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
      }
      .colony .tile .natives {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* TileViewer: the worker smaller, in the middle of the tile, without a chip. */
      .colony .tile .who {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .colony .tile .who .unit {
        height: 40px;
      }
      /* The yield is held in front of the colonist, over their waist. */
      .colony .tile .made {
        position: absolute;
        left: 50%;
        top: calc(50% - 2px);
        transform: translate(-50%, -50%);
        z-index: 3;
        pointer-events: none;
        display: flex;
        justify-content: center;
        gap: 2px;
        color: var(--box);
        text-shadow:
          0 0 3px var(--ink),
          0 0 3px var(--ink);
      }
      .colony .net,
      .colony .construction {
        width: 100%;
        box-sizing: border-box;
      }
      .colony .net {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .colony .construction {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      /*
       * ConstructionPanel draws the build's picture in a fixed 100x96 box (getSmallBuildableTypeImageWithWithSize),
       * so a tall unit (a wagon train) is scaled down into it and the box and its bars keep their size.
       */
      .colony .construction {
        min-height: 96px;
      }
      .colony .buildable {
        flex: none;
        width: 100px;
        height: 96px;
        object-fit: contain;
      }
      /* ConstructionPanel: the build's name over a bar for each goods it takes, centred beside its picture. */
      .colony .needs {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      /*
       * FreeColProgressBar: as tall as its goods icon, with the icon and its text centred over the bar. What is
       * there shades it, what next turn adds shades it lighter.
       */
      .colony .need {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        max-width: 360px;
        min-height: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--progress-border);
        background: var(--box);
        color: var(--ink);
      }
      .colony .need i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .colony .need i.now {
        background: var(--progress-now);
      }
      .colony .need i.next {
        background: var(--progress-next);
      }
      .colony .need > :not(i) {
        position: relative;
      }
      /* In port beside the cargo of the ship chosen there, then the units outside, then the warehouse. */
      .colony .port,
      .colony .cargo,
      .colony .outside,
      .colony .warehouse {
        min-height: 64px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: end;
      }
      .colony .upper .buttons {
        width: 100%;
        margin-top: 0;
      }
      .colony .upper .port {
        width: 100%;
        box-sizing: border-box;
      }
      /* Units outside the colony and the cargo of the chosen ship share a line; the cargo sits under the right column. */
      .colony .outside {
        grid-column: 1;
        min-height: 52px;
      }
      .colony .cargo {
        grid-column: 2;
        min-height: 52px;
      }
      .colony .warehouse {
        grid-column: 1 / -1;
        min-height: 0;
        gap: 6px 14px;
        justify-content: space-between;
      }
      /* The dialogs' goods grid (.dialog .goods) is not the colony's: a goods amount stays as wide as it is. */
      .colony .goods {
        display: inline-flex;
        margin-top: 0;
      }

      .colony .ship {
        background: none;
      }
      .colony .ship img {
        display: block;
      }
      .colony .ship[aria-pressed='true'],
      .colony [data-picked='true'] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        outline: none;
      }
      /* Moving colonists and goods (colony-panel.tsx): units and goods are dragged, or picked by a click; places take drops and clicks. */
      .colony [data-drag] {
        cursor: grab;
      }
      .colony .over-target:not(.tile) {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      /* The tiles overlap by their boxes, so only the diamond of each takes a drop, a click or the pointer. */
      .colony .tile {
        pointer-events: none;
      }
      .colony .tile .hit {
        position: absolute;
        inset: 0;
        z-index: 1;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        pointer-events: auto;
      }
      /* The build queue marks no place a row is dragged over, as it never has. */
      .colony .queue-body .over-target {
        background: none;
      }
      .colony .tile.over-target .hit {
        background: var(--accent);
        opacity: 0.3;
      }
      .colony .tile .who {
        z-index: 2;
        pointer-events: auto;
      }
      /* The build queue (BuildQueuePanel): the queue, then what can be added, each listed with the goods it takes. */
      /* What is being built, and a building that can build, open the queue when clicked: a highlight shows it, not a hand. */
      .colony .construction[role='button']:hover,
      .colony .building[data-builds]:hover {
        background: color-mix(in srgb, var(--accent) 15%, transparent);
      }
      .colony {
        position: relative;
        /* Keep the tiles' and queue's z-indexes inside the panel, so a dialog over it stays on top. */
        isolation: isolate;
      }
      .colony .queue-backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--ink) 35%, transparent);
      }
      .colony .queue-body {
        position: absolute;
        z-index: 21;
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
        width: min(900px, 96%);
        max-height: 80vh;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 16px;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 8px 30px color-mix(in srgb, var(--ink) 50%, transparent);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .colony .queue-body .queued {
        grid-column: 1 / -1;
      }
      .colony .queue-close {
        z-index: 1;
        position: absolute;
        right: 6px;
        top: 6px;
      }
      .colony .queue-body ol,
      .colony .queue-body ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .colony .queue-body li {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .colony .queue-body li > button:only-child {
        flex: 1;
        display: flex;
        gap: 6px;
        align-items: center;
        text-align: left;
      }
      .colony .queue-body li[data-locked] .name {
        color: var(--muted);
      }
      .colony .buildable-icon {
        width: 48px;
      }
      .colony .queue-body .reason {
        font-size: 0.85em;
      }
      .colony .queue-body .show-all,
      .colony .queue-body .buy {
        grid-column: 1 / -1;
      }
      .colony .queue-body li[data-selected] {
        outline: 2px solid var(--ink);
        outline-offset: -2px;
      }
      .colony .queue-body li[data-drag] {
        cursor: grab;
      }
      .colony .warehouse {
        align-items: center;
      }
      .colony .stored .goods {
        flex-direction: column;
      }
      .colony .stored[data-over='true'] .goods {
        color: var(--bad);
      }
      /* A grey wash while the window lacks keyboard focus, so it is obvious
         that keys will not reach the game; its strength is a preference
         (data-dim-unfocused: off, light, normal or heavy). */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 100000;
      }
      body[data-dim-unfocused='light']::after {
        background: rgba(128, 128, 128, 0.18);
      }
      body[data-dim-unfocused='normal']::after {
        background: rgba(128, 128, 128, 0.32);
        backdrop-filter: grayscale(0.5);
      }
      body[data-dim-unfocused='heavy']::after {
        background: rgba(128, 128, 128, 0.5);
        backdrop-filter: grayscale(1);
      }
      body:not([data-dim-unfocused='off'])[data-unfocused='true']::after {
        opacity: 1;
      }
      /*
       * The loading screen (issue 265, src/loading.ts): up from the first paint, over the page, until the start
       * screen or the map is ready. Tokens only (docs/adr/0004); it never takes a click: the page under it
       * is the one the scripts and the player act on. data-state: loading, leaving (fading), done, failed.
       */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 900; /* over the page's windows, under the error banner (1000) */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--page);
        color: var(--menubar-ink);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.25s;
      }
      #loading[data-state='leaving'] {
        opacity: 0;
      }
      /* A browser without Wasm GC (src/entry.ts): the message in place of the progress bar. */
      #loading[data-state='unsupported'] [data-loading-track] {
        display: none;
      }
      #loading[data-state='done'] {
        display: none;
      }
      #loading img {
        display: block;
        width: min(586px, 90vw);
        height: auto;
        aspect-ratio: 586 / 370;
        border: 2px solid var(--line);
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #loading img[data-ready] {
        opacity: 1;
      }
      #loading h1 {
        margin: 0;
        font: 700 var(--fs-h) / 1.2 var(--font-title);
        letter-spacing: 0.1em;
      }
      #loading [data-loading-track] {
        width: min(586px, 90vw);
        height: 10px;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--box);
        overflow: hidden;
      }
      #loading [data-loading-bar] {
        --loaded: 0%;
        width: var(--loaded);
        height: 100%;
        background: var(--accent);
        transition: width 0.15s;
      }
      #loading[data-state='failed'] [data-loading-bar] {
        --loaded: 100%;
        background: var(--bad);
      }
      #loading p {
        margin: 0;
        min-height: 1.4em;
        font: var(--fs-s) / 1.4 var(--font);
      }
      #loading p[data-loading-build] {
        min-height: 0;
        opacity: 0.7;
      }
      /* The notice for phones (src/mobile-notice.ts, issue 319): over the loading screen, which takes no click. */
      #mobile-notice {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 950;
        box-sizing: border-box;
        max-width: 460px;
        margin: 0 auto;
        padding: 14px 16px;
        background: var(--box);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 4px;
        font: var(--fs-s) / 1.4 var(--font);
      }
      #mobile-notice h2 {
        margin: 0 0 6px;
        font: 700 var(--fs-h) / 1.2 var(--font-title);
      }
      #mobile-notice p {
        margin: 0 0 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading,
        #loading img,
        #loading [data-loading-bar] {
          transition: none;
        }
      }
      /* A number field (src/controls.tsx, Base UI's NumberField): the input with a ▲ and a ▼ button beside it. */
      .ui-number {
        display: inline-block;
      }
      .ui-number-group {
        display: flex;
        align-items: stretch;
      }
      .ui-number .ui-number-input {
        flex: 1;
        min-width: 0;
        width: auto;
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        padding: 2px 4px;
      }
      .ui-number-input:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .ui-number-input:disabled {
        opacity: 0.5;
      }
      .ui-number-step {
        flex: none;
        width: 1.6em;
        padding: 0;
        font-size: 0.6em;
        line-height: 1;
        color: var(--btn-ink);
        background: var(--btn);
        border: 1px solid var(--line);
        border-left-width: 0;
        border-radius: 0;
        cursor: pointer;
      }
      .ui-number-step:last-child {
        border-radius: 0 3px 3px 0;
      }
      .ui-number-step:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div
      id="loading"
      role="progressbar"
      aria-label="Loading"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      data-state="loading"
    >
      <!-- FreeCol's splash (freecol/build/splash.jpg, FreeCol.java's SPLASH_DEFAULT), copied by build.sh. -->
      <img src="/splash.jpg" alt="" width="586" height="370" onload="this.dataset.ready = ''" />
      <h1>BrowserCol</h1>
      <div data-loading-track><div data-loading-bar></div></div>
      <p data-loading-label aria-live="polite">Loading</p>
      <p data-loading-build></p>
    </div>
    <div id="menubar"></div>
    <div id="stage">
      <div id="game">
        <div id="map" tabindex="-1"></div>
        <div id="map-orders-host"></div>
        <div id="minimap-host"></div>
        <div id="info-panel-host"></div>
      </div>
      <div id="side"></div>
    </div>
    <!-- The windows and popup menus (src/main.tsx), outside the side panel, which may be hidden. -->
    <div id="overlays"></div>
    <script>
      (() => {
        const sync = () => {
          document.body.dataset.unfocused = String(!document.hasFocus());
        };
        window.addEventListener('focus', sync);
        window.addEventListener('blur', sync);
        document.addEventListener('visibilitychange', sync);
        sync();
      })();
    </script>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
