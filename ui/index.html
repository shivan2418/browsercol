<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeCol Online</title>
    <style>
      body {
        margin: 0;
        font: 13px/1.4 monospace;
        background: #222;
        color: #ddd;
        display: flex;
        gap: 12px;
      }
      #map {
        flex: none;
      }
      #side {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        height: 100vh;
        box-sizing: border-box;
      }
      #info {
        white-space: pre;
        min-height: 8em;
        border: 1px solid #555;
        padding: 4px;
      }
      #out {
        white-space: pre;
        overflow: auto;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="side">
      <div>Turn: <span id="turn">-</span></div>
      <div>
        <button data-command="nextUnit">Next unit (W)</button>
        <button data-command="buildColony">Build colony (B)</button>
        <button data-command="endTurn">End turn (Enter)</button>
      </div>
      <div>
        Click a unit to select it, click a tile to go there. Arrows or numpad move. Drag, or rest the pointer at an
        edge, to scroll; the wheel zooms.
      </div>
      <div id="info"></div>
      <div id="out">starting...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
