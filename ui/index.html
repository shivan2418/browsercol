<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeCol Online</title>
    <style>
      body {
        margin: 0;
        font: var(--fs-s) / 1.4 var(--font);
        background: var(--page);
        color: var(--ink);
        display: flex;
        gap: 12px;
        height: 100vh;
      }
      /* The menu bar over the map, and the map below it in what the side panel leaves. */
      #game {
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
      }
      /* main.tsx sizes the map's canvas to this box. */
      #map {
        flex: 1;
        min-height: 240px;
        position: relative;
        overflow: hidden;
      }
      #map canvas {
        position: absolute;
        inset: 0 auto auto 0;
      }
      #side {
        flex: none;
        width: 348px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
        background: var(--panel);
        border-left: 2px solid var(--line);
        overflow: auto;
      }
      /* Buttons and fields, in the side panel and in dialogs. */
      button {
        font: inherit;
        color: var(--btn-ink);
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #info {
        white-space: pre;
        overflow: auto;
        min-height: 8em;
        border: 1px solid var(--line);
        background: var(--box);
        font-family: var(--font-mono);
        padding: 4px;
      }
      #out {
        font-family: var(--font-mono);
        color: var(--muted);
        white-space: pre;
        overflow: auto;
        flex: 1;
      }
      #unasked {
        color: var(--warn);
      }
      #unasked ul {
        margin: 0;
        padding-left: 1.5em;
      }
      /* The menu bar (src/frame.tsx): FreeCol's menus, then the status line at the right. */
      .menubar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px;
        min-height: 26px;
        background: var(--menubar);
        color: var(--menubar-ink);
        font-size: 14px;
      }
      .menubar [role='menubar'] {
        display: flex;
        gap: 2px;
      }
      .menubar .menu {
        position: relative;
      }
      .menubar button {
        color: inherit;
        background: none;
        border: 0;
        border-radius: 3px;
        padding: 3px 9px;
      }
      .menubar button:hover,
      .menubar button[aria-expanded='true'] {
        background: var(--btn);
        color: var(--btn-ink);
      }
      .menubar [role='menu'] {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 10;
        min-width: 12em;
        display: flex;
        flex-direction: column;
        padding: 2px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgb(0 0 0 / 40%);
      }
      .menubar [role='menu'] button {
        text-align: left;
      }
      /* An entry's hotkey, at the right of its label. */
      .menubar [role='menu'] .hint {
        float: right;
        margin-left: 1.5em;
        font: inherit;
        opacity: 0.65;
      }
      /* A switch's tick, in the space before its label. */
      .menubar [role='menu'] .tick {
        display: inline-block;
        width: 1.2em;
      }
      /* A right-click menu (src/popup-menu.tsx): at the pointer, over the map and every dialog. */
      .popup {
        position: fixed;
        z-index: 100;
        min-width: 12em;
        max-width: 28em;
        max-height: 90vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 2px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgb(0 0 0 / 40%);
        font-size: var(--fs-s);
      }
      .popup button {
        text-align: left;
        padding: 3px 10px;
        background: transparent;
        color: inherit;
        border: 0;
        font: inherit;
        cursor: pointer;
      }
      /* A work entry's goods, before its label. */
      .popup button .icon {
        height: 1.3em;
        width: auto;
        vertical-align: middle;
        margin-right: 6px;
      }
      .popup button:hover:enabled {
        background: var(--btn);
        color: var(--btn-ink);
      }
      .popup button:disabled {
        color: var(--muted);
        cursor: default;
      }
      .popup button[data-gap] {
        border-top: 1px solid var(--line);
      }
      .popup button[data-indent] {
        padding-left: 24px;
        font-style: italic;
      }
      /* The turn change banner (src/turn-banner.tsx), over the top of the map. */
      .turn-banner {
        position: fixed;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        padding: 6px 18px;
        background: var(--menubar);
        color: var(--menubar-ink);
        border: 2px solid var(--line);
        font: var(--fs-h) / 1.4 var(--font);
        pointer-events: none;
      }
      /* A new turn's banner stays solid, then fades out over its last stretch; its length is set inline. */
      .turn-banner.new {
        animation: turn-banner-fade linear forwards;
      }
      @keyframes turn-banner-fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .turn-banner.ai {
        font-style: italic;
      }
      .menubar .status {
        margin-left: auto;
        padding-right: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* A window (src/frame.tsx): a title bar in the menu bar's colours over the panel. */
      .frame {
        display: flex;
        flex-direction: column;
        max-height: 100%;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        font: var(--fs) / 1.4 var(--font);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .frame > .title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 1.6em;
        padding: 2px 4px 2px 10px;
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .frame > .title h2 {
        flex: 1;
        margin: 0;
        font-size: var(--fs);
        font-weight: 700;
        color: inherit;
      }
      .frame > .title .close {
        margin-left: auto;
        padding: 0 6px;
        color: inherit;
        background: none;
        border: 0;
      }
      .frame > .body {
        padding: 12px 16px;
        overflow: auto;
        min-height: 0;
      }
      /* A boxed section with its caption at the top-left. */
      .box {
        position: relative;
        padding: 18px 6px 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .box > .cap {
        position: absolute;
        top: 2px;
        left: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--head);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      /* A goods icon and its amount: a gain, a loss, or greyed out for none. */
      .goods {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .goods .pile {
        position: relative;
        display: inline-block;
        height: 24px;
      }
      .goods .pile img {
        position: absolute;
        top: 0;
      }
      .goods img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .goods[data-sign='gain'] {
        color: var(--good);
      }
      .goods[data-sign='loss'] {
        color: var(--bad);
      }
      .goods[data-sign='zero'] {
        color: var(--muted);
        font-weight: 400;
        opacity: 0.6;
      }
      /* The WebGUI's dialogs (src/panels.tsx), modal over the page. */
      .modal {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--backdrop);
      }
      /* A dialog over a panel sits in the same place, on top of it. */
      .modal > * {
        position: relative;
        grid-area: 1 / 1;
        max-width: 100%;
      }
      .dialog {
        max-width: 36em;
        max-height: 80vh;
      }
      .dialog h2 {
        margin: 0 0 8px;
        font-size: var(--fs-h);
        color: var(--head);
      }
      .dialog .text {
        white-space: pre-wrap;
      }
      .dialog a {
        color: var(--link);
      }
      .dialog input {
        width: 100%;
        box-sizing: border-box;
      }
      .dialog input[type='checkbox'] {
        width: auto;
      }
      .dialog .lots {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .lots label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .lots .name {
        flex: 1;
      }
      .dialog .trade-option {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 4px;
      }
      .dialog .trade-option .text {
        flex: 1;
      }
      .dialog .trade-option input {
        width: 6em;
      }
      .dialog .trade-item {
        display: block;
        margin: 2px 0 2px 1em;
      }
      .dialog h3 {
        margin: 8px 0 4px;
        font-size: var(--fs);
        color: var(--head);
      }
      .dialog .field {
        display: block;
        margin-top: 8px;
      }
      .dialog .choices {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .modifiers {
        border-collapse: collapse;
      }
      .dialog .modifiers th,
      .dialog .modifiers td {
        padding: 1px 8px;
        text-align: left;
      }
      .dialog .modifiers .value {
        text-align: right;
      }
      /* The select amount dialog: the goods and the amount, then the amounts it lists in a row. */
      .dialog .amount {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .amount input {
        width: 8em;
      }
      .dialog .choices.amounts {
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .dialog .amounts [aria-pressed='true'] {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .choices .default {
        font-weight: bold;
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .high-score dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 1em;
        margin: 0 0 1em;
      }
      .dialog .high-score dl > div {
        display: contents;
      }
      .dialog .high-score dd {
        margin: 0;
        text-align: right;
      }
      .dialog .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .row .text {
        flex: 1;
      }
      .dialog .settlement .entry {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 24px;
      }
      .dialog .tile-panel {
        text-align: center;
      }
      .dialog .tile-panel dl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
        text-align: left;
      }
      .dialog .tile-panel dt {
        text-align: right;
      }
      .dialog .tile-panel dd {
        margin: 0;
      }
      .dialog .tile-panel .production {
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      .dialog .settlement .wanted {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
      }
      .dialog .pic {
        max-width: 48px;
        max-height: 48px;
        object-fit: contain;
      }
      .dialog .flavour {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 0 auto 8px;
      }
      .dialog .message[data-dim] .pic,
      .dialog .message[data-dim] .text {
        opacity: 0.4;
      }
      /* The trade routes panel: the routes, and a route's stops and goods. */
      .dialog[data-kind='tradeRoutes'] {
        min-width: 28em;
      }
      .dialog .routes,
      .dialog .stops {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 8px 0;
        padding: 4px;
        min-height: 4em;
        background: var(--box);
        border: 1px solid var(--line);
      }
      .dialog .stops button {
        display: flex;
        gap: 8px;
        align-items: center;
        text-align: left;
      }
      .dialog .stops .name {
        flex: 1;
      }
      .dialog .goods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8em, 1fr));
        gap: 4px;
        margin-top: 8px;
      }
      /* A pick never changes the room a thing takes: colour, outline (drawn inside) and shadow only, never weight, padding, border width or margin. */
      .dialog button[aria-pressed='true'] {
        border-color: var(--accent);
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .error {
        color: var(--bad);
      }
      .dialog .pic.small {
        max-width: 20px;
        max-height: 20px;
        vertical-align: middle;
      }
      /* Europe (src/panels.tsx), as EuropePanel lays it out: the ships, the docks and cargo, the market. */
      /* Europe is a screen of its own, as in FreeCol: it fills the whole window. */
      .modal:has(> .dialog[data-kind='europe']) {
        background: var(--panel);
      }
      .dialog[data-kind='europe'] {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        border: 0;
        box-shadow: none;
      }
      .dialog[data-kind='europe'] > .body {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      /* As Swing's EuropePanel: the name centred, the lists and the sales above the market, the buttons below. */
      .europe-title {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: baseline;
      }
      .europe-title .gold {
        position: absolute;
        right: 0;
      }
      .europe-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      .europe-top {
        display: flex;
        gap: 8px;
        align-items: stretch;
        flex: 1;
        min-height: 0;
      }
      .europe-top > .europe {
        flex: 1;
        min-width: 0;
      }
      .europe-tally {
        flex: 0 0 25%;
        box-sizing: border-box;
        overflow: auto;
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
      }
      .europe-tally h3 {
        margin: 0 0 4px;
      }
      .europe-tally .tax {
        margin: 0 0 4px;
      }
      .europe-tally td,
      .europe-tally th {
        text-align: right;
        padding: 1px 4px;
      }
      .europe-tally img {
        vertical-align: middle;
      }
      /* A unit of Europe's lists is its picture alone; the name is its tooltip. */
      .europe .chip[data-unit] .name {
        display: none;
      }
      .europe {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(auto, 1fr) minmax(auto, 1fr) minmax(auto, 1fr);
        gap: 8px;
        overflow: auto;
      }
      .europe .box {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
        min-height: 4.5em;
      }
      .europe .box h3 {
        margin: 0 0 4px;
      }
      .europe [data-list='docks'] {
        grid-row: span 2;
      }
      .europe-body > .market {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 8px;
      }
      /* Europe's footer: its buttons at the left, Close alone at the right. */
      .dialog[data-kind='europe'] .buttons {
        justify-content: flex-start;
      }
      .dialog[data-kind='europe'] .buttons [data-answer='close'] {
        margin-left: auto;
      }
      .dialog[data-kind='europe'] .buttons button[aria-pressed='true'] {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .shop {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
        margin-bottom: 8px;
      }
      /* The shop popup: every unit a card of the same size, its picture, name and price stacked. */
      .shop-modal {
        z-index: 5;
      }
      .shop-popup {
        max-width: min(40em, 94vw);
      }
      .shop-popup .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, 9em);
        gap: 8px;
        justify-content: center;
        overflow: auto;
      }
      .shop-popup .card {
        box-sizing: border-box;
        width: 9em;
        height: 8em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px;
        text-align: center;
        color: var(--ink);
      }
      .shop-popup .card .price {
        min-height: 1.4em;
        font-variant-numeric: tabular-nums;
      }
      .europe .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .europe .chip {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--ink);
        border-radius: 4px;
      }
      /*
       * What is picked (a ship, or goods in the colony) takes a tint of the accent colour. Everything that can be
       * picked has the same 4px of room on every side, so the tint never sits tight against the content.
       */
      .europe [data-list='inPort'] button.chip,
      .colony .ship,
      .colony [data-picked] {
        padding: 4px;
        border: none;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .europe [data-list='inPort'] button.chip[aria-pressed='true'] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        outline: none;
        box-shadow: none;
      }
      .europe-body .goods {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px 8px;
      }
      .europe-body .good {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .europe-body .good[data-disabled] {
        opacity: 0.4;
      }
      /* The market's goods and the cargo's stacks are buttons (they trade), but look as Swing's labels do. */
      .europe-body button.good,
      .europe button.chip {
        background: none;
        border: none;
        padding: 0;
        color: var(--ink);
        cursor: pointer;
      }
      /* Goods are traded by a click, not picked: they only show they can be clicked, never in the accent colour. */
      .europe-body button.good:hover,
      .europe .chip[draggable='true']:hover,
      .europe button.chip:hover {
        background: var(--box);
        border-radius: 4px;
        outline: none;
      }
      /* Dragging by the icon or the name drags the chip: the picture is not a drag of its own. */
      .europe .chip img,
      .europe .chip .name {
        pointer-events: none;
        user-select: none;
      }
      .europe .chip[draggable='true'] {
        cursor: grab;
      }
      .europe [data-list='inPort'] button.chip:hover,
      .europe [data-list='inPort'] button.chip:focus-visible {
        outline: none;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .europe [data-list='inPort'] button.chip[aria-pressed='true']:hover {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .europe-body .price {
        font-variant-numeric: tabular-nums;
      }
      /* The start screen (src/start-screen.tsx): a window of its own over the page, until a game starts. */
      .start {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--ink);
        font: var(--fs) / 1.4 var(--font);
      }
      .start-window {
        width: min(32em, 92vw);
        /* Open option editors can make it taller than the page: it scrolls, so Start stays reachable. */
        max-height: 96vh;
        overflow-y: auto;
        padding: 0 0 12px;
        background: var(--panel);
        border: 2px solid var(--line);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .start-window h1 {
        margin: 0;
        padding: 6px 16px;
        font-size: var(--fs-h);
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .start-window h2 {
        margin: 12px 16px 4px;
        font-size: var(--fs-h);
        color: var(--head);
      }
      .start-window fieldset {
        margin: 8px 16px 0;
        padding: 6px 10px 8px;
        border: 1px solid var(--line);
        background: var(--box);
      }
      .start-window legend {
        padding: 0 4px;
        color: var(--head);
      }
      .start-window .nations {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .start-window .nation {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 3px 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .start-window .nation[data-selected] {
        border-color: var(--accent);
        font-weight: bold;
      }
      .start-window .swatch {
        width: 14px;
        height: 14px;
        border: 1px solid var(--line);
      }
      .start-window .nation .name {
        flex: 1;
      }
      .start-window .nation .type,
      .start-window .quiet {
        color: var(--muted);
        font-size: var(--fs-s);
        font-weight: normal;
      }
      .start-window .quiet {
        margin: 6px 0 0;
      }
      .start-window fieldset > select {
        width: 100%;
        padding: 3px;
      }
      .start-window .customize {
        margin-top: 6px;
      }
      .start-window .customize > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .start-window .customize .options {
        max-height: 18em;
        overflow-y: auto;
        margin-top: 6px;
      }
      /* The option editor (src/option-editor.tsx), on the start screen and in the in-game panel. */
      .options .box {
        margin: 6px 0;
        padding: 4px 8px;
        background: var(--box);
        border: 1px solid var(--line);
      }
      .options .option {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 1px 0;
      }
      .options .option .name {
        flex: 1;
      }
      .options .option[data-changed] .name {
        font-weight: bold;
      }
      .options input[type='number'] {
        width: 8em;
      }
      .options input[type='text'],
      .options select {
        width: 14em;
      }
      .options input[aria-invalid] {
        outline: 2px solid var(--bad);
      }
      .dialog[data-kind='options'] .options {
        max-height: 60vh;
        overflow-y: auto;
      }
      .start-window .buttons {
        display: flex;
        justify-content: flex-end;
        margin: 12px 16px 0;
      }
      .start-window .buttons .default {
        font-weight: bold;
        border-color: var(--accent);
      }
      .dialog .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      /* The colony panel (src/colony-panel.tsx), laid out as Swing's ColonyPanel (look E, docs/adr/0004). */
      .dialog[data-kind='colony'] {
        max-width: none;
        width: min(1180px, 96vw);
        max-height: 94vh;
      }
      /* Buildings fill the left; the right column holds the population, tiles, production, construction and port; units outside and the warehouse run along the bottom. */
      .colony .cbody {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 6px;
        align-items: start;
      }
      /* The parts FreeCol gives no caption: no room above for one. */
      .colony .population,
      .colony .net,
      .colony .construction {
        padding-top: 6px;
      }
      .colony .muted {
        color: var(--muted);
      }
      .colony .icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
        vertical-align: middle;
      }
      .colony .unit {
        height: 48px;
      }
      .colony .population {
        width: 100%;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .colony .population .shield {
        height: 32px;
      }
      .colony .buildings {
        grid-column: 1;
        grid-row: 1;
        /* The open ground: the buildings lie spread over all of it (scatter in colony-panel.tsx). */
        position: relative;
        align-self: stretch;
        min-height: 560px;
      }
      .colony .building {
        position: absolute;
        width: 150px;
        height: 112px;
        transform: translate(-50%, -50%);
        border-radius: 3px;
        overflow: hidden;
      }
      .colony .building .name {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: var(--fs-s);
        font-weight: 600;
      }
      .colony .building .art {
        position: absolute;
        left: 50%;
        top: 22px;
        height: 70px;
        max-width: 92%;
        object-fit: contain;
        transform: translateX(-50%);
        opacity: 0.85;
      }
      .colony .building .output {
        position: absolute;
        right: 4px;
        top: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .colony .made-goods {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
      }
      .colony .building.site {
        opacity: 0.6;
      }
      .colony .upkeep {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        color: var(--bad);
        font-weight: 700;
      }
      .colony .building .workers {
        position: absolute;
        left: 4px;
        bottom: 2px;
        display: flex;
        align-items: end;
      }
      .colony .building .slot {
        width: 22px;
        height: 40px;
        margin: 0 2px;
        border: 1px dashed var(--line);
      }
      .colony .upper {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      /* TilesPanel: the map's drawing of the 3x3 (.ground), and over it who works each tile and what it makes. */
      .colony .tiles {
        position: relative;
        flex: none;
      }
      .colony .tiles .ground,
      .colony .tiles .over {
        position: absolute;
        left: 0;
        top: 0;
      }
      .colony .tile {
        position: absolute;
        width: 128px;
        height: 64px;
      }
      .colony .tile .terrain,
      .colony .tile .taken {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .colony .tile .forest {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
      }
      .colony .tile .natives {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* TileViewer: the worker smaller, in the middle of the tile, without a chip. */
      .colony .tile .who {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .colony .tile .who .unit {
        height: 40px;
      }
      /* The yield is held in front of the colonist, over their waist. */
      .colony .tile .made {
        position: absolute;
        left: 50%;
        top: calc(50% - 2px);
        transform: translate(-50%, -50%);
        z-index: 3;
        pointer-events: none;
        display: flex;
        justify-content: center;
        gap: 2px;
        color: var(--box);
        text-shadow:
          0 0 3px var(--ink),
          0 0 3px var(--ink);
      }
      .colony .net,
      .colony .construction {
        width: 100%;
        box-sizing: border-box;
      }
      .colony .net {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .colony .construction {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .colony .buildable {
        width: 80px;
      }
      .colony .needs {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .colony .need {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px;
        align-items: center;
      }
      .colony .bar {
        height: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .colony .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      /* In port beside the cargo of the ship chosen there, then the units outside, then the warehouse. */
      .colony .port,
      .colony .cargo,
      .colony .outside,
      .colony .warehouse {
        min-height: 64px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: end;
      }
      .colony .upper .buttons {
        width: 100%;
        margin-top: 0;
      }
      .colony .upper .port {
        width: 100%;
        box-sizing: border-box;
      }
      /* Units outside the colony and the cargo of the chosen ship share a line; the cargo sits under the right column. */
      .colony .outside {
        grid-column: 1;
        min-height: 52px;
      }
      .colony .cargo {
        grid-column: 2;
        min-height: 52px;
      }
      .colony .warehouse {
        grid-column: 1 / -1;
        min-height: 0;
        gap: 6px 14px;
        justify-content: space-between;
      }
      /* The dialogs' goods grid (.dialog .goods) is not the colony's: a goods amount stays as wide as it is. */
      .colony .goods {
        display: inline-flex;
        margin-top: 0;
      }

      .colony .ship {
        background: none;
      }
      .colony .ship img {
        display: block;
      }
      .colony .ship[aria-pressed='true'],
      .colony [data-picked='true'] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        outline: none;
      }
      /* Moving colonists and goods (colony-panel.tsx): units and goods are dragged, or picked by a click; places take drops and clicks. */
      .colony [draggable='true'] {
        cursor: grab;
      }
      .colony .over-target:not(.tile) {
        outline: 2px dashed var(--accent);
      }
      /* The tiles overlap by their boxes, so only the diamond of each takes a drop, a click or the pointer. */
      .colony .tile {
        pointer-events: none;
      }
      .colony .tile .hit {
        position: absolute;
        inset: 0;
        z-index: 1;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        pointer-events: auto;
      }
      .colony .tile.over-target .hit {
        background: var(--accent);
        opacity: 0.3;
      }
      .colony .tile .who {
        z-index: 2;
        pointer-events: auto;
      }
      /* The build queue (BuildQueuePanel): the queue, then what can be added, each listed with the goods it takes. */
      /* What is being built opens the queue when clicked. */
      .colony .construction[role='button'] {
        cursor: pointer;
      }
      .colony {
        position: relative;
        /* Keep the tiles' and queue's z-indexes inside the panel, so a dialog over it stays on top. */
        isolation: isolate;
      }
      .colony .queue-backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--ink) 35%, transparent);
      }
      .colony .queue-body {
        position: absolute;
        z-index: 21;
        left: 50%;
        top: 40px;
        transform: translateX(-50%);
        width: min(900px, 96%);
        max-height: 80vh;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 16px;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 8px 30px color-mix(in srgb, var(--ink) 50%, transparent);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .colony .queue-body .queued {
        grid-column: 1 / -1;
      }
      .colony .queue-close {
        z-index: 1;
        position: absolute;
        right: 6px;
        top: 6px;
      }
      .colony .queue-body ol,
      .colony .queue-body ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .colony .queue-body li {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .colony .queue-body li > button:only-child {
        flex: 1;
        display: flex;
        gap: 6px;
        align-items: center;
        text-align: left;
      }
      .colony .queue-body li[data-locked] .name {
        color: var(--muted);
      }
      .colony .buildable-icon {
        width: 48px;
      }
      .colony .queue-body .reason {
        font-size: 0.85em;
      }
      .colony .queue-body .show-all,
      .colony .queue-body .buy {
        grid-column: 1 / -1;
      }
      .colony .warehouse {
        align-items: center;
      }
      .colony .stored .goods {
        flex-direction: column;
      }
      .colony .stored[data-over='true'] .goods {
        color: var(--bad);
      }
      /* A faint grey wash while the window lacks keyboard focus, so it is
         obvious that keys will not reach the game. */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(128, 128, 128, 0.18);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 100000;
      }
      body[data-dim-unfocused='true'][data-unfocused='true']::after {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="menubar"></div>
      <div id="map"></div>
    </div>
    <div id="side"></div>
    <script>
      (() => {
        const sync = () => {
          document.body.dataset.unfocused = String(!document.hasFocus());
        };
        window.addEventListener('focus', sync);
        window.addEventListener('blur', sync);
        document.addEventListener('visibilitychange', sync);
        sync();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
