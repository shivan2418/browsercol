<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FreeCol Online</title>
    <style>
      body {
        margin: 0;
        font: var(--fs-s) / 1.4 var(--font);
        background: var(--page);
        color: var(--ink);
        display: flex;
        gap: 12px;
        height: 100vh;
      }
      /* The menu bar over the map, and the map below it in what the side panel leaves. */
      #game {
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
      }
      /* main.tsx sizes the map's canvas to this box. */
      #map {
        flex: 1;
        min-height: 240px;
        position: relative;
        overflow: hidden;
      }
      #map canvas {
        position: absolute;
        inset: 0 auto auto 0;
      }
      #side {
        flex: none;
        width: 348px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
        background: var(--panel);
        border-left: 2px solid var(--line);
        overflow: auto;
      }
      /* Buttons and fields, in the side panel and in dialogs. */
      button {
        font: inherit;
        color: var(--btn-ink);
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #info {
        white-space: pre;
        overflow: auto;
        min-height: 8em;
        border: 1px solid var(--line);
        background: var(--box);
        font-family: var(--font-mono);
        padding: 4px;
      }
      #out {
        font-family: var(--font-mono);
        color: var(--muted);
        white-space: pre;
        overflow: auto;
        flex: 1;
      }
      #unasked {
        color: var(--warn);
      }
      #unasked ul {
        margin: 0;
        padding-left: 1.5em;
      }
      /* The menu bar (src/frame.tsx): FreeCol's menus, then the status line at the right. */
      .menubar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px;
        min-height: 26px;
        background: var(--menubar);
        color: var(--menubar-ink);
        font-size: 14px;
      }
      .menubar [role='menubar'] {
        display: flex;
        gap: 2px;
      }
      .menubar .menu {
        position: relative;
      }
      .menubar button {
        color: inherit;
        background: none;
        border: 0;
        border-radius: 3px;
        padding: 3px 9px;
      }
      .menubar button:hover,
      .menubar button[aria-expanded='true'] {
        background: var(--btn);
        color: var(--btn-ink);
      }
      .menubar [role='menu'] {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 10;
        min-width: 12em;
        display: flex;
        flex-direction: column;
        padding: 2px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgb(0 0 0 / 40%);
      }
      .menubar [role='menu'] button {
        text-align: left;
      }
      .menubar .status {
        margin-left: auto;
        padding-right: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* A window (src/frame.tsx): a title bar in the menu bar's colours over the panel. */
      .frame {
        display: flex;
        flex-direction: column;
        max-height: 100%;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        font: var(--fs) / 1.4 var(--font);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .frame > .title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 1.6em;
        padding: 2px 4px 2px 10px;
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .frame > .title h2 {
        flex: 1;
        margin: 0;
        font-size: var(--fs);
        font-weight: 700;
        color: inherit;
      }
      .frame > .title .close {
        margin-left: auto;
        padding: 0 6px;
        color: inherit;
        background: none;
        border: 0;
      }
      .frame > .body {
        padding: 12px 16px;
        overflow: auto;
        min-height: 0;
      }
      /* A boxed section with its caption at the top-left. */
      .box {
        position: relative;
        padding: 18px 6px 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .box > .cap {
        position: absolute;
        top: 2px;
        left: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--head);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      /* A goods icon and its amount: a gain, a loss, or greyed out for none. */
      .goods {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .goods img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .goods[data-sign='gain'] {
        color: var(--good);
      }
      .goods[data-sign='loss'] {
        color: var(--bad);
      }
      .goods[data-sign='zero'] {
        color: var(--muted);
        font-weight: 400;
        opacity: 0.6;
      }
      /* The WebGUI's dialogs (src/panels.tsx), modal over the page. */
      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--backdrop);
      }
      .dialog {
        max-width: 36em;
        max-height: 80vh;
      }
      .dialog h2 {
        margin: 0 0 8px;
        font-size: var(--fs-h);
        color: var(--head);
      }
      .dialog .text {
        white-space: pre-wrap;
      }
      .dialog a {
        color: var(--link);
      }
      .dialog input {
        width: 100%;
        box-sizing: border-box;
      }
      .dialog input[type='checkbox'] {
        width: auto;
      }
      .dialog .lots {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .lots label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .lots .name {
        flex: 1;
      }
      .dialog .trade-option {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 4px;
      }
      .dialog .trade-option .text {
        flex: 1;
      }
      .dialog .trade-option input {
        width: 6em;
      }
      .dialog .trade-item {
        display: block;
        margin: 2px 0 2px 1em;
      }
      .dialog h3 {
        margin: 8px 0 4px;
        font-size: var(--fs);
        color: var(--head);
      }
      .dialog .field {
        display: block;
        margin-top: 8px;
      }
      .dialog .choices {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .dialog .modifiers {
        border-collapse: collapse;
      }
      .dialog .modifiers th,
      .dialog .modifiers td {
        padding: 1px 8px;
        text-align: left;
      }
      .dialog .modifiers .value {
        text-align: right;
      }
      .dialog .choices .default {
        font-weight: bold;
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      .dialog .high-score dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 1em;
        margin: 0 0 1em;
      }
      .dialog .high-score dl > div {
        display: contents;
      }
      .dialog .high-score dd {
        margin: 0;
        text-align: right;
      }
      .dialog .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dialog .row .text {
        flex: 1;
      }
      .dialog .pic {
        max-width: 48px;
        max-height: 48px;
        object-fit: contain;
      }
      .dialog .flavour {
        display: block;
        max-width: 100%;
        max-height: 50vh;
        margin: 0 auto 8px;
      }
      .dialog .message[data-dim] .pic,
      .dialog .message[data-dim] .text {
        opacity: 0.4;
      }
      .dialog .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="menubar"></div>
      <div id="map"></div>
    </div>
    <div id="side"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
