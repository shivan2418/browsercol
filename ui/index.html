<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserCol</title>
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- The latin subsets of the fonts (src/fonts.css), so the text and title bars do not change font after they appear. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./src/fonts/noto-sans/noto-sans-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./src/fonts/noto-sans/noto-sans-latin-700-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./src/fonts/cinzel/cinzel-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./src/fonts/cinzel/cinzel-latin-700-normal.woff2"
    />
    <style>
      /*
       * The cascade layers, lowest first (issue 421, docs/adr/0008). A rule in a later layer wins over one in an earlier
       * layer whatever their specificity: a component's rules over the page's base, and a theme's over everything.
       * The page's own styles below are put in their layer by their data-layer attribute (vite.config.ts,
       * layerPageStyles), so the long block keeps its indentation; a component's styles are in its own .css file.
       */
      @layer reset, base, components, theme;
    </style>
    <!-- The page shell, in @layer base: the page itself, the UI scale and dragging. -->
    <style data-layer="base">
      body {
        margin: 0;
        font: var(--fs-s) / 1.4 var(--font);
        background: var(--page);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        height: 100vh;
        /* The browser's own behaviour stays out of the game (issue 263): no bounce or swipe-back, no scrolling page. */
        overflow: hidden;
        overscroll-behavior: none;
        /* No blue selection from a double-click or a drag that misses; text fields, the log and error details keep it. */
        user-select: none;
      }
      input,
      textarea,
      pre {
        user-select: text;
      }
      img {
        -webkit-user-drag: none;
        user-drag: none;
      }
      /*
       * The screen, as a window measures it (issue 380). Inside an element that --ui-zoom scales, vw and vh are scaled
       * too: 94vh is 117% of the screen at 125%. A window's size is capped by these instead, never by a bare vw or vh.
       */
      :root {
        --screen-w: calc(100vw / var(--ui-zoom, 1));
        --screen-h: calc(100dvh / var(--ui-zoom, 1));
      }
      /* FreeCol's display scaling (Preferences): the menus, side panel and windows; the map has its own zoom. */
      #menubar,
      #side,
      .modal > * {
        zoom: var(--ui-zoom, 1);
      }
      /* A thing dragged in a panel (drag.ts): its icon follows the pointer over everything, at the scale it has in its window; nothing is selected and the cursor stays as it is. */
      .drag-ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 2147483647;
        pointer-events: none;
      }
      /* FreeCol marks no place a thing is dragged over: the picture follows the pointer, which shows no-drop except over a place that takes it (drag.ts marks that one with over-target). */
      body[data-dragging],
      body[data-dragging] * {
        cursor: no-drop !important;
        user-select: none;
      }
      body[data-dragging] .over-target,
      body[data-dragging] .over-target * {
        cursor: default !important;
      }
      /* The menu bar across the window, then the map and the side panel below it. */
      #stage {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 12px;
      }
    </style>
    <!--
      Everything not yet moved beside its component (#421): in @layer components, so a component's own file
      (src/*.css) and these meet by specificity and order, as they did in one sheet.
    -->
    <style data-layer="components">
      /* The player may hide the side panel (View menu): the map takes its room. */
      body[data-side-panel='hidden'] #side {
        display: none;
      }
      #game {
        --info-panel-w: 310px;
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      /* FreeCol's minimap (src/minimap-panel.tsx), at the map's bottom-left as CornerMapControls puts it; one of the map controls. */
      #minimap {
        position: absolute;
        left: 0;
        bottom: 0;
        display: flex;
        gap: 6px;
        padding: 6px;
        background: var(--panel);
        border: 2px solid var(--line);
        border-width: 2px 2px 0 0;
        border-radius: 0 6px 0 0;
      }
      body[data-map-controls='hidden'] #minimap {
        display: none;
      }
      #minimap canvas {
        display: block;
        border: 1px solid var(--line);
        cursor: crosshair;
      }
      .minimap-buttons {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
      }
      .minimap-buttons button {
        padding: 2px 6px;
        min-width: 28px;
      }
      .minimap-buttons button[aria-pressed='false'] {
        opacity: 0.6;
      }
      /*
       * With FreeCol's skin (image.skin.MiniMap): the desk with the globe at the skin's size, drawn over the
       * minimap so the desk's legs frame it, and the buttons on the left leg. The places are
       * image.skin.MiniMap.properties': the minimap at 41, 203, each button centred on its point. Only the
       * minimap and the buttons take the pointer, so the map under the globe can still be clicked.
       */
      #minimap.skinned {
        display: block;
        width: 310px;
        height: 359px;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #minimap.skinned canvas {
        position: absolute;
        left: 41px;
        top: 203px;
        border: 0;
        pointer-events: auto;
      }
      #minimap .minimap-skin {
        position: absolute;
        inset: 0;
        background: var(--skin) left top / 100% 100% no-repeat;
      }
      #minimap.skinned .minimap-buttons {
        display: contents;
      }
      #minimap .pictured {
        position: absolute;
        z-index: 1;
        left: 6px;
        width: 32px;
        height: 32px;
        min-width: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
        /* The skin's pictures show a toggle's state; no pressed line over them. */
        outline: none;
        opacity: 1;
        background: var(--normal) center / contain no-repeat;
        pointer-events: auto;
      }
      #minimap .pictured:nth-child(1) {
        top: 218px;
      }
      #minimap .pictured:nth-child(2) {
        top: 254px;
      }
      #minimap .pictured:nth-child(3) {
        top: 290px;
      }
      #minimap .pictured:nth-child(4) {
        top: 321px;
      }
      #minimap .pictured:hover:not(:disabled) {
        background-image: var(--highlighted);
      }
      #minimap .pictured:active:not(:disabled) {
        background-image: var(--pressed);
      }
      #minimap .pictured:disabled {
        background-image: var(--disabled);
        opacity: 1;
      }
      #minimap .pictured:focus-visible {
        outline: 2px solid var(--accent);
      }
      /* FreeCol's InfoPanel (src/info-panel.tsx), at the map's bottom-right as CornerMapControls puts it; one of the map controls. */
      #info-panel {
        position: absolute;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: var(--info-panel-w);
        min-height: 150px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        border-width: 2px 0 0 2px;
        border-radius: 6px 0 0 0;
        font-size: var(--fs-s);
      }
      /*
       * With FreeCol's skin (image.skin.InfoPanel): the desk with the skull on it over the paper, at the skin's
       * size; the panel's contents go in the paper as image.skin.InfoPanel.properties places them. Only the
       * contents take the pointer, so the map under the desk's empty corners can still be clicked.
       */
      #info-panel.skinned {
        width: 310px;
        height: 298px;
        min-height: 0;
        padding: 146px 8px 14px 52px;
        background: var(--skin) left top / 100% 100% no-repeat;
        border: 0;
        border-radius: 0;
        pointer-events: none;
        --ink: var(--paper-ink);
        --muted: var(--paper-muted);
        --head: var(--paper-head);
        --link: var(--paper-link);
      }
      #info-panel.skinned > * {
        pointer-events: auto;
        max-height: 100%;
        overflow: hidden;
      }
      #info-panel.skinned .info-end {
        min-height: 100%;
      }
      body[data-map-controls='hidden'] #info-panel {
        display: none;
      }
      body[data-map-controls='hidden'] #game #map-orders {
        --clear: 0px;
      }
      #info-panel p {
        margin: 0 0 4px;
      }
      #info-panel.info-unit {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .info-picture {
        flex: none;
        min-width: 64px;
        display: flex;
        justify-content: center;
        align-self: center;
      }
      .info-picture img {
        display: block;
        max-width: 96px;
      }
      .info-text {
        flex: 1;
        min-width: 0;
      }
      .info-label {
        font-size: var(--fs);
        color: var(--head);
      }
      .info-units,
      .info-goods {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 6px;
        align-items: center;
      }
      .info-units img {
        height: 32px;
      }
      .info-goods li {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .info-goods img {
        height: 20px;
      }
      .info-end {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 130px;
        text-align: center;
      }
      /* The end turn message fades slowly out and back in, over and over, to draw the eye while the turn waits. */
      .info-end p {
        animation: info-end-pulse 2.4s ease-in-out infinite;
      }
      @keyframes info-end-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .info-end p {
          animation: none;
        }
      }
      /* main.tsx sizes the map's canvas to this box. */
      #map {
        flex: 1;
        min-height: 240px;
        position: relative;
        overflow: hidden;
      }
      /*
       * FreeCol's compass rose (Preferences: display compass rose), where CornerMapControls puts it. It and the
       * order buttons sit in #game beside #map, not in it: in #map the canvas, appended later, painted over them,
       * and the map's own pointer listeners took their clicks too (issue 245).
       */
      #game > #compass {
        position: absolute;
        top: 20px;
        right: 20px;
      }
      /* The frame-rate meter (fps-meter.ts, ?fps or Debug > Show Frame Rate), in the map's top-left corner. */
      #game > .fps-meter {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 2px 6px;
        background: var(--box);
        color: var(--ink);
        border: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      /* The active unit's order buttons, where CornerMapControls puts them. */
      /* Between the minimap and the info panel (main.tsx sets --minimap-w); in a narrow map they wrap upwards. */
      /* Centred on the screen: the room kept at both sides is that of the wider of the minimap and the info panel. */
      #game #map-orders {
        position: absolute;
        --clear: max(var(--minimap-w, 0px), var(--info-panel-w));
        left: calc(var(--clear) + 8px);
        right: calc(var(--clear) + 8px);
        bottom: 8px;
        display: flex;
        flex-wrap: wrap-reverse;
        justify-content: center;
        gap: 4px;
        pointer-events: none;
      }
      #game #map-orders button {
        pointer-events: auto;
      }
      /* With FreeCol's pictures (order-buttons), a button is its picture in four states, as the minimap's are. */
      #game #map-orders .pictured {
        width: 39px;
        height: 39px;
        padding: 0;
        border: 0;
        box-shadow: none;
        background: var(--normal) center / contain no-repeat;
      }
      #game #map-orders .pictured:hover:enabled {
        background-image: var(--highlighted);
      }
      #game #map-orders .pictured:active:enabled {
        background-image: var(--pressed);
      }
      #game #map-orders .pictured:disabled {
        background-image: var(--disabled);
        opacity: 1;
      }
      #game #map-orders .pictured:focus-visible {
        outline: 2px solid var(--accent);
      }
      /* Focus returns here when a window closes (main.tsx); it is a place for keys, not a control with a ring. */
      #map:focus {
        outline: none;
      }
      #map canvas {
        position: absolute;
        inset: 0 auto auto 0;
      }
      #side {
        flex: none;
        width: 348px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
        background: var(--panel);
        border-left: 2px solid var(--line);
        overflow: auto;
      }
      #info {
        white-space: pre;
        overflow: auto;
        min-height: 8em;
        border: 1px solid var(--line);
        background: var(--box);
        font-family: var(--font-mono);
        padding: 4px;
      }
      #out {
        font-family: var(--font-mono);
        color: var(--muted);
        white-space: pre;
        overflow: auto;
        flex: 1;
      }
      /* One save per line, striped; the line is cut short with an ellipsis and its title holds the whole of it. */
      #saves > div {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 1px 2px;
        font-size: 9.5px;
        font-stretch: condensed;
        letter-spacing: -0.02em;
      }
      #saves > div:nth-child(even) {
        background: var(--stripe);
      }
      #saves > div > span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #saves {
        --button-pad: 0 3px;
        --button-pad-pressed: 1px 2px 0 4px;
      }
      #saves button {
        flex: none;
        line-height: 1.5;
      }
      #unasked {
        color: var(--warn);
      }
      #unasked ul {
        margin: 0;
        padding-left: 1.5em;
      }
      /* The menu bar (src/frame.tsx): FreeCol's menus, then the status line at the right. */
      .menubar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px;
        min-height: 26px;
        background: var(--menubar);
        color: var(--menubar-ink);
        font-size: 14px;
      }
      .menubar [role='menubar'] {
        display: flex;
        gap: 2px;
      }
      /*
       * The installed app with the window's title bar given to the page (display_override
       * window-controls-overlay): the menu bar is the title bar, as tall as it and clear of the window's own
       * buttons, which sit over its right end and, on a Mac, its left. env() is in the window's pixels and the bar
       * is scaled by --ui-zoom, so it is divided by it. The bar drags the window; the menus stay clickable.
       */
      @media (display-mode: window-controls-overlay) {
        .menubar {
          box-sizing: border-box;
          min-height: calc(env(titlebar-area-height, 33px) / var(--ui-zoom, 1));
          margin-left: calc(env(titlebar-area-x, 0px) / var(--ui-zoom, 1));
          width: calc(env(titlebar-area-width, 100%) / var(--ui-zoom, 1));
          app-region: drag;
          -webkit-app-region: drag;
        }
        .menubar button,
        .menubar [role='menu'] {
          app-region: no-drag;
          -webkit-app-region: no-drag;
        }
      }
      .menubar .menu {
        position: relative;
      }
      .menubar button {
        color: inherit;
        background: none;
        border: 0;
        border-radius: 3px;
        padding: 3px 9px;
      }
      .menubar button:hover,
      .menubar button[aria-expanded='true'] {
        background: var(--btn);
        color: var(--btn-ink);
      }
      .menubar [role='menu'] {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 10;
        /* As wide as its longest entry and hotkey, not the menu-bar button it hangs from. */
        width: max-content;
        min-width: 12em;
        display: flex;
        flex-direction: column;
        padding: 2px;
      }
      .menubar [role='menu'] button {
        text-align: left;
        white-space: nowrap;
      }
      /* An entry's hotkey, at the right of its label. */
      .menubar [role='menu'] .hint {
        float: right;
        margin-left: 1.5em;
        font: inherit;
        opacity: 0.65;
      }
      /* A submenu's entries (Swing's JMenu), opened below it and indented. */
      .menubar [role='menu'] button.nested {
        padding-left: 1.8em;
      }
      /* A switch's tick, in the space before its label. */
      .menubar [role='menu'] .tick {
        display: inline-block;
        width: 1.2em;
      }
      /* A right-click menu (src/popup-menu.tsx): at the pointer, over the map and every dialog. */
      .popup {
        position: fixed;
        z-index: 100;
        min-width: 12em;
        max-width: 28em;
        max-height: 90vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 2px;
        font-size: var(--fs-s);
      }
      .popup button {
        text-align: left;
        padding: 3px 10px;
        background: transparent;
        color: inherit;
        border: 0;
        font: inherit;
      }
      /* A work entry's goods, before its label. */
      .popup button .icon {
        height: 1.3em;
        width: auto;
        vertical-align: middle;
        margin-right: 6px;
      }
      .popup button:hover:enabled {
        background: var(--btn);
        color: var(--btn-ink);
      }
      .popup button:disabled {
        color: var(--muted);
        cursor: default;
      }
      .popup button[data-gap] {
        border-top: 1px solid var(--line);
      }
      .popup button[data-indent] {
        padding-left: 24px;
        font-style: italic;
      }
      /* The turn change banner (src/turn-banner.tsx), over the top of the map, centred on the map, not the window. */
      .turn-banner {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        padding: 6px 18px;
        background: var(--menubar);
        color: var(--menubar-ink);
        border: 2px solid var(--line);
        font: var(--fs-h) / 1.4 var(--font);
        pointer-events: none;
      }
      /* A new turn's banner stays solid, then fades out over its last stretch; its length is set inline. */
      .turn-banner.new {
        animation: turn-banner-fade linear forwards;
      }
      @keyframes turn-banner-fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .turn-banner.ai {
        font-style: italic;
      }
      /* A preference that waits for a reload (src/reload-notice.tsx): small, at the foot of the map, out of the way. */
      .reload-notice {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        padding: 3px 12px;
        background: var(--menubar);
        color: var(--menubar-ink);
        border: 1px solid var(--line);
        font: var(--fs-s) / 1.4 var(--font);
        opacity: 0.9;
        pointer-events: none;
      }
      /* The nation's colour beside the name of the player who is moving. */
      .turn-banner-swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        border: 1px solid var(--line);
        vertical-align: baseline;
      }
      /* Errors the player must see (src/errors.tsx), over everything, until dismissed. */
      .error-banner {
        position: fixed;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: min(40em, calc(100vw - 32px));
        max-height: calc(100vh - 96px);
        overflow: auto;
        box-sizing: border-box;
        padding: 10px 14px;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--bad);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
        font: var(--fs) / 1.4 var(--font);
      }
      .error-banner h2 {
        margin: 0 0 4px;
        font-size: var(--fs-h);
        color: var(--bad);
      }
      .error-banner p {
        margin: 0 0 8px;
      }
      .error-banner ul {
        margin: 0 0 8px;
        padding-left: 1.2em;
      }
      .error-banner pre {
        max-height: 12em;
        overflow: auto;
        margin: 4px 0;
        padding: 6px;
        background: var(--box);
        font: var(--fs-s) / 1.3 var(--font-mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .menubar .status {
        margin-left: auto;
        padding-right: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* The Beta tag (src/feedback-dialog.tsx) at the bar's right end, after the status line. */
      .menubar .beta-tag {
        flex: none;
        padding: 1px 8px;
        border: 1px solid var(--line);
        font-size: var(--fs-s);
        white-space: nowrap;
      }
      /* The WebGUI's dialogs (src/panels.tsx), modal over the page. */
      .modal {
        position: fixed;
        inset: 0;
        display: grid;
        /* One cell the size of the screen, so no window grows past it: a tall one scrolls inside instead. */
        grid-template: minmax(0, 1fr) / minmax(0, 1fr);
        place-items: center;
        background: var(--backdrop);
      }
      /* A dialog over a panel sits in the same place, on top of it. */
      .modal > * {
        position: relative;
        grid-area: 1 / 1;
        max-width: 100%;
        max-height: 100%;
        /* A grid item is at least as tall as its content otherwise, whatever its max-height says. */
        min-height: 0;
        min-width: 0;
      }
      /*
       * A window laid out at fixed sizes (frame.tsx's fit: the colony panel, an advisor's paper) keeps its own size
       * and is scaled to fit the screen instead: --fit is the UI scale, or less where the window would not fit.
       */
      .modal > [data-fit] {
        zoom: var(--fit, var(--ui-zoom, 1));
        --screen-w: calc(100vw / var(--fit, var(--ui-zoom, 1)));
        --screen-h: calc(100dvh / var(--fit, var(--ui-zoom, 1)));
        max-width: none;
        max-height: none;
      }
      .dialog {
        max-width: 36em;
        max-height: calc(var(--screen-h) * 0.8);
      }
      /* Scroll bars, selected text and the caret, from the tokens. */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line) var(--box);
      }
      ::selection {
        background: var(--accent);
        color: var(--panel);
      }
      /*
       * DeclarationPanel: the window is the picture of the Declaration, at FreeCol's size and shrunk only to fit
       * the page. The signature is a canvas over it, placed in the script.
       */
      .modal > .declaration {
        position: relative;
        max-width: none;
        flex: none;
        cursor: pointer;
        filter: drop-shadow(0 10px 24px rgb(0 0 0 / 45%));
      }
      .declaration img,
      .declaration .paper {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
      }
      .declaration .paper {
        background: var(--paper-ink);
        opacity: 0.1;
      }
      .declaration canvas {
        color: var(--paper-ink);
        position: absolute;
        pointer-events: none;
      }
      /* Europe (src/panels.tsx), as EuropePanel lays it out: the ships, the docks and cargo, the market. */
      /* Europe is a large window over the map. The top bar stays clear above its backdrop, as the gold is read there. */
      body:has(.dialog[data-kind='europe']) #menubar {
        position: relative;
        z-index: 1;
        pointer-events: none;
      }
      /* As Swing's EuropePanel: the name centred, the lists and the sales above the market, the buttons below. */
      .europe-title {
        display: flex;
        justify-content: center;
        align-items: baseline;
      }
      .europe-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      .europe-top {
        display: flex;
        gap: 8px;
        align-items: stretch;
        flex: 1;
        min-height: 0;
      }
      .europe-top > .europe {
        flex: 1;
        min-width: 0;
      }
      /* The turn's purchases and sales (EuropePanel's transaction log), newest last; it scrolls when long. */
      .europe-log {
        flex: 0 0 25%;
        box-sizing: border-box;
        overflow: auto;
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
      }
      .europe-log .entry + .entry {
        margin-top: 8px;
      }
      .europe-log .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      .europe {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(auto, 1fr) minmax(auto, 1fr) minmax(auto, 1fr);
        gap: 8px;
        overflow: auto;
      }
      .europe [data-list='docks'] {
        grid-row: span 2;
      }
      .europe-body > .market {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 8px;
      }
      /* The shop popup: every unit a card of the same size, its picture, name and price stacked. */
      .shop-modal {
        z-index: 5;
      }
      .shop-popup {
        max-width: min(40em, calc(var(--screen-w) * 0.94));
      }
      .shop-popup .cards {
        display: grid;
        /* auto-fit: columns no card fills take no room, so the cards sit centred in the window. */
        grid-template-columns: repeat(auto-fit, 9em);
        gap: 8px;
        justify-content: center;
        overflow: auto;
      }
      .shop-popup .card {
        box-sizing: border-box;
        width: 9em;
        height: 8.6em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px;
        text-align: center;
        color: var(--ink);
      }
      /* The picture has a slot of its own height, and the name room for two lines, so a one-line name or a short picture moves nothing. */
      .shop-popup .card .name {
        min-height: 2.4em;
        display: flex;
        align-items: center;
        line-height: 1.2;
      }
      .shop-popup .card .price {
        min-height: 1.4em;
        font-variant-numeric: tabular-nums;
      }
      /*
       * What can be picked in Europe (a ship in port) takes the selected look when it is (src/selection.css), with the
       * same 4px of room on every side as in the colony (src/colony-panel.css), so the tint never sits tight against
       * the content.
       */
      .europe [data-list='inPort'] button.europe-entry {
        padding: 4px;
        border: none;
        border-radius: 4px;
        box-sizing: border-box;
      }
      /* The market's goods, eight to a row (it took bold, centred rows and 24px pictures from GoodsAmount's rules by its class name). */
      .europe-body .market-goods {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px 8px;
        margin-top: 8px;
        align-items: center;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .europe-body .market-goods img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .europe-body .good {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      /* The market's goods and the cargo's stacks are buttons (they trade), but look as Swing's labels do. */
      .europe-body button.good,
      /* At less weight than the selected look, so a picked entry shows it. */
      :where(.europe) button.europe-entry {
        background: none;
        border: none;
        padding: 0;
        color: var(--ink);
      }
      /* Goods are traded by a click, not picked: nothing lights up under the pointer, as in FreeCol. */
      /* Focus is a line, never a tint, so it is not taken for a pick. */
      .europe [data-list='inPort'] button.europe-entry:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .europe-body .price {
        font-variant-numeric: tabular-nums;
      }
      /* The Preferences window (src/prefs-dialog.tsx): FreeCol's category tree, and the picked one's options. */
      #preferences .prefs-body {
        display: flex;
        gap: 8px;
        align-items: stretch;
        width: min(46em, var(--screen-w) - 32px);
        height: min(32em, calc(var(--screen-h) * 0.7));
      }
      #preferences .prefs-side {
        flex: 0 0 11em;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
      }
      #preferences .prefs-search {
        width: 100%;
        box-sizing: border-box;
      }
      #preferences .prefs-tree {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #preferences .prefs-tree button,
      #preferences .prefs-tree .heading {
        display: block;
        width: 100%;
        padding: 3px 6px;
        border: 0;
        border-radius: 2px;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      /* The picked category takes the selected look (src/selection.css); these are at less weight, so it shows. */
      :where(#preferences .prefs-tree) button {
        background: none;
      }
      :where(#preferences .prefs-tree) button:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      /* While searching: the categories with no match fade, and the matched text is marked. */
      #preferences .prefs-tree [data-dim] {
        opacity: 0.4;
      }
      #preferences .prefs-tree [data-match] {
        font-weight: 700;
      }
      #preferences mark {
        background: color-mix(in srgb, var(--accent) 35%, transparent);
        color: inherit;
        border-radius: 2px;
      }
      #preferences .prefs-results .result {
        margin: 0 0 8px;
      }
      #preferences .prefs-results .path {
        color: var(--muted);
        font-size: var(--fs-s);
      }
      #preferences .prefs-tree .heading {
        color: var(--head);
        font-weight: 700;
      }
      #preferences .prefs-detail {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
      }
      #preferences .prefs-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .linkish {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        text-decoration: underline;
      }
      #credits .credits-body {
        max-height: calc(var(--screen-h) * 0.7);
        overflow-y: auto;
      }
      /* The log (src/log.tsx), over the error banner (z-index 1000) it may be opened from. */
      .modal:has(#log) {
        z-index: 1001;
      }
      #log .log-text {
        width: min(60em, calc(var(--screen-w) * 0.9));
        height: calc(var(--screen-h) * 0.6);
        overflow: auto;
        margin: 0 0 8px;
        padding: 6px;
        background: var(--box);
        font: var(--fs-s) / 1.3 var(--font-mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #credits ul {
        margin: 0;
        padding-left: 1.2em;
      }
      /*
       * A caption with two lines' room (Box twoLines): a long ship's name wraps into room already kept, so picking
       * another ship never shifts the layout. Longer still, it is cut at two lines.
       */
      .box > .cap[data-two-lines] {
        flex: 1 1 100%;
        min-width: 0;
        min-height: 2lh;
        max-height: 2lh;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }
      /* A grey wash while the window lacks keyboard focus, so it is obvious
         that keys will not reach the game; its strength is a preference
         (data-dim-unfocused: off, light, normal or heavy). */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 100000;
      }
      body[data-dim-unfocused='light']::after {
        background: rgba(128, 128, 128, 0.18);
      }
      body[data-dim-unfocused='normal']::after {
        background: rgba(128, 128, 128, 0.32);
        backdrop-filter: grayscale(0.5);
      }
      body[data-dim-unfocused='heavy']::after {
        background: rgba(128, 128, 128, 0.5);
        backdrop-filter: grayscale(1);
      }
      body:not([data-dim-unfocused='off'])[data-unfocused='true']::after {
        opacity: 1;
      }
      /*
       * The loading screen (issue 265, src/loading.ts): up from the first paint, over the page, until the start
       * screen or the map is ready. Tokens only (docs/adr/0004); it never takes a click: the page under it
       * is the one the scripts and the player act on. data-state: loading, leaving (fading), done, failed.
       */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 900; /* over the page's windows, under the error banner (1000) */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--page);
        color: var(--menubar-ink);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.25s;
      }
      #loading[data-state='leaving'] {
        opacity: 0;
      }
      /* A browser without Wasm GC (src/entry.ts): the message in place of the progress bar. */
      #loading[data-state='unsupported'] [data-loading-track] {
        display: none;
      }
      #loading[data-state='done'] {
        display: none;
      }
      /* The frame: a double rule, as on a map's cartouche. */
      #loading [data-loading-frame] {
        box-sizing: border-box;
        width: min(1000px, calc(100% - 32px));
        padding: clamp(20px, 5vw, 44px);
        border: 4px double color-mix(in srgb, var(--menubar-ink) 60%, transparent);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      /* The wordmark: BROWSERCOL with a globe for each O. The letters are paths in the text colour. */
      #loading [data-loading-mark] {
        width: 100%;
        margin-bottom: 10px;
      }
      #loading [data-loading-mark] svg {
        display: block;
        width: 100%;
        height: auto;
      }
      #loading [data-loading-mark] image {
        opacity: 0;
        transition: opacity 0.3s;
      }
      #loading [data-loading-mark] image[data-ready] {
        opacity: 1;
      }
      #loading [data-loading-track] {
        width: 100%;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--box);
        overflow: hidden;
      }
      #loading [data-loading-bar] {
        --loaded: 0%;
        width: var(--loaded);
        height: 100%;
        background: var(--accent);
        transition: width 0.15s;
      }
      #loading[data-state='failed'] [data-loading-bar] {
        --loaded: 100%;
        background: var(--bad);
      }
      #loading p {
        margin: 0;
        min-height: 1.4em;
        font: var(--fs-s) / 1.4 var(--font);
      }
      #loading p[data-loading-build] {
        min-height: 0;
        opacity: 0.7;
      }
      /* The notice for phones (src/mobile-notice.ts, issue 319): over the loading screen, which takes no click. */
      #mobile-notice {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 950;
        box-sizing: border-box;
        max-width: 460px;
        margin: 0 auto;
        padding: 14px 16px;
        background: var(--box);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 4px;
        font: var(--fs-s) / 1.4 var(--font);
      }
      #mobile-notice h2 {
        margin: 0 0 6px;
        font: 700 var(--fs-h) / 1.2 var(--font-title);
      }
      #mobile-notice p {
        margin: 0 0 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading,
        #loading [data-loading-mark] image,
        #loading [data-loading-bar] {
          transition: none;
        }
      }
    </style>
  </head>
