        flex-wrap: wrap;
        gap: 3px;
        min-height: 22px;
        align-items: center;
      }
      .dialog .chips .muted {
        font-size: var(--fs-s);
      }
      .dialog .chip {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 1px 6px 1px 2px;
        border-radius: 10px;
        font-size: var(--fs-s);
      }
      .dialog .chip[data-work='unload'] {
        background: color-mix(in srgb, var(--bad) 22%, var(--box));
        color: var(--bad);
      }
      .dialog .chip[data-work='load'] {
        background: color-mix(in srgb, var(--good) 22%, var(--box));
        color: var(--good);
      }
      .dialog .chips .work {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        margin-right: 6px;
      }
      .dialog .chips .arrow {
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .dialog .chip[data-work='keep'] {
        background: transparent;
        color: var(--muted);
        opacity: 0.7;
      }
      .dialog .vleg {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 8px;
      }
      .dialog .vleg .rail {
        justify-self: center;
        width: 4px;
        background: repeating-linear-gradient(var(--line) 0 8px, transparent 8px 13px);
      }
      /* The leg: the holds the carrier leaves with. The edited one has a strong border and the goods under it. */
      .dialog .vleg .ship {
        display: grid;
        gap: 6px;
        justify-self: start;
        max-width: 100%;
        margin: 4px 0;
        padding: 4px 8px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: pointer;
      }
      .dialog .vleg[data-back] .ship {
        border-style: dashed;
      }
      .dialog .vleg[data-open] .ship {
        border: 2px solid var(--head);
        cursor: auto;
      }
      .dialog .shiprow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .dialog .vleg .to {
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .dialog .vleg .copy {
        font-size: var(--fs-s);
      }
      /* A hold is 100 goods: a full one empties on click (a ✕ shows on hover), "+" edits the leg. */
      .dialog .holds {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }
      .dialog .hold {
        position: relative;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 2px;
      }
      .dialog .hold .pic.small {
        max-width: 28px;
        max-height: 28px;
      }
      .dialog .hold.empty {
        background: transparent;
        border-style: dashed;
        color: var(--muted);
      }
      .dialog .hold[data-over] {
        border-color: var(--bad);
        outline: 2px solid var(--bad);
        outline-offset: -3px;
        background: color-mix(in srgb, var(--bad) 22%, var(--box));
      }
      /* Where a 2-, 4- or 6-hold carrier is full. */
      .dialog .mark {
        align-self: stretch;
        display: grid;
        place-items: end center;
        width: 12px;
        margin: 0 1px;
        border-left: 2px solid var(--line);
        color: var(--muted);
        font-size: 10px;
        cursor: help;
      }
      .dialog .legedit {
        display: grid;
        gap: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
      }
      .dialog .legedit .hint {
        margin: 0;
        max-width: 60ch;
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .dialog .legedit .hint b {
        color: var(--ink);
      }
      .dialog .palette {
        display: grid;
        grid-template-columns: repeat(auto-fill, 34px);
        gap: 3px;
      }
      .dialog .palette button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
      }
      .dialog .palette .pic {
        max-width: 28px;
        max-height: 28px;
      }
      @media (max-width: 480px) {
        .dialog .vstop {
          grid-template-columns: 34px 1fr auto;
        }
        /* On a phone the chips go under the name, the ✕ stays beside it. */
        .dialog .vstop .chips {
          grid-row: 2;
          grid-column: 2 / -1;
        }
      }
      .dialog .goods {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8em, 1fr));
        gap: 4px;
        margin-top: 8px;
      }
      .dialog .error {
        color: var(--bad);
      }
      .dialog .pic.small {
        max-width: 20px;
        max-height: 20px;
        vertical-align: middle;
      }
      /* Europe (src/panels.tsx), as EuropePanel lays it out: the ships, the docks and cargo, the market. */
      /* Europe is a large window over the map. The top bar stays clear above its backdrop, as the gold is read there. */
      body:has(.dialog[data-kind='europe']) #menubar {
        position: relative;
        z-index: 1;
        pointer-events: none;
      }
      .dialog[data-kind='europe'] {
        box-sizing: border-box;
        width: min(80em, calc(var(--screen-w) * 0.96));
        height: min(52em, calc(var(--screen-h) * 0.88));
        max-width: none;
        max-height: none;
      }
      .dialog[data-kind='europe'] > .body {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      /* As Swing's EuropePanel: the name centred, the lists and the sales above the market, the buttons below. */
      .europe-title {
        display: flex;
        justify-content: center;
        align-items: baseline;
      }
      .europe-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      .europe-top {
        display: flex;
        gap: 8px;
        align-items: stretch;
        flex: 1;
        min-height: 0;
      }
      .europe-top > .europe {
        flex: 1;
        min-width: 0;
      }
      /* The turn's purchases and sales (EuropePanel's transaction log), newest last; it scrolls when long. */
      .europe-log {
        flex: 0 0 25%;
        box-sizing: border-box;
        overflow: auto;
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
      }
      .europe-log .entry + .entry {
        margin-top: 8px;
      }
      .europe-log .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      /* A unit of Europe's lists is its picture alone; the name is its tooltip. */
      .europe .chip[data-unit] .name {
        display: none;
      }
      .europe {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(auto, 1fr) minmax(auto, 1fr) minmax(auto, 1fr);
        gap: 8px;
        overflow: auto;
      }
      .europe [data-list='docks'] {
        grid-row: span 2;
      }
      .europe-body > .market {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 8px;
      }
      /* Europe's footer: its buttons at the left, Close alone at the right. */
      .dialog[data-kind='europe'] .buttons {
        justify-content: flex-start;
      }
      .dialog[data-kind='europe'] .buttons [data-answer='close'] {
        margin-left: auto;
      }
      .dialog .shop {
        background: var(--box);
        border: 1px solid var(--line);
        padding: 4px 8px;
        margin-bottom: 8px;
      }
      /* The shop popup: every unit a card of the same size, its picture, name and price stacked. */
      .shop-modal {
        z-index: 5;
      }
      .shop-popup {
        max-width: min(40em, calc(var(--screen-w) * 0.94));
      }
      .shop-popup .cards {
        display: grid;
        /* auto-fit: columns no card fills take no room, so the cards sit centred in the window. */
        grid-template-columns: repeat(auto-fit, 9em);
        gap: 8px;
        justify-content: center;
        overflow: auto;
      }
      .shop-popup .card {
        box-sizing: border-box;
        width: 9em;
        height: 8.6em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px;
        text-align: center;
        color: var(--ink);
      }
      /* The picture has a slot of its own height, and the name room for two lines, so a one-line name or a short picture moves nothing. */
      .shop-popup .card .pic {
        flex: none;
        width: 48px;
        height: 48px;
        max-width: none;
        max-height: none;
        object-fit: contain;
        object-position: center bottom;
      }
      .shop-popup .card .name {
        min-height: 2.4em;
        display: flex;
        align-items: center;
        line-height: 1.2;
      }
      .shop-popup .card .price {
        min-height: 1.4em;
        font-variant-numeric: tabular-nums;
      }
      .europe .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .europe .chip {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--ink);
        border-radius: 4px;
      }
      /*
       * What can be picked (a ship, or goods in the colony) takes the selected look when it is (src/selection.css).
       * Everything that can be picked has the same 4px of room on every side, so the tint never sits tight against
       * the content.
       */
      .europe [data-list='inPort'] button.chip,
      .colony .ship,
      .colony [aria-current] {
        padding: 4px;
        border: none;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .europe-body .goods {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px 8px;
      }
      .europe-body .good {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .europe-body .good[data-disabled] {
        opacity: 0.4;
      }
      /* The market's goods and the cargo's stacks are buttons (they trade), but look as Swing's labels do. */
      .europe-body button.good,
      /* At less weight than the selected look, so a picked chip shows it. */
      :where(.europe) button.chip {
        background: none;
        border: none;
        padding: 0;
        color: var(--ink);
      }
      /* Goods are traded by a click, not picked: nothing lights up under the pointer, as in FreeCol. */
      /* Dragging by the icon or the name drags the chip: the picture is not a drag of its own. */
      .europe .chip img,
      .europe .chip .name {
        pointer-events: none;
        user-select: none;
      }
      .europe .chip[data-drag] {
        cursor: grab;
      }
      /* Focus is a line, never a tint, so it is not taken for a pick. */
      .europe [data-list='inPort'] button.chip:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .europe-body .price {
        font-variant-numeric: tabular-nums;
      }
      /* The start screen (src/start-screen.tsx): a window of its own over the page, until a game starts. */
      .start {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--ink);
        font: var(--fs) / 1.4 var(--font);
      }
      .start-window {
        width: min(32em, 92vw);
        /* Open option editors can make it taller than the page: it scrolls, so Start stays reachable. */
        max-height: 96vh;
        overflow-y: auto;
        padding: 0 0 12px;
        background: var(--panel);
        border: 2px solid var(--line);
        box-shadow: 0 10px 40px rgb(0 0 0 / 45%);
      }
      .start-window h1 {
        margin: 0;
        padding: 6px 16px;
        font-family: var(--font-title);
        font-size: var(--fs-h);
        background: var(--menubar);
        color: var(--menubar-ink);
      }
      .start-window fieldset {
        margin: 8px 16px 0;
        padding: 6px 10px 8px;
        border: 1px solid var(--line);
        background: var(--box);
      }
      .start-window legend {
        padding: 0 4px;
        color: var(--head);
      }
      .start-window .nations {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .start-window .nation {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 3px 6px;
        border: 1px solid transparent;
      }
      .start-window .swatch {
        /* In running text (the other nations) an inline swatch has no width, and shows as a bar. */
        display: inline-block;
        vertical-align: middle;
        width: 14px;
        height: 14px;
        border: 1px solid var(--line);
      }
      .start-window .nation .name {
        flex: 1;
      }
      .start-window .nation .type,
      .start-window .quiet {
        color: var(--muted);
        font-size: var(--fs-s);
        font-weight: normal;
      }
      .start-window .quiet {
        margin: 6px 0 0;
      }
      /* The Loading Save game window (src/loading-save.tsx): one choice or field a line. */
      .start-window fieldset > label {
        display: block;
        padding: 2px 0;
      }
      .start-window .loading-save-name {
        margin: 0 16px;
      }
      .start-window fieldset > .ui-select {
        width: 100%;
        padding: 3px;
      }
      .start-window .customize {
        margin-top: 6px;
      }
      .save-picker {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        max-height: 14em;
        overflow-y: auto;
      }
      .save-picker li {
        display: flex;
        gap: 4px;
      }
      .save-picker button {
        flex: 1;
        text-align: left;
      }
      /* Export save... sits at the end of the save's line, as wide as its text. */
      .save-picker button[data-export-save] {
        flex: none;
      }
      /* A save's line (name | saved | turn | nation) fits on one line: wider than other dialogs where the screen allows. */
      #open-game.dialog,
      #save-game.dialog {
        max-width: min(50em, calc(var(--screen-w) * 0.94));
      }
      .start-window .customize .options {
        max-height: 18em;
        overflow-y: auto;
        margin-top: 6px;
      }
      /* The option editor (src/option-editor.tsx), on the start screen and in the in-game panel. */
      .options .option {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 1px 0;
      }
      .options .option .name {
        flex: 1;
      }
      .options .option[data-changed] .name {
        font-weight: bold;
      }
      .options .ui-number {
        width: 8em;
      }
      .options input[type='text'],
      .options .ui-select {
        width: 14em;
      }
      .options .slider {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      /* A slider's track and handle: a framed groove and a button-like knob. */
      .options .slider input[type='range'] {
        appearance: none;
        width: 10em;
        height: 1.2em;
        padding: 0;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .options .slider input[type='range']:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .options .slider input[type='range']:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .options .slider input[type='range']::-webkit-slider-runnable-track {
        height: 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']::-moz-range-track {
        height: 6px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']::-webkit-slider-thumb {
        appearance: none;
        width: 0.9em;
        height: 1.2em;
        margin-top: -7px;
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']::-moz-range-thumb {
        box-sizing: border-box;
        width: 0.9em;
        height: 1.2em;
        background: var(--btn);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .options .slider input[type='range']:hover::-webkit-slider-thumb {
        border-color: var(--accent);
      }
      .options .slider input[type='range']:hover::-moz-range-thumb {
        border-color: var(--accent);
      }
      /* A file option's picked name sits beside its Choose button. */
      .options .file {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .options .slider output {
        min-width: 3.5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .options .mute {
        min-width: 5em;
      }
      .options .option:has(.mute[aria-pressed='true']) .slider {
        opacity: 0.5;
      }
      .options input[aria-invalid] {
        outline: 2px solid var(--bad);
      }
      /* The Preferences window (src/prefs-dialog.tsx): FreeCol's category tree, and the picked one's options. */
      #preferences .prefs-body {
        display: flex;
        gap: 8px;
        align-items: stretch;
        width: min(46em, var(--screen-w) - 32px);
        height: min(32em, calc(var(--screen-h) * 0.7));
      }
      #preferences .prefs-side {
        flex: 0 0 11em;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
      }
      #preferences .prefs-search {
        width: 100%;
        box-sizing: border-box;
      }
      #preferences .prefs-tree {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
        background: var(--box);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #preferences .prefs-tree button,
      #preferences .prefs-tree .heading {
        display: block;
        width: 100%;
        padding: 3px 6px;
        border: 0;
        border-radius: 2px;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      /* The picked category takes the selected look (src/selection.css); these are at less weight, so it shows. */
      :where(#preferences .prefs-tree) button {
        background: none;
      }
      :where(#preferences .prefs-tree) button:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      /* While searching: the categories with no match fade, and the matched text is marked. */
      #preferences .prefs-tree [data-dim] {
        opacity: 0.4;
      }
      #preferences .prefs-tree [data-match] {
        font-weight: 700;
      }
      #preferences mark {
        background: color-mix(in srgb, var(--accent) 35%, transparent);
        color: inherit;
        border-radius: 2px;
      }
      #preferences .prefs-results .result {
        margin: 0 0 8px;
      }
      #preferences .prefs-results .path {
        color: var(--muted);
        font-size: var(--fs-s);
      }
      #preferences .prefs-tree .heading {
        color: var(--head);
        font-weight: 700;
      }
      #preferences .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin: 8px 0 0;
      }
      .customize .tools {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .options .units .unit {
        display: flex;
        gap: 4px;
        align-items: center;
        margin: 2px 0;
      }
      #preferences .prefs-detail {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
      }
      #preferences .prefs-detail .options .option {
        padding: 2px 0;
      }
      #preferences .prefs-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .dialog[data-kind='options'] .options {
        max-height: calc(var(--screen-h) * 0.6);
        overflow-y: auto;
      }
      .start-window .buttons {
        display: flex;
        justify-content: flex-end;
        margin: 12px 16px 0;
      }
      /*
       * The new game window (issue 311): wide, with what most players change in three columns and the rarely
       * changed settings in a row of disclosures under them, so nothing usual needs a scroll at 1280x800.
       */
      .start-window.new-game {
        width: min(78em, 96vw);
        max-height: 94vh;
        font-size: var(--fs);
      }
      /* Music and sound effects, a small row under Start. */
      .new-game .sound-toggles {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .new-game .sound-label {
        color: var(--head);
        margin-right: 2px;
      }
      .new-game .sound-toggle {
        padding: 1px 8px;
        font-size: var(--fs-s);
      }
      .new-game .sound-toggle[aria-pressed='false'] {
        color: var(--muted);
      }
      .new-game .start-cols {
        display: grid;
        grid-template-columns: minmax(15em, 1fr) minmax(20em, 1.4fr) minmax(14em, 0.9fr);
        gap: 12px;
        margin: 12px 16px 0;
        align-items: stretch;
      }
      .new-game .start-cols fieldset {
        margin: 0;
      }
      .new-game .col-others,
      .new-game .col-game {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .new-game .field-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        margin-top: 2px;
      }
      .new-game .field-grid .ui-select {
        width: 100%;
        padding: 3px;
      }
      .new-game .with-help {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .new-game .with-help .ui-select {
        flex: 1;
      }
      .ui-help-button {
        padding: 1px 7px;
        font-weight: bold;
      }
      .ui-help-popup {
        box-sizing: border-box;
        width: min(46em, var(--screen-w) - 24px);
        max-height: calc(var(--available-height) / var(--ui-zoom, 1));
        overflow-y: auto;
        padding: 8px 12px;
        font-size: var(--fs-s);
      }
      .rules-help p {
        margin: 4px 0;
      }
      .rules-help table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .rules-help thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 4px 0;
        text-align: left;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .rules-help thead th:first-child {
        width: 30%;
      }
      .rules-help td,
      .rules-help-theme th {
        padding: 1px 10px 1px 0;
        vertical-align: top;
        text-align: left;
      }
      .rules-help tbody tr:nth-child(even) {
        background: var(--stripe);
      }
      .rules-help tbody tr.rules-help-theme {
        background: none;
      }
      .rules-help-theme th {
        padding-top: 10px;
        border-bottom: 1px solid var(--line);
      }
      .rules-help th.rules-help-what {
        padding: 1px 10px 1px 0;
        vertical-align: top;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .new-game .pedia {
        display: block;
        margin-top: 6px;
        color: var(--link);
        font-size: var(--fs-s);
      }
      .new-game .quiet .pedia {
        display: inline;
      }
      .new-game .rival-groups {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
      }
      .new-game .rival-group h3 {
        margin: 0 0 2px;
        font-size: var(--fs);
        font-weight: normal;
        color: var(--head);
      }
      .new-game .rivals {
        display: flex;
        flex-direction: column;
      }
      .new-game .rivals > label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
      }
      .new-game .start-button {
        padding: 12px;
        font-size: var(--fs-h);
        font-weight: bold;
        border-color: var(--accent);
      }
      .new-game .saved-games {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .new-game .saved-games p {
        margin: 0;
      }
      /* The rarely changed settings: a row of tabs, and the open tab's panel under it. */
      .new-game .more-options {
        --tab-panel: var(--box);
        margin: 12px 16px 0;
      }
      /*
       * The open panel has the window's width, its options flow in columns, and it scrolls on its own, with a
       * height that keeps the window within the page at 1280x800.
       */
      .new-game .more-options [role='tabpanel'] {
        /* Directly under the row's line, not the 6px a .customize panel keeps from what is above. */
        margin-top: 0;
        max-height: max(10em, calc(100vh - 680px));
        overflow-y: auto;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-top: 0;
        background: var(--box);
      }
      .new-game .more-options [role='tabpanel'][hidden] {
        display: none;
      }
      .new-game .more-options .options {
        max-height: none;
        overflow: visible;
        margin-top: 0;
        columns: 24em;
        column-gap: 24px;
      }
      .new-game .more-options .options .option {
        break-inside: avoid;
      }
      .new-game .colour-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
        gap: 4px 12px;
        margin-top: 6px;
      }
      /* Narrower: the nation beside the game and Start, the other nations under them. */
      @media (max-width: 1000px) {
        .new-game .start-cols {
          grid-template-columns: 1fr 1fr;
        }
        .new-game .col-game {
          order: 1;
        }
        .new-game .col-others {
          order: 2;
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 640px) {
        .new-game .start-cols {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 420px) {
        .new-game .rival-groups {
          grid-template-columns: 1fr;
        }
      }
      /* Wider and taller: the same layout, larger. */
      @media (min-width: 1600px) and (min-height: 960px) {
        .start-window.new-game {
          --fs: 17px;
          --fs-s: 15px;
          /* A box's caption is one step under the small size, here as everywhere. */
          --caption-size: calc(var(--fs-s) - 1px);
          --fs-h: 20px;
        }
      }
      /* The licence, source and credits links under the start window (src/credits.tsx). */
      .start .source-links {
        margin: 12px 16px 0;
        color: var(--menubar-ink);
        font-size: var(--fs-s);
      }
      .start .source-links a,
      .start .source-links .linkish {
        color: inherit;
      }
      .linkish {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        text-decoration: underline;
      }
      #credits .credits-body {
        max-height: calc(var(--screen-h) * 0.7);
        overflow-y: auto;
      }
      /* The log (src/log.tsx), over the error banner (z-index 1000) it may be opened from. */
      .modal:has(#log) {
        z-index: 1001;
      }
      #log .log-text {
        width: min(60em, calc(var(--screen-w) * 0.9));
        height: calc(var(--screen-h) * 0.6);
        overflow: auto;
        margin: 0 0 8px;
        padding: 6px;
        background: var(--box);
        font: var(--fs-s) / 1.3 var(--font-mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #credits ul {
        margin: 0;
        padding-left: 1.2em;
      }
      .dialog .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      /* The colony panel (src/colony-panel.tsx), laid out as Swing's ColonyPanel (look E, docs/adr/0004). */
      .dialog[data-kind='colony'] {
        max-width: none;
        /* Its own width, whatever the screen's: it is scaled to fit instead (fit in colony-panel.tsx). */
        width: 1180px;
      }
      /* Buildings fill the left; the right column holds the population, tiles, production, construction and port; units outside and the warehouse run along the bottom. */
      .colony .cbody {
        /*
         * The fixed heights of the boxes that hold units and goods (see .colony .outside): the content (a row is
         * the tallest unit, a mounted scout or dragoon, with its label, and the warehouse's goods with their amounts, sized by art plus text (in em, so a larger font still fits) as measured with box-shots.ts --sizes 1; the warehouse's is a line of
         * goods) with the caption, the padding and the border round it. A caption that wraps takes more of it, and
         * the box scrolls.
         */
        /* The caption's block, the 6px row gap under it (the boxes' gap), the padding at the bottom and the border. */
        --colony-box-frame: calc(var(--box-cap-block) + 6px + var(--box-pad) + 2 * var(--box-border));
        --colony-row: calc(85px + 0.2em + var(--colony-box-frame));
        --colony-warehouse: calc(28px + 1.5em + var(--colony-box-frame));
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 6px;
        align-items: start;
      }
      .colony .icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
        vertical-align: middle;
      }
      .colony .unit {
        height: 48px;
      }
      /*
       * UnitLabel's occupation chip in the label's top-left corner, beside the figure (ImageLibrary.createChip: a
       * black border round the owner's colour, which the Engine sends), and a damaged unit's repair status.
       */
      .colony .chip {
        position: absolute;
        left: 0;
        top: 0;
        padding: 3px;
        border: 1px solid var(--chip-border);
        background: var(--nation, var(--box));
        color: var(--nation-ink, var(--ink));
        font-family: var(--font);
        font-weight: bold;
        font-size: 10px;
        line-height: 10px;
      }
      .colony .repair {
        position: absolute;
        left: 2px;
        bottom: 2px;
        color: var(--bad);
        font-size: 10px;
        line-height: 11px;
        max-width: 100%;
        overflow: hidden;
      }
      .colony .outside [data-unit],
      .colony .port .ship {
        position: relative;
      }
      /* UnitLabel: the unit at its own size with a 5px margin each side, so the chip sits beside the figure. */
      .colony .outside [data-unit] {
        padding: 0 5px;
      }
      .colony .outside [data-unit] > .unit {
        height: auto;
      }
      /*
       * ColonyPanel's upperRightPanel: the tiles, the net production and the construction, with the population in
       * the four octagons of its wood (cut from image.colony.upperRight.background) in the tiles' corners. The text
       * is drawn as paintComponent draws it: the title font, larger for the size and its change.
       */
      .colony .board {
        position: relative;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .colony .octagon {
        position: absolute;
        z-index: 1;
        width: 68px;
        height: 66px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
        background-repeat: no-repeat;
        background-color: var(--btn);
        color: var(--paper-ink);
        /* Cut into the wood: dark ink with a light edge under each stroke (ticket 376). */
        text-shadow: 0 1px 0 color-mix(in srgb, var(--menubar-ink) 55%, transparent);
        font-family: var(--font-title);
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        padding-top: 3px;
        pointer-events: none;
      }
      /* Smaller as the number gets longer. */
      .colony .octagon.change {
        font-size: 26px;
      }
      .colony .octagon:is(.size, .change)[data-len='3'] {
        font-size: 20px;
      }
      .colony .octagon .pc {
        font-size: 0.68em;
        margin-left: 1px;
      }
      .colony .octagon.size,
      .colony .octagon.rebels {
        left: 2px;
      }
      .colony .octagon.change,
      .colony .octagon.royalists {
        right: 2px;
      }
      .colony .octagon.size,
      .colony .octagon.change {
        top: 2px;
      }
      /* Under the muskets and the crown. */
      .colony .octagon.rebels,
      .colony .octagon.royalists {
        top: 158px;
        align-items: flex-end;
        padding: 0 0 12px;
        font-size: 17px;
      }
      .colony .octagon:is(.rebels, .royalists)[data-len='4'] {
        font-size: 15px;
      }
      .colony .buildings {
        grid-column: 1;
        grid-row: 1;
        /* The open ground: the buildings lie spread over all of it (scatter in colony-panel.tsx). */
        position: relative;
        align-self: stretch;
        min-height: 560px;
      }
      .colony .building {
        position: absolute;
        width: 150px;
        height: 112px;
        transform: translate(-50%, -50%);
        border-radius: 3px;
        overflow: hidden;
      }
      .colony .building .name {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: var(--fs-s);
        font-weight: 600;
      }
      .colony .building .art {
        position: absolute;
        left: 50%;
        top: 22px;
        height: 70px;
        max-width: 92%;
        object-fit: contain;
        transform: translateX(-50%);
        opacity: 0.85;
      }
      .colony .building .output {
        position: absolute;
        right: 4px;
        top: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .colony .made-goods {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
      }
      /* BuildingToolTip, put on the page beside the building the pointer is over. */
      .building-tip {
        position: fixed;
        z-index: 1001;
        max-width: 280px;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: var(--box);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 3px;
        box-shadow: 0 2px 8px var(--backdrop);
        pointer-events: none;
      }
      /* RebelToolTip (a hint, Tip): three columns, the label, then two numbers on the right (MigLayout "[300px][50px, right][50px, right]"). */
      .rebel-tip {
        width: 400px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 1fr 50px 50px;
        align-items: center;
        gap: 6px 10px;
      }
      .rebel-tip .tip-row {
        display: contents;
      }
      .rebel-tip .num {
        text-align: right;
      }
      .rebel-tip .span2 {
        grid-column: span 2;
        justify-self: end;
      }
      .rebel-tip .icon {
        height: 24px;
        vertical-align: middle;
      }
      .rebel-tip .tip-bar {
        grid-column: 1 / -1;
        justify-self: center;
        position: relative;
        width: 80%;
        height: 26px;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .rebel-tip .tip-bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: var(--line);
        opacity: 0.55;
      }
      .rebel-tip .tip-bar i.step {
        opacity: 0.3;
      }
      .rebel-tip .tip-bar .label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .building-tip .tip-name {
        font-size: var(--fs-s);
      }
      .building-tip .tip-production {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .building-tip .art {
        height: 70px;
      }
      .building-tip .tip-workers {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: end;
        gap: 8px;
      }
      .building-tip .tip-worker {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .building-tip .unit,
      .building-tip .placeholder {
        height: 40px;
      }
      .building-tip .unit.student {
        height: 28px;
      }
      .building-tip .breeding {
        margin: 0;
        font-size: var(--fs-s);
        text-align: center;
      }
      .colony .building.site {
        opacity: 0.6;
      }
      .colony .upkeep {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        color: var(--bad);
        font-weight: 700;
      }
      .colony .building .workers {
        position: absolute;
        left: 4px;
        bottom: 2px;
        display: flex;
        align-items: end;
      }
      .colony .upper {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      /* TilesPanel: the map's drawing of the 3x3 (.ground), and over it who works each tile and what it makes. */
      .colony .tiles {
        position: relative;
        flex: none;
      }
      .colony .tiles .ground,
      .colony .tiles .over {
        position: absolute;
        left: 0;
        top: 0;
      }
      .colony .tile {
        position: absolute;
        width: 128px;
        height: 64px;
      }
      .colony .tile .terrain,
      .colony .tile .taken {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .colony .tile .forest {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
      }
      .colony .tile .natives {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* TileViewer: the worker smaller, in the middle of the tile, without a chip. */
      .colony .tile .who {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .colony .tile .who .unit {
        height: 40px;
      }
      /* The yield is held in front of the colonist, over their waist. */
      .colony .tile .made {
        position: absolute;
        left: 50%;
        top: calc(50% - 2px);
        transform: translate(-50%, -50%);
        z-index: 3;
        pointer-events: none;
        display: flex;
        justify-content: center;
        gap: 2px;
        color: var(--box);
        text-shadow:
          0 0 3px var(--ink),
          0 0 3px var(--ink);
      }
      .colony .net,
      .colony .construction {
        width: 100%;
        box-sizing: border-box;
      }
      .colony .net {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .colony .construction {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      /*
       * ConstructionPanel draws the build's picture in a fixed 100x96 box (getSmallBuildableTypeImageWithWithSize),
       * so a tall unit (a wagon train) is scaled down into it and the box and its bars keep their size.
       */
      .colony .construction {
        min-height: 96px;
      }
      .colony .buildable {
        flex: none;
        width: 100px;
        height: 96px;
        object-fit: contain;
      }
      /* ConstructionPanel: the build's name over a bar for each goods it takes, centred beside its picture. */
      .colony .needs {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      /*
       * In port beside the cargo of the ship chosen there, then the units outside, then the warehouse. A window must
       * not change size with what is in it: each of these boxes has the one height FreeCol's scroll panes
       * give it, and more than fits wraps and scrolls inside the box.
       */
      .colony .port,
      .colony .cargo,
      .colony .outside,
      .colony .warehouse {
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: end;
        align-content: flex-start;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .colony .port,
      .colony .cargo,
      .colony .outside {
        height: var(--colony-row);
      }
      .colony .warehouse {
        height: var(--colony-warehouse);
      }
      .colony .upper .buttons {
        width: 100%;
        margin-top: 0;
      }
      .colony .upper .port {
        width: 100%;
        box-sizing: border-box;
      }
      /* Units outside the colony and the cargo of the chosen ship share a line; the cargo sits under the right column. */
      .colony .outside {
        grid-column: 1;
      }
      .colony .cargo {
        grid-column: 2;
      }
      .colony .warehouse {
        grid-column: 1 / -1;
        gap: 6px 14px;
        justify-content: space-between;
      }
      /* The dialogs' goods grid (.dialog .goods) is not the colony's: a goods amount stays as wide as it is. */
      .colony .goods {
        display: inline-flex;
        margin-top: 0;
      }

      /* At less weight than the selected look, so a picked ship shows it. */
      :where(.colony) .ship {
        background: none;
      }
      .colony .ship img {
        display: block;
      }
      /* Moving colonists and goods (colony-panel.tsx): units and goods are dragged, or picked by a click; places take drops and clicks. */
      .colony [data-drag] {
        cursor: grab;
      }
      /* The tiles overlap by their boxes, so only the diamond of each takes a drop, a click or the pointer. */
      .colony .tile {
        pointer-events: none;
      }
      .colony .tile .hit {
        position: absolute;
        inset: 0;
        z-index: 1;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        pointer-events: auto;
      }
      .colony .tile .who {
        z-index: 2;
        pointer-events: auto;
      }
      /* The build queue (BuildQueuePanel): the queue, then what can be added, each listed with the goods it takes. */
      /* What is being built, and a building that can build, open the queue when clicked: nothing lights up, as in FreeCol. */
      .colony .building[data-builds] {
        cursor: pointer;
      }
      .colony {
        position: relative;
        /* Keep the tiles' and queue's z-indexes inside the panel, so a dialog over it stays on top. */
        isolation: isolate;
      }
      .colony .queue-backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--ink) 35%, transparent);
      }
      .colony .queue-body {
        position: absolute;
        z-index: 21;
        /*
         * It sits in the board (the right column, which is positioned for its octagons), so it is anchored to the
         * board's right edge and reaches left over the buildings: the column alone is too narrow for two lists.
         */
        right: 0;
        top: 40px;
        width: 780px;
        max-height: calc(var(--screen-h) * 0.8);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 16px;
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 8px 30px color-mix(in srgb, var(--ink) 50%, transparent);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .colony .queue-body .queued {
        grid-column: 1 / -1;
      }
      .colony .queue-close {
        z-index: 1;
        position: absolute;
        right: 6px;
        top: 6px;
      }
      .colony .queue-body ol,
      .colony .queue-body ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .colony .queue-body li {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .colony .queue-body li > button:only-child {
        flex: 1;
        display: flex;
        gap: 6px;
        align-items: center;
        text-align: left;
      }
      .colony .queue-body li[data-locked] .name {
        color: var(--muted);
      }
      /* One box for every buildable's picture, so every row of the build queue is the same height whatever the art's shape. */
      .colony .buildable-icon {
        width: 48px;
        height: 48px;
        object-fit: contain;
        object-position: center bottom;
      }
      /* The name takes the room left; the costs keep theirs, on one line, after it. */
      .colony .queue-body li .name {
        flex: 1;
        min-width: 0;
      }
      .colony .queue-body .cost {
        flex: none;
        white-space: nowrap;
      }
      .colony .queue-body .reason {
        font-size: 0.85em;
      }
      .colony .queue-body .show-all,
      .colony .queue-body .buy {
        grid-column: 1 / -1;
      }
      .colony .queue-body li[data-drag] {
        cursor: grab;
      }
      .colony .warehouse {
        align-items: center;
      }
      .colony .stored .goods {
        flex-direction: column;
      }
      .colony .stored[data-over='true'] .goods {
        color: var(--bad);
      }
      /* A grey wash while the window lacks keyboard focus, so it is obvious
         that keys will not reach the game; its strength is a preference
         (data-dim-unfocused: off, light, normal or heavy). */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 100000;
      }
      body[data-dim-unfocused='light']::after {
        background: rgba(128, 128, 128, 0.18);
      }
      body[data-dim-unfocused='normal']::after {
        background: rgba(128, 128, 128, 0.32);
        backdrop-filter: grayscale(0.5);
      }
      body[data-dim-unfocused='heavy']::after {
        background: rgba(128, 128, 128, 0.5);
        backdrop-filter: grayscale(1);
      }
      body:not([data-dim-unfocused='off'])[data-unfocused='true']::after {
        opacity: 1;
      }
      /*
       * The loading screen (issue 265, src/loading.ts): up from the first paint, over the page, until the start
       * screen or the map is ready. Tokens only (docs/adr/0004); it never takes a click: the page under it
       * is the one the scripts and the player act on. data-state: loading, leaving (fading), done, failed.
       */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 900; /* over the page's windows, under the error banner (1000) */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--page);
        color: var(--menubar-ink);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.25s;
      }
      #loading[data-state='leaving'] {
        opacity: 0;
      }
      /* A browser without Wasm GC (src/entry.ts): the message in place of the progress bar. */
      #loading[data-state='unsupported'] [data-loading-track] {
        display: none;
      }
      #loading[data-state='done'] {
        display: none;
      }
      /* The frame: a double rule, as on a map's cartouche. */
      #loading [data-loading-frame] {
        box-sizing: border-box;
        width: min(1000px, calc(100% - 32px));
        padding: clamp(20px, 5vw, 44px);
        border: 4px double color-mix(in srgb, var(--menubar-ink) 60%, transparent);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      /* The wordmark: BROWSERCOL with a globe for each O. The letters are paths in the text colour. */
      #loading [data-loading-mark] {
        width: 100%;
        margin-bottom: 10px;
      }
      #loading [data-loading-mark] svg {
        display: block;
        width: 100%;
        height: auto;
      }
      #loading [data-loading-mark] image {
        opacity: 0;
        transition: opacity 0.3s;
      }
      #loading [data-loading-mark] image[data-ready] {
        opacity: 1;
      }
      #loading [data-loading-track] {
        width: 100%;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--box);
        overflow: hidden;
      }
      #loading [data-loading-bar] {
        --loaded: 0%;
        width: var(--loaded);
        height: 100%;
        background: var(--accent);
        transition: width 0.15s;
      }
      #loading[data-state='failed'] [data-loading-bar] {
        --loaded: 100%;
        background: var(--bad);
      }
      #loading p {
        margin: 0;
        min-height: 1.4em;
        font: var(--fs-s) / 1.4 var(--font);
      }
      #loading p[data-loading-build] {
        min-height: 0;
        opacity: 0.7;
      }
      /* The notice for phones (src/mobile-notice.ts, issue 319): over the loading screen, which takes no click. */
      #mobile-notice {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 950;
        box-sizing: border-box;
        max-width: 460px;
        margin: 0 auto;
        padding: 14px 16px;
        background: var(--box);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 4px;
        font: var(--fs-s) / 1.4 var(--font);
      }
      #mobile-notice h2 {
        margin: 0 0 6px;
        font: 700 var(--fs-h) / 1.2 var(--font-title);
      }
      #mobile-notice p {
        margin: 0 0 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading,
        #loading [data-loading-mark] image,
        #loading [data-loading-bar] {
          transition: none;
        }
      }
      /* A number field (src/controls.tsx, Base UI's NumberField): the input with a ▲ and a ▼ button beside it. */
      .ui-number {
        display: inline-block;
      }
      .ui-number-group {
        display: flex;
        align-items: stretch;
      }
      .ui-number .ui-number-input {
        flex: 1;
        min-width: 0;
        width: auto;
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        padding: 2px 4px;
      }
      .ui-number-input:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .ui-number-input:disabled {
        opacity: 0.5;
      }
      .ui-number-step {
        flex: none;
        width: 1.6em;
        padding: 0;
        font-size: 0.6em;
        line-height: 1;
        color: var(--btn-ink);
        background: var(--btn);
        border: 1px solid var(--line);
        border-left-width: 0;
        border-radius: 0;
        cursor: pointer;
      }
      .ui-number-step:last-child {
        border-radius: 0 3px 3px 0;
      }
      .ui-number-step:disabled {
        opacity: 0.5;
      }
    </style>
  </head>
