# BrowserCol: FreeCol+ with shader water and flowing rivers (#409, #411), as an
# art-only mod (the page's ?tileset=browsercol). Each image.* key replaces one of
# FreeCol's; the shader.water.* keys are BrowserCol's own (ui/src/map-water.ts).
#
# Silver: as FreeCol+ (ui/tilesets/freecol-plus/tools/silver.py).
image.tileitem.model.resource.silver=resources/bonus/silver.png

# Water: FreeCol's own ocean, high seas and lake art, drawn as one surface by a
# shader, with shallows and deep water coloured by the nearest land's climate,
# slow bands moving ashore, FreeCol's beach art, and the water drawn again over
# the beach's fade (the clipped beach). A browser that cannot run the shader draws
# FreeCol's frames.
# Bands: pixels per second, pixels between crests; the art's drift in pixels per second.
shader.water.bandSpeed="5"
shader.water.bandSpacing="40"
shader.water.driftSpeed="2"
# How far the shallow shelf reaches from tropical land, in map pixels (about half
# that by other land); how many tiles the land's climates blend over.
shader.water.shelfWidth="90"
shader.water.climateBlend="3"
# The clipped beach: on, with its waterline 2 px inside where FreeCol's beach art covers half.
shader.water.clip="1"
shader.water.clipAt="-2"
# The foam lapping the beach, and how far out it reaches, in map pixels.
shader.water.foam=urn:color:0xe0e8df
shader.water.foamWidth="7"
# Each climate's deep water and shallows.
shader.water.cold.deep=urn:color:0x1b2a33
shader.water.cold.shallow=urn:color:0x5a7378
shader.water.temperate.deep=urn:color:0x123640
shader.water.temperate.shallow=urn:color:0x4d7268
shader.water.tropical.deep=urn:color:0x0c3a4c
shader.water.tropical.shallow=urn:color:0x40c6b9

# Rivers (#411): flowing water in FreeCol's river shapes and pebble banks, in the
# sea's colour for the climate, a little darker, with soft ripples drifting
# downstream and mouths fading into the sea. A minor river runs faster than a major.
shader.water.river.minorSpeed="6"
shader.water.river.majorSpeed="3"
# The ripples' added brightness, 0 to 0.5.
shader.water.river.streakStrength="0.1"
