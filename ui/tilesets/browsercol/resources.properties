# BrowserCol: FreeCol+ with the water and rivers tuned in the water playground
# (#409, #411), as an art-only mod (the page's ?tileset=browsercol). Each image.*
# key replaces one of FreeCol's; the shader.water.* keys are BrowserCol's own.
#
# Silver: as FreeCol+ (ui/tilesets/freecol-plus/tools/silver.py).
image.tileitem.model.resource.silver=resources/bonus/silver.png

# Water: the playground's variant E. FreeCol's own ocean, high seas and lake art,
# drawn as one surface by a shader (ui/src/map-water.ts), with shallows and deep
# water coloured by the nearest land's climate, slow bands moving ashore, FreeCol's
# beach art, and the water drawn again over the beach's fade (the clipped beach).
# A browser that cannot run the shader draws FreeCol's frames.
shader.water.recipe.shallows="climate"
shader.water.recipe.shore="art"
shader.water.recipe.motion="bands"
shader.water.recipe.deep="climate"
shader.water.recipe.depth="deeper"
# Bands: pixels per second, pixels between crests; drift in pixels per second.
shader.water.recipe.bandSpeed="5"
shader.water.recipe.bandSpacing="40"
shader.water.recipe.driftSpeed="2"
# How far the shallow shelf reaches from land, in map pixels; how many tiles climates blend over.
shader.water.recipe.shelfWidth="90"
shader.water.recipe.climateBlend="3"
# The clipped beach: on, with its waterline 2 px inside where FreeCol's beach art covers half.
shader.water.recipe.clip="1"
shader.water.recipe.clipAt="-2"

# Rivers (#411): flowing water in FreeCol's river shapes and pebble banks, in the
# sea's colour for the climate, a little darker, with soft ripples drifting
# downstream and mouths fading into the sea. A minor river runs faster than a major.
shader.water.river.mode="flow"
shader.water.river.minorSpeed="6"
shader.water.river.majorSpeed="3"
# The ripples' added brightness, 0 to 0.5.
shader.water.river.streakStrength="0.1"

# The ripple textures, which the shader needs to start; the recipe draws FreeCol's art in their place.
shader.water.swell=resources/water/swell.png
shader.water.chop=resources/water/chop.png
shader.water.swellSize="640"
shader.water.chopSize="128"
shader.water.shore="signed"
shader.water.ocean=urn:color:0x0c3646
shader.water.highSeas=urn:color:0x092838
shader.water.lake=urn:color:0x0e3742
shader.water.shallow=urn:color:0x52b9b5
shader.water.foam=urn:color:0xe0e8df
shader.water.light=urn:color:0x9fc8cc
shader.water.foamWidth="7"
shader.water.ocean.roughness="0.5"
shader.water.ocean.foam="1"
shader.water.highSeas.roughness="0.8"
shader.water.highSeas.foam="1"
shader.water.lake.roughness="0.25"
shader.water.lake.foam="0"
shader.water.ocean.speed="1"
shader.water.lake.speed="0.4"
# Each climate's deep water, shallows and foam, and how much foam breaks.
shader.water.cold.deep=urn:color:0x1b2a33
shader.water.cold.shallow=urn:color:0x5a7378
shader.water.cold.foam=urn:color:0xc4cdd0
shader.water.cold.foamAmount="0.3"
shader.water.temperate.deep=urn:color:0x123640
shader.water.temperate.shallow=urn:color:0x4d7268
shader.water.temperate.foam=urn:color:0xd3dbd0
shader.water.temperate.foamAmount="0.75"
shader.water.tropical.deep=urn:color:0x0c3a4c
shader.water.tropical.shallow=urn:color:0x40c6b9
shader.water.tropical.foam=urn:color:0xe6eee6
shader.water.tropical.foamAmount="1"
