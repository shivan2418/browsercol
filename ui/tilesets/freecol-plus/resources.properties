# FreeCol+: FreeCol's own art with a few improvements, as an art-only mod
# (the page's ?tileset=freecol-plus). Each image.* key here replaces one of
# FreeCol's; the shader.water.* keys are FreeCol+'s own.
#
# Silver: FreeCol's silver cart looked like the ore cart with grey rocks. Its
# load is now bright silver; the cart and wheels are FreeCol's. Made by
# tools/silver.py from FreeCol's art.
image.tileitem.model.resource.silver=resources/bonus/silver.png

# Water (#409): the ocean, lakes and high seas drawn as one surface under the
# land by a shader (ui/src/map-water.ts), in place of FreeCol's 21 painted
# frames. Two seamless ripple textures slide over each other; near land the
# water is shallower and foams. Made by tools/ripples.py. A browser that cannot
# run the shader draws FreeCol's frames. The water playground's D and E variants
# use flowing river water in FreeCol's masks, including minor-to-major joins.
# ?playground=water&water=D&rivers=flow selects it; rivers=flipbook keeps the frames.
# Rivers freeze for the water-only and off terrain animation preferences.
# Direction follows connected sides toward the strongest mouth, then distance;
# inland networks drain toward their largest end. Pebble banks keep FreeCol's art.
# Flowing rivers use the sea's periodic painted ocean art and climate shallows,
# with darker major-river centres. The shader reads four textures per pixel.
shader.water.swell=resources/water/swell.png
shader.water.chop=resources/water/chop.png
# How long a swell and a chop texture are across, in map pixels (a tile is 128).
shader.water.swellSize="640"
shader.water.chopSize="128"
# Coastal ocean, the high seas (darker), and lakes and great rivers.
shader.water.ocean=urn:color:0x0c3646
shader.water.highSeas=urn:color:0x092838
shader.water.lake=urn:color:0x0e3742
# The water near land, the foam on the shore, and the light on crests and glints.
shader.water.shallow=urn:color:0x2b6a70
shader.water.foam=urn:color:0xd8e2d6
shader.water.light=urn:color:0x9fc8cc
# Per kind of water (ocean, highSeas, lake): how rough it is (how strongly its
# ripples are lit), and how much foam breaks on its shore (0 none, 1 full).
# Lakes are calm: gentle ripples and no breaking foam, only lighter shallows.
shader.water.ocean.roughness="0.5"
shader.water.ocean.foam="1"
shader.water.highSeas.roughness="0.8"
shader.water.highSeas.foam="1"
shader.water.lake.roughness="0.25"
shader.water.lake.foam="0"
# How fast the ripples move on the ocean (and the high seas with it), and on
# lakes: 1 is normal.
shader.water.ocean.speed="1"
shader.water.lake.speed="0.4"
# River flow speeds in screen pixels per second, also adjustable in the playground.
shader.water.river.minorSpeed="12"
shader.water.river.majorSpeed="6"
