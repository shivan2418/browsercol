  the first showing the Americas, the second Europe and Africa; the favicon is the two globes side by side, slightly overlapping.

<script>
// ---------- procedural wood ----------
function noise2(seed) {
  const p = []; for (let i = 0; i < 512; i++) p[i] = Math.abs(Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453) % 1;
  const h = (x, y) => p[((x & 255) + ((y * 57) & 255)) & 511];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
const woodCache = {};
function wood(dark, light, seed = 1, w = 512, h = 256) {
  const key = dark + light + seed + w + h; if (woodCache[key]) return woodCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), n = noise2(seed), m = noise2(seed + 7);
  const D = hex(dark), L = hex(light);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const warp = n(x * 0.004, y * 0.012) * 3 + n(x * 0.02, y * 0.05) * 0.6;
    let t = (Math.sin(y * 0.2 + warp * 2.5) + 1) / 2;
    t = Math.pow(t, 2.4) * 0.7 + m(x * 0.015, y * 0.9) * 0.3;
    const i = (y * w + x) * 4;
    for (let k = 0; k < 3; k++) img.data[i + k] = L[k] + (D[k] - L[k]) * t;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return (woodCache[key] = c.toDataURL());
}
const WOODS = {

  // Africa

  // Madagascar

  // Eurasia (the edge of the old world's globe)
  [-9,37,-9,43,-2,43.5,-1,46,-4,48,-1,49,2,51,4,52,7,53.5,8.5,57,10.5,57.5,11,54,14,54,19,54.5,21,56,24,57.5,24,59.5,29,60,23,60.5,21,61,22,65.5,25,65.8,29,64,34,64,40,65,44,68,55,68,68,70,80,73,100,77,120,72,140,72,160,69,180,68,180,60,165,60,160,55,155,58,145,59,140,53,135,43,128,38,126,35,121,31,122,25,110,20,108,15,105,9,100,13,98,8,100,4,104,1,98,16,94,17,92,22,88,22,80,15,77,8,73,18,70,22,67,25,57,25,56,27,50,30,48,30,51,24,56,24,59,22,52,16,45,13,43,13,39,21,35,28,34,31,36,36,30,36,27,37,26,40,24,40,23,37,21,39,19,42,16,43,13.5,45.5,12.4,44.2,14,42,16,40,16,38,15.6,40,12,42,10,44,8,44,3,43,0,40,-1,37,-5,36],

const WATER = [ // seas cut back out of the land
  [-95,58,-87,56,-80,52,-79,55,-77,61,-85,64,-94,61], // Hudson Bay
  [28,42,28,46,31,46.5,34,45,38,47,41,43,41,41,35,42,29,41], // Black Sea

const rad = (d) => (d * Math.PI) / 180;
function projector(lon0, lat0, R = 46, cx = 50, cy = 50) {
  const s0 = Math.sin(rad(lat0)), c0 = Math.cos(rad(lat0));
  return (lon, lat) => {
    const l = rad(lon - lon0), p = rad(lat), cp = Math.cos(p), sp = Math.sin(p);
    let x = cp * Math.sin(l), y = c0 * sp - s0 * cp * Math.cos(l);
    const vis = s0 * sp + c0 * cp * Math.cos(l) > 0;
    if (!vis) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; }
    return [cx + R * x, cy - R * y, vis];
  };
}
const f1 = (n) => Math.round(n * 10) / 10;
function densify(flat, closed = true) {
  const pts = []; for (let i = 0; i < flat.length; i += 2) pts.push([flat[i], flat[i + 1]]);
  const out = [], n = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], steps = Math.max(1, Math.ceil(Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) / 2));
    for (let s = 0; s < steps; s++) out.push([a[0] + ((b[0] - a[0]) * s) / steps, a[1] + ((b[1] - a[1]) * s) / steps]);
  }
  if (!closed) out.push(pts[pts.length - 1]);

}
function polys(list, P) {
  return list.map((flat) => { const q = densify(flat).map(([lo, la]) => P(lo, la)); return q.some((p) => p[2]) ? 'M' + q.map((p) => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z' : ''; }).join('');
}
function graticule(P) {
  let d = '';
  const line = (pts) => { let pen = false; for (const [lo, la] of pts) { const p = P(lo, la); if (p[2]) { d += (pen ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1]); pen = true; } else pen = false; } };
  for (let lo = -180; lo < 180; lo += 30) line([...Array(33)].map((_, i) => [lo, -80 + i * 5]));
  for (let la = -60; la <= 60; la += 30) line([...Array(73)].map((_, i) => [-180 + i * 5, la]));
  return d;
}
const VIEWS = { americas: [-78, 14], oldworld: [16, 20] };
const geoCache = {};
function geo(view) {
  if (geoCache[view]) return geoCache[view];
  const P = projector(...VIEWS[view]);
  return (geoCache[view] = { land: polys(LAND, P), water: polys(WATER, P), grid: graticule(P) });
}

// ---------- one wooden globe ----------
let uid = 0;
const pat = (id, k, seed, rot) => `<pattern id="${id}" patternUnits="userSpaceOnUse" width="140" height="70" patternTransform="rotate(${rot})"><image href="${wood(...WOODS[k], seed, 280, 140)}" width="140" height="70"/></pattern>`;
/** The body of a globe in a 0..100 box, centred on (cx, cy) (scaled from 50,50). */
function globeBody(view, st, cx = 50, cy = 50) {
  const id = 'g' + uid++, G = geo(view), R = 46;
  const oFill = st.oceanFill ?? `url(#${id}o)`, lFill = st.landHatch ? `url(#${id}lh)` : st.landFill ?? `url(#${id}l)`;
  const defs = [
    st.landHatch ? `<pattern id="${id}lh" patternUnits="userSpaceOnUse" width="2.6" height="2.6" patternTransform="rotate(-35)"><rect width="2.6" height="2.6" fill="${st.oceanFill}"/><line x1="0" y1="0" x2="0" y2="2.6" stroke="${st.landHatch}" stroke-width=".8"/></pattern>` : '',
    st.rough ? `<filter id="${id}r" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse"><feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="${st.rough}" xChannelSelector="R" yChannelSelector="G"/></filter>` : '',
    st.ocean ? pat(id + 'o', st.ocean, st.oSeed ?? 3, st.oRot ?? -18) : '',
    st.land ? pat(id + 'l', st.land, st.lSeed ?? 9, st.lRot ?? 62) : '',
    st.hatch ? `<pattern id="${id}h" patternUnits="userSpaceOnUse" width="4" height="${st.hatchGap ?? 1.7}"><line x1="0" y1=".5" x2="4" y2=".5" stroke="${st.hatch}" stroke-width="${st.hatchW ?? 0.42}"/></pattern>` : '',
    `<clipPath id="${id}c"><circle cx="50" cy="50" r="${R}"/></clipPath>`,
    `<radialGradient id="${id}s" cx="36%" cy="30%" r="74%"><stop offset="0" stop-color="#fff" stop-opacity="${st.shine ?? 0.3}"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>`,
    `<filter id="${id}f" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="${st.carve ?? 0.7}" dy="${st.carve ?? 0.9}" stdDeviation=".35" flood-color="#000" flood-opacity=".7"/></filter>`,
  ];
  const tint = (t, d) => (t ? `<path d="${d}" fill="${t[0]}" style="mix-blend-mode:multiply" opacity="${t[1]}"/>` : '');
  const disc = `M${50 - R} 50a${R} ${R} 0 1 0 ${R * 2} 0a${R} ${R} 0 1 0 ${-R * 2} 0Z`;
  const land = `<g ${st.rough ? `filter="url(#${id}r)"` : st.carve === 0 ? '' : `filter="url(#${id}f)"`}><path d="${G.land}" fill="${lFill}" stroke="${st.landEdge ?? 'none'}" stroke-width="${st.edgeW ?? 0.8}" stroke-linejoin="round"/></g>`;
  const water = G.water ? `<path d="${G.water}" fill="${oFill}" stroke="${st.landEdge ?? 'none'}" stroke-width="${(st.edgeW ?? 0.8) * 0.8}"/>${tint(st.oTint, G.water)}${st.hatch ? `<path d="${G.water}" fill="url(#${id}h)"/>` : ''}` : '';

  const ripple = st.ripple ? [6, 4, 2.2].map((w) => `<path d="${G.land}" fill="none" stroke="${st.ripple}" stroke-width="${w}" stroke-linejoin="round"/><path d="${G.land}" fill="none" stroke="${st.oceanFill}" stroke-width="${w - 0.55}" stroke-linejoin="round"/>`).join('') : '';
  const body = `<g clip-path="url(#${id}c)">
      <path d="${disc}" fill="${oFill}"/>${tint(st.oTint, disc)}${st.hatch ? `<path d="${disc}" fill="url(#${id}h)"/>` : ''}${ripple}
      ${st.gridUnder ? `<path d="${G.grid}" fill="none" stroke="${st.grid}" stroke-width=".55" opacity="${st.gridO ?? 0.5}"/>` : ''}
      ${land}${tint(st.lTint, G.land)}${water}
      ${st.burn ? `<path d="${G.land}" fill="${st.burn}" opacity=".5" style="mix-blend-mode:multiply"/>` : ''}
      ${!st.gridUnder && st.grid ? `<path d="${G.grid}" fill="none" stroke="${st.grid}" stroke-width=".5" opacity="${st.gridO ?? 0.35}"/>` : ''}
      ${st.flat ? '' : `<circle cx="50" cy="50" r="${R}" fill="url(#${id}s)"/>`}
    </g>
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="${st.rim ?? '#1a0e05'}" stroke-width="${st.rimW ?? 2}"/>
    ${st.ring ? `<circle cx="50" cy="50" r="${R + 2.4}" fill="none" stroke="${st.ring}" stroke-width="2.6"/><circle cx="50" cy="50" r="${R + 2.4}" fill="none" stroke="#5a3e12" stroke-width="2.6" stroke-dasharray=".5 4.3" opacity=".8"/>` : ''}`;
  const sc = cx === 50 && cy === 50 ? '' : `transform="translate(${cx - 50} ${cy - 50})"`;
  return { defs: defs.join(''), body: `<g ${sc}>${body}</g>` };
}
function globe(size, view, st) {
  const g = globeBody(view, st), e = st.ring ? 4 : 2;
  return `<svg viewBox="${-e} ${-e} ${100 + 2 * e} ${100 + 2 * e}" width="${size}" height="${size}" aria-hidden="true"><defs>${g.defs}</defs>${g.body}</svg>`;
}
/** The favicon: the Americas behind, the old world in front and overlapping it a little. */
const OVERLAP = 0.2;
function pair(size, st, frontLeft = false) {
  const dx = 92 * (1 - OVERLAP), W = 100 + dx, a = globeBody('americas', st, 50, 50), b = globeBody('oldworld', st, 50 + dx, 50);
  const gap = st.gap ?? '#1a0e05', e = st.ring ? 4 : 2;
  const back = frontLeft ? b : a, front = frontLeft ? a : b, fx = frontLeft ? 50 : 50 + dx;
  return `<svg viewBox="${-e} ${50 - W / 2 - e} ${W + 2 * e} ${W + 2 * e}" width="${size}" height="${size}" aria-hidden="true"><defs>${a.defs}${b.defs}</defs>${back.body}<circle cx="${fx}" cy="50" r="${46 + (st.ring ? 5 : 2.6)}" fill="${gap}" opacity=".85"/>${front.body}</svg>`;
}
/** Space either side of a globe, as a share of the cap height; negative pulls the neighbours in past their side bearings. */
const GLOBE_MARGIN = -0.035;
/** How tall a capital is, as a share of the font size, measured on an H. */
const capCache = {};
function capRatio(f) {
  if (capCache[f[0]]) return capCache[f[0]];
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = f[2].replace('1em', '200px');
  return (capCache[f[0]] = ctx.measureText('H').actualBoundingBoxAscent / 200 || 0.7);

/** The wordmark: the first O the Americas, the second Europe and Africa. Each globe is as tall as a

function wordmark(st, cap, f, color, shadow) {
  const views = ['americas', 'oldworld'], e = st.ring ? 4 : 2, ext = 100 + 2 * e, disc = 46 + (st.rimW ?? 2) / 2;
  const d = cap * 1.03, S = (d * ext) / (2 * disc), below = ((50 + e - disc) / ext) * S + cap * 0.015;
  let i = 0;
  const parts = 'BROWSERCOL'.split(/(O)/).map((x) => (x === 'O' ? `<span style="display:inline-block;vertical-align:${(-below).toFixed(2)}px;margin:0 ${(cap * GLOBE_MARGIN).toFixed(1)}px;line-height:0">${globe(S, views[i++], st)}</span>` : x));
  return `<span aria-label="BrowserCol" style="white-space:nowrap;line-height:1.1;font:${f[2]};font-size:${(cap / capRatio(f)).toFixed(1)}px;color:${color};letter-spacing:.02em;text-shadow:${shadow}">${parts.join('')}</span>`;
}

const PAIR = ['castoro', 'forum'];

// ---------- the wood treatments ----------
const carvedText = (c) => `0 1px 0 rgb(255 225 170/.55),0 -1px 1px rgb(0 0 0/.6)`;
const VARIANTS = {
  P: {
    name: 'Old parchment', page: '#d8c08e', labelInk: '#3b2410', board: '#efe2bf', frame: '3px double #3b2410', ink: '#3b2410', shadow: 'none', tile: '#efe2bf', light: true,
    tagline: 'THE NEW WORLD · IN A TAB',
    st: { oceanFill: '#efe2bf', landHatch: '#3b2410', landEdge: '#3b2410', edgeW: 0.9, rough: 2.2, grid: '#3b2410', gridO: 0.6, gridUnder: true, rim: '#3b2410', rimW: 2.5, flat: true, gap: '#efe2bf' },
    idea: 'The colours and line of the parchment option on the browser-globe page: sepia ink on parchment, a double-ruled frame on a tan page, Cinzel in its regular weight with the tagline under it. The globes are drawn the same way, the sea blank paper and the land hatched diagonally in ink with a slightly rough, hand-cut coast, under an inked graticule. Only the globes changed: the Americas and Europe with Africa instead of the hidden browser logos.',
  },
  A: {
    name: 'Carved oak', plank: 'oak', plankSeed: 2, ink: '#3a210c', shadow: carvedText(), tile: '#3b2a17',
    st: { ocean: 'walnut', land: 'oak', landEdge: '#2a1608', edgeW: 0.5, grid: '#d9a866', gridUnder: true, gridO: 0.35 },
    idea: 'The plank from your first idea. Each globe is a turned ball of walnut, the sea; the land is oak, set proud of it with a shadow under its coast, as if carved in relief. A faint graticule is scratched into the walnut.',
  },
  B: {
    name: 'Marquetry', plank: 'walnut', plankSeed: 22, ink: '#e8c890', shadow: '0 2px 0 #000a', tile: wd('walnut', 23),
    st: { ocean: 'maple', land: 'walnut', landEdge: '#120a04', edgeW: 0.7, carve: 0, grid: '#7a5228', gridO: 0.35, shine: 0.2 },
    idea: 'Flat inlay: the sea is pale maple, the land walnut veneer, with a dark seam where they meet, like a marquetry table top. It is the flattest of the five and reads well small, as the land is darker than the sea.',
  },
  C: {
    name: 'Burnt pine', plank: 'pine', plankSeed: 31, ink: '#4a230b', shadow: '0 0 1px #2a1204, 0 1px 0 rgb(255 240 200/.5)', tile: wd('pine', 32),
    st: { ocean: 'pine', land: 'pine', lSeed: 4, burn: '#7a3a12', landEdge: '#3a1806', edgeW: 1, carve: 0, grid: '#5a2a0c', gridO: 0.45, rim: '#3a1806' },
    idea: 'Pyrography: one piece of pale pine with the land scorched in and outlined by the hot point, and the graticule burned in fine lines. The plank lettering is burned too. The most hand-made of the five.',
  },
  D: {
    name: 'Painted globe', plank: 'teak', plankSeed: 41, ink: '#f0dfb4', shadow: '0 2px 0 #1a0c04', tile: wd('teak', 42),
    st: { ocean: 'oak', oTint: ['#2b6f86', 0.75], land: 'pine', lTint: ['#cfc08a', 0.35], landEdge: '#2a1608', edgeW: 0.6, grid: '#e8d8a8', gridO: 0.35 },
    idea: 'An antique painted globe: the sea is a sea-green stain over oak, so the grain shows through, and the land is pale pine with a little ochre. The only one with colour, so the two globes stand out in the wordmark and the favicon reads as "world" at a glance.',
  },
  E: {
    name: 'Desk globe', plank: 'walnut', plankSeed: 51, ink: 'transparent', shadow: 'none', brass: true, tile: wd('walnut', 52),
    st: { ocean: 'walnut', land: 'oak', landEdge: '#2a1608', edgeW: 0.5, grid: '#d9a866', gridUnder: true, gridO: 0.35, ring: '#c9a24a', rim: '#3a2408', gap: '#120a04' },
    idea: 'Carved oak on walnut, as in A, each globe in a brass meridian ring like a desk globe, with brass lettering on a walnut board. The ring keeps the two globes apart in the favicon.',
  },
  F: {
    name: 'Parchment', board: 'radial-gradient(ellipse at 50% 45%,#f4e7c6 0%,#ecdcb2 55%,#d4b77e 88%,#a9844a 100%)', boardEdge: '#6e4a22', ink: '#4a2c12', shadow: '0 1px 0 rgb(255 248 225/.6)', tile: '#efe2bf',
    st: { oceanFill: '#e9dbb4', oTint: ['#9cb7a6', 0.55], landFill: '#efe0b8', lTint: ['#d9b46a', 0.55], landEdge: '#4a2c12', edgeW: 0.75, carve: 0, ripple: '#6e4a22', grid: '#6e4a22', gridO: 0.4, rim: '#4a2c12', rimW: 1.6, shine: 0.12, gap: '#efe2bf' },
    idea: 'A hand-drawn chart on parchment: sepia ink, a faded sea-green wash on the sea and an ochre wash on the land, with ripple lines drawn round the coasts as old chart makers did. The board is the parchment itself, darkened at the edges.',
  },
  G: {
    name: 'Engraved', board: '#f3ead2', boardEdge: '#14100a', boardOutline: true, ink: '#14100a', shadow: 'none', tile: '#f3ead2',
    st: { oceanFill: '#f3ead2', hatch: '#14100a', landFill: '#f3ead2', landEdge: '#14100a', edgeW: 0.8, carve: 0, ripple: '#14100a', grid: '#14100a', gridO: 0.55, gridUnder: false, rim: '#14100a', rimW: 1.8, shine: 0.0, gap: '#f3ead2' },
    idea: 'A copperplate engraving in one black ink: the sea is cut in fine horizontal hatching, the land left blank paper, ripple lines round the coasts and a graticule over it all. It is the style of option D on the engraved-globe page, with true continents. One colour, so it would print, emboss or engrave as it is.',
  },
};
const KEYS = Object.keys(VARIANTS);

let KEY = KEYS[0];
function board(v, f, cap, tag = false) {
  const color = v.brass ? '#c9a24a' : v.ink;
  const brassText = v.brass ? 'background:linear-gradient(180deg,#f3d98a,#b8862e 55%,#7a5418);-webkit-background-clip:text;background-clip:text;' : '';
  const word = wordmark(v.st, cap, f, v.brass ? 'transparent' : color, v.shadow).replace('style="', `style="${brassText}`);
  const k = cap / 64;
  if (v.frame) return `<div style="background:${v.board};padding:${22 * k}px ${40 * k}px;border:${v.frame};outline:1px solid ${v.ink};outline-offset:6px;box-shadow:0 12px 28px rgb(0 0 0/.4);text-align:center">${word}
      ${tag ? `<div style="text-align:center;font:${f[2]};font-size:${Math.max(10, 15 * k)}px;letter-spacing:.5em;color:${v.ink};opacity:.8;border-top:1px solid ${v.ink};margin-top:${10 * k}px;padding-top:${6 * k}px">${v.tagline}</div>` : ''}</div>`;
  if (v.board) return `<div style="background:${v.board};padding:${30 * k}px ${52 * k}px;border-radius:${v.boardOutline ? 0 : 6}px;box-shadow:0 14px 30px rgb(0 0 0/.45);border:${v.boardOutline ? 2 : 1}px solid ${v.boardEdge};${v.boardOutline ? `outline:1px solid ${v.boardEdge};outline-offset:-8px;` : ''}">${word}</div>`;
  return `<div style="background:${wd(v.plank, v.plankSeed)};padding:${26 * k}px ${48 * k}px;border-radius:10px;box-shadow:inset 0 2px 0 rgb(255 230 180/.35),inset 0 -4px 0 rgb(0 0 0/.35),0 14px 30px rgb(0 0 0/.5);border:2px solid #1a0e05">${word}</div>`;
}
function show(key) {
  KEY = key;
  const v = VARIANTS[key], many = Array.isArray(FONT?.[0]), f = many ? FONT[0] : FONT ?? FONTS.find((x) => x[0] === 'cinzel-reg');
  document.body.style.background = v.page ?? '#1d4357';
  const label = v.labelInk ?? '#cfe0e8';
  const favs = `<div style="display:flex;gap:28px;align-items:center">${pair(150, v.st)}<span style="color:${label};font-size:13px">favicon (Americas behind)</span>${pair(150, v.st, true)}<span style="color:${label};font-size:13px">(Americas in front)</span></div>`;
  const hero = many
    ? `<div style="display:grid;justify-items:center;gap:22px">${FONT.map((x) => `<figure style="margin:0 0 18px;display:grid;justify-items:center;gap:12px">${board(v, x, 64)}<figcaption style="color:${label};font-size:13px">${x[1]}</figcaption></figure>`).join('')}${favs}</div>`
    : FONT
    ? `<div style="display:grid;justify-items:center;gap:40px">${board(v, f, 64)}${favs}</div>`
    : `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:34px 26px;width:min(100%,1180px);justify-items:center">${FONTS.map((x) => `<figure style="margin:0;display:grid;justify-items:center;gap:12px">${board(v, x, 34, false)}<figcaption style="color:${label};font-size:13px">${x[1]}${x[3] ? ' · tried before' : ''}</figcaption></figure>`).join('')}</div>`;
  const chip = (s) => pair(s, v.st);
  const fk = many ? FONT.map((x) => x[0]).join('+') : FONT ? FONT[0] : 'all';
  document.getElementById('app').innerHTML = `
    <section class="stage">${hero}</section>
    <section class="context">
      <h3>In the app</h3>
      <div class="menubar">${chip(24)}<b style="font:${f[2]};font-size:17px">BrowserCol</b><span>Game</span><span>View</span><span>Orders</span><span>Report</span></div>
      <div class="tabs"><div class="tab">${chip(16)} Your turn · 1612 Autumn · Dutch</div><div class="tab dark">${chip(16)} Your turn · 1612 Autumn · Dutch</div></div>
      <h3>Favicon</h3>
      <div class="icons">${[192, 64, 32, 16].map((s) => `<figure><div class="tile" style="width:${s}px;height:${s}px;background:${v.tile}">${pair(s * 0.9, v.st)}</div>${s}px</figure>`).join('')}
        ${[64, 32, 16].map((s) => `<figure><div style="width:${s}px;height:${s}px">${pair(s, v.st)}</div>${s}px bare</figure>`).join('')}</div>
      <h3>${key}: ${v.name} · ${many ? FONT.map((x) => x[1]).join(' and ') : FONT ? f[1] : 'all fonts'}</h3>
      <p class="notes">${v.idea}</p>
      <p class="notes">Every font is set so its capitals are the same height, and each globe is as tall as a capital (plus the slight overshoot a round O has), sitting on the baseline.</p>
      <p class="notes">This tab's own favicon is the pair too. Link: <code>#${key}-${fk}</code> · ← → treatment · ↑ ↓ font</p>
    </section>`;
  document.getElementById('label').textContent = `${key} (${v.name})`;
  document.getElementById('font').value = fk;
  setFavicon(pair(64, v.st));
  try { history.replaceState(null, '', `#${key}-${fk}`); } catch {}
}
function setFavicon(svgText) {
  const s = svgText.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ');
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 64; c.getContext('2d').drawImage(img, 0, 0, 64, 64);
    let l = document.querySelector('link[rel=icon]'); if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.append(l); }
    try { l.href = c.toDataURL(); } catch {}
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}
function readHash() {
  const [k, ...f] = location.hash.slice(1).split('-');
  const fk = f.join('-'); FONT = !fk ? FONTS.find((x) => x[0] === 'cinzel') : fk.includes('+') ? fk.split('+').map((k) => FONTS.find((x) => x[0] === k)).filter(Boolean) : FONTS.find((x) => x[0] === fk) ?? null;
  return KEYS.includes(k) ? k : KEYS[0];
}
const step = (d) => show(KEYS[(KEYS.indexOf(KEY) + d + KEYS.length) % KEYS.length]);
const stepFont = (d) => { const n = FONTS.length + 1, i = ((Array.isArray(FONT?.[0]) ? -1 : FONTS.indexOf(FONT)) + 1 + d + n) % n; FONT = i === 0 ? null : FONTS[i - 1]; show(KEY); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
const sel = document.getElementById('font');
sel.innerHTML = `<option value="castoro+forum">Castoro + Forum</option><option value="all">All fonts</option><optgroup label="New">${FONTS.filter((f) => !f[3]).map((f) => `<option value="${f[0]}">${f[1]}</option>`).join('')}</optgroup><optgroup label="Tried before">${FONTS.filter((f) => f[3]).map((f) => `<option value="${f[0]}">${f[1]}</option>`).join('')}</optgroup>`;
sel.onchange = () => { FONT = sel.value.includes('+') ? sel.value.split('+').map((k) => FONTS.find((x) => x[0] === k)) : FONTS.find((x) => x[0] === sel.value) ?? null; show(KEY); sel.blur(); };
addEventListener('hashchange', () => show(readHash()));
addEventListener('keydown', (e) => {
  if (e.target.closest?.('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); stepFont(-1); } else if (e.key === 'ArrowDown') { e.preventDefault(); stepFont(1); }
});
Promise.all(FONTS.map((f) => document.fonts.load(f[2].replace('1em', '20px')))).finally(() => show(readHash()));
</script>
</body>
</html>
