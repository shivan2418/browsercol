<!doctype html>
<!--
  Throwaway prototype for #376: looks for the colony panel's population octagons.
  ?v=now|carved|pile|drawn|ledger picks the variant, ?zoom=1|2 the display scaling.
  Each page shows three colonies in the light (parchment) and the dark theme.
  Served from the repo root by tools/octagon-proto/shoot.ts, which also takes the screenshots.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Octagon prototype</title>
    <link rel="stylesheet" href="../../ui/src/fonts.css" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #777;
        font: 13px / 1.4 var(--font);
      }
      .page {
        display: inline-flex;
        flex-direction: column;
        gap: 10px;
      }
      .theme {
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--line);
        padding: 8px 12px 12px;
      }
      .theme h2 {
        margin: 0 0 6px;
        font: 700 15px var(--font-title);
        color: var(--head);
      }
      .boards {
        display: flex;
        gap: 18px;
      }
      /* The board as in the colony panel: 3x3 tiles in the middle, the octagons in its corners. */
      .board {
        position: relative;
        width: 384px;
        height: 232px;
      }
      .tile {
        position: absolute;
        width: 128px;
        height: 64px;
        background: url(../../freecol/data/default/resources/images/terrain/plains/center0.png);
      }
      .tile.g {
        background-image: url(../../freecol/data/default/resources/images/terrain/grassland/center0.png);
      }
      .octagon {
        position: absolute;
        z-index: 1;
        width: 68px;
        height: 66px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
        background-repeat: no-repeat;
        line-height: 1;
      }
      .octagon.size,
      .octagon.rebels {
        left: 2px;
      }
      .octagon.change,
      .octagon.royalists {
        right: 2px;
      }
      .octagon.size,
      .octagon.change {
        top: 2px;
      }
      .octagon.rebels,
      .octagon.royalists {
        top: 158px;
      }
      .art {
        background-image: url(../../freecol/data/base/resources/images/ui/colony-upper-right-bg.png);
      }
      .octagon .n {
        position: relative;
        z-index: 1;
      }
      .octagon .pc {
        font-size: 0.62em;
      }

      /* --- Now: what the game draws today (index.html .colony .octagon). --- */
      .v-now .octagon {
        background-color: var(--btn);
        color: var(--paper-ink);
        font-family: var(--font-title);
        font-size: 32px;
        font-weight: 700;
        line-height: normal;
      }
      .v-now .octagon.rebels,
      .v-now .octagon.royalists {
        padding-top: 28px;
        font-size: 18px;
      }
      .v-now .octagon .pc {
        font-size: inherit;
      }

      /*
       * A. Carved: FreeCol's painted octagons; Cinzel in dark ink, cut into the wood (a light edge under each
       * stroke); the number sits in the middle of the octagon's face, the percent sign small beside it.
       */
      .v-carved .octagon {
        color: var(--paper-ink);
        font-family: var(--font-title);
        font-weight: 700;
        text-shadow: 0 1px 0 rgb(255 240 215 / 55%);
      }
      .v-carved .octagon.size {
        font-size: 30px;
        padding-top: 3px;
      }
      .v-carved .octagon.change {
        font-size: 27px;
        padding-top: 3px;
      }
      .v-carved .octagon.rebels,
      .v-carved .octagon.royalists {
        justify-content: flex-end;
        padding-bottom: 13px;
        font-size: 16px;
      }

      /*
       * B. Pile ink: FreeCol's painted octagons; Noto Sans bold in white with a black outline, as the numbers over
       * a pile of goods; the change green or red.
       */
      .v-pile .octagon {
        color: var(--pile-ink);
        font-family: var(--font);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-shadow:
          -1px -1px 0 var(--pile-outline),
          1px -1px 0 var(--pile-outline),
          -1px 1px 0 var(--pile-outline),
          1px 1px 0 var(--pile-outline),
          0 2px 3px rgb(0 0 0 / 60%);
      }
      .v-pile .octagon.size {
        font-size: 28px;
      }
      .v-pile .octagon.change {
        font-size: 22px;
      }
      .v-pile .octagon[data-sign='gain'] {
        color: #7dff7d;
      }
      .v-pile .octagon[data-sign='loss'] {
        color: var(--pile-loss);
      }
      .v-pile .octagon.rebels,
      .v-pile .octagon.royalists {
        justify-content: flex-end;
        padding-bottom: 13px;
        font-size: 16px;
      }

      /*
       * C. Drawn: our own octagons in the theme's tokens (a --line rim, a --box face, a thin inner ring), Noto Sans
       * in --ink, the change in --good or --bad; the muskets and the crown are cut from FreeCol's art.
       */
      .v-drawn .octagon {
        background: var(--line);
        color: var(--ink);
        font-family: var(--font);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .v-drawn .octagon::before,
      .v-drawn .octagon::after {
        content: '';
        position: absolute;
        clip-path: inherit;
      }
      .v-drawn .octagon::before {
        inset: 3px;
        background: var(--box);
      }
      .v-drawn .octagon::after {
        /* The face: a shade darker than the ring round it, so the rim reads as a bevel. */
        inset: 6px;
        background: color-mix(in srgb, var(--box) 88%, var(--line));
      }
      .v-drawn .octagon.size {
        font-size: 26px;
        color: var(--head);
      }
      .v-drawn .octagon.change {
        font-size: 21px;
      }
      .v-drawn .octagon[data-sign='gain'] {
        color: var(--good);
      }
      .v-drawn .octagon[data-sign='loss'] {
        color: var(--bad);
      }
      .v-drawn .octagon.rebels,
      .v-drawn .octagon.royalists {
        gap: 1px;
        font-size: 15px;
        padding-top: 2px;
      }

      /*
       * D. Title bar: our own octagons in the window title bars' colours (--menubar, --menubar-ink), a --line rim;
       * Cinzel numbers, the percentages in Noto Sans under the art's muskets and crown.
       */
      .v-title .octagon {
        background: var(--line);
        color: var(--menubar-ink);
        font-family: var(--font-title);
        font-weight: 700;
      }
      .v-title .octagon::before {
        content: '';
        position: absolute;
        inset: 2px;
        clip-path: inherit;
        background: radial-gradient(
          circle at 50% 35%,
          color-mix(in srgb, var(--menubar) 80%, white),
          var(--menubar) 70%
        );
      }
      .v-title .octagon.size {
        font-size: 30px;
        padding-top: 2px;
      }
      .v-title .octagon.change {
        font-size: 23px;
        padding-top: 2px;
      }
      .v-title .octagon.rebels,
      .v-title .octagon.royalists {
        font-family: var(--font);
        font-size: 15px;
        gap: 2px;
      }
      /* Our own muskets and crown, drawn in the theme's colours, for the drawn octagons. */
      .icon {
        position: relative;
        z-index: 1;
        width: 30px;
        height: 18px;
        fill: currentColor;
        stroke: currentColor;
      }
      .v-drawn .rebels .icon {
        color: var(--muted);
      }
      .v-drawn .royalists .icon {
        color: var(--warn);
      }
      .v-title .icon {
        color: color-mix(in srgb, var(--menubar-ink) 70%, transparent);
      }
    </style>
    <style id="themes"></style>
  </head>
  <body>
    <div class="page"></div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      const v = q.get('v') ?? 'carved';
      document.querySelector('.page').style.zoom = q.get('zoom') ?? '1';

      // theme.css scopes the palettes to :root; scope them to a light and a dark section instead, side by side.
      const css = await (await fetch('../../ui/src/theme.css')).text();
      document.getElementById('themes').textContent = css
        .replace(":root[data-theme='dark']", '.theme-dark')
        .replace(/^:root \{/m, ':root, .theme-light {');

      /** Where each octagon is in the art at 1x (colony-panel.tsx OCTAGON_AT). */
      const AT = { size: [66, 6], change: [372, 6], rebels: [66, 152], royalists: [372, 152] };
      const painted = v === 'now' || v === 'carved' || v === 'pile';
      const drawnIcons = v === 'drawn' || v === 'title';
      const minus = (t) => (v === 'now' ? t : t.replace('-', '\u2212'));
      const colonies = [
        { size: 3, change: '+1', rebels: 0 },
        { size: 14, change: '-2', rebels: 50 },
        { size: 14, change: '+1', rebels: 100 },
      ];
      const sign = (s) => (s.startsWith('+') && s !== '+0' ? 'gain' : /^[-\u2212]/.test(s) ? 'loss' : '');
      const pct = (n) => (v === 'now' ? `${n}%` : `${n}<span class="pc">%</span>`);

      const ICONS = {
        rebels: `<svg class="icon" viewBox="0 0 32 20"><g stroke-linecap="round" fill="none">
          <path d="M8 15.5 L29 3" stroke-width="1.6"/><path d="M24 15.5 L3 3" stroke-width="1.6"/>
          <path d="M3 18.5 L9 15" stroke-width="4"/><path d="M29 18.5 L23 15" stroke-width="4"/></g></svg>`,
        royalists: `<svg class="icon" viewBox="0 0 32 20"><g stroke="none">
          <path d="M6 14 L4 5 L10.5 9.5 L16 3 L21.5 9.5 L28 5 L26 14 Z"/><rect x="6" y="15.5" width="20" height="3" rx="0.8"/>
          <circle cx="4" cy="4.5" r="1.8"/><circle cx="16" cy="2.5" r="1.8"/><circle cx="28" cy="4.5" r="1.8"/></g></svg>`,
      };
      function octagon(part, html) {
        const [x, y] = AT[part];
        const style = painted ? ` style="background-position:-${x}px -${y}px"` : '';
        const icon = drawnIcons && part in ICONS ? ICONS[part] : '';
        const s = part === 'change' ? ` data-sign="${sign(html)}"` : '';
        return `<span class="octagon ${part}${painted ? ' art' : ''}"${s}${style}>${icon}<span class="n">${html}</span></span>`;
      }
      function board(c) {
        let tiles = '';
        for (let i = 0; i < 3; i++)
          for (let j = 0; j < 3; j++)
            tiles += `<span class="tile${(i + j) % 2 ? ' g' : ''}" style="left:${128 + (i - j) * 64}px;top:${20 + (i + j) * 32}px"></span>`;
        return `<div class="board">${tiles}${octagon('size', String(c.size))}${octagon('change', minus(c.change))}${octagon(
          'rebels',
          pct(c.rebels),
        )}${octagon('royalists', pct(100 - c.rebels))}</div>`;
      }
      const section = (theme, label) =>
        `<section class="theme theme-${theme} v-${v}"><h2>${label}</h2><div class="boards">${colonies.map(board).join('')}</div></section>`;
      document.querySelector('.page').innerHTML = section('light', 'Parchment') + section('dark', 'Dark');
      await document.fonts.ready;
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
