# Overrides for the GOG config: windowed on the hidden display, no sound,
# fast CPU. Loaded after the GOG dosboxCOL.conf.
[sdl]
fullscreen=false
output=surface
autolock=false
usescancodes=false
[render]
scaler=none
aspect=false
[cpu]
core=dynamic
cycles=max
[mixer]
nosound=true
[speaker]
pcspeaker=false
[autoexec]
@echo off
mount C /work/data
c:
cd MPS\COLONIZE
imgmount D COLONIZE.DAT -t iso
cls
opening -g
exit
