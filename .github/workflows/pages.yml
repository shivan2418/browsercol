# Deploys the game: builds dist/ for a build-N tag, releases the game (play/)
# as build-N with play.tar.gz, deploys it with the Site workflow, then runs the
# smoke script against the deployed URL. Deploy with `just deploy`
# (tools/deploy.sh), which tags origin/main build-N, one more than the last
# build, and pushes the tag; the page shows "build N · <commit> · <date>". A push to
# main deploys only the landing page, around the latest release's game
# (site.yml), so the build number changes only when the game does (#374).
# Builds are numbered, not semver: the one promise to players is that their
# saves keep loading (docs/adr/0007-saves-are-the-compatibility-contract.md).
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    tags: ['build-*']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Clone upstream FreeCol at the pinned commit
        run: ./freecol.sh

      # The feedback relay's URL (#369, docs/adr/0009) comes from a repository variable; dev.sh passes it on
      # to the container, and Vite reads it as import.meta.env.VITE_FEEDBACK_URL. Unset, the game has no Send button.
      - name: Build dist/
        env:
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
        run: ./dev.sh ./build.sh -Prelease

      - name: First-load size
        run: |
          # Transfer size of what a first load fetches, gzipped as Pages
          # serves it: every file but the test Tileset, the debug presets,
          # the music and sounds (each fetched when it plays) and the
          # translations (the page fetches the player's one).
          cd dist
          total=$(find . -type f ! -path './play/art/test*' ! -path './play/presets/*' ! -path './play/audio/*' ! -path './play/strings/*' -print0 | xargs -0 -n1 sh -c 'gzip -9c "$0" | wc -c' | awk '{s+=$1} END {print s}')
          raw=$(du -sb . | cut -f1)
          echo "first load (gzip): $((total/1024/1024)) MB; dist raw: $((raw/1024/1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$total" -lt $((30*1024*1024)) ] || { echo "over the 30 MB budget" >&2; exit 1; }

      - name: The game, for the release
        run: tar -C dist -czf play.tar.gz play

      - uses: actions/upload-artifact@v7
        with:
          name: play
          path: play.tar.gz
          retention-days: 7

  # The release is what the Site workflow deploys, now and on every later push to main.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: play
      - name: Release the build with its game
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" play.tar.gz --repo "$GITHUB_REPOSITORY"
          --title "${GITHUB_REF_NAME/build-/Build }" --generate-notes --verify-tag

  deploy:
    needs: release
    uses: ./.github/workflows/site.yml
    with:
      # This build's game, not whatever release GitHub calls latest a moment after this one was made (#501).
      tag: ${{ github.ref_name }}

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: play
      # The deploy can report success and leave the site on the last build (build 8, deployed from a re-run),
      # and the smoke below passes on any build. Each build's index.html names its own hashed script, so the live
      # one matches this build's only once this game is what Pages serves. The query skips the CDN's cache. The
      # script's name is compared, not the whole page, which the Site workflow adds the view counter to.
      - name: The live game is this build
        run: |
          tar -xzf play.tar.gz play/index.html
          url="${{ needs.deploy.outputs.page_url }}play/"
          want=$(grep -o 'assets/index-[^"]*\.js' play/index.html)
          for i in $(seq 1 30); do
            curl -fsS "${url}?build=$GITHUB_REF_NAME-$i" -o live.html && grep -qF "$want" live.html && exit 0
            sleep 10
          done
          echo "After 5 minutes ${url} still serves another build's game than $GITHUB_REF_NAME:" >&2
          grep -o 'assets/index-[^"]*\.js' live.html play/index.html >&2
          exit 1
      - name: Smoke against the Pages URL
        run: DEV_VARIANT=web ./dev.sh node ui/scripts/smoke.ts --url "${{ needs.deploy.outputs.page_url }}"
