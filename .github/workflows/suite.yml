# The whole suite, as run locally before closing a ticket: Engine tests,
# build.sh, vp check, vp test and the browser scripts. Started by hand from
# the Actions tab (or `gh workflow run suite.yml`), on any branch, or by
# ./ci.sh pushing a throwaway ci/<sha> branch.
name: Suite

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream FreeCol at the pinned commit
        run: ./freecol.sh

      - name: Engine tests
        run: ./dev.sh -C engine gradle --console=plain test

      # Later steps run even if an earlier one failed, to report every
      # failure in one run; those after the build need its dist/ and npm ci.
      - name: Build dist/
        id: build
        if: ${{ !cancelled() }}
        run: ./dev.sh ./build.sh

      - name: vp check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./dev.sh -C ui npx vp check

      - name: vp test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./dev.sh -C ui npx vp test

      - name: Browser smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: DEV_VARIANT=web ./dev.sh node ui/scripts/smoke.mjs

      - name: Browser play
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: DEV_VARIANT=web ./dev.sh node ui/scripts/play.mjs

      - name: Browser saves
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: DEV_VARIANT=web ./dev.sh node ui/scripts/saves.mjs

      - name: Browser debug
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: DEV_VARIANT=web ./dev.sh node ui/scripts/debug.mjs

      - name: Browser tileset
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: DEV_VARIANT=web ./dev.sh node ui/scripts/tileset.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .cache/*.png
          if-no-files-found: ignore
