# Deploys the site to GitHub Pages: the landing page and changes page (ui/site/) of main's
# latest commit, around the game of the newest build released (play.tar.gz, which
# pages.yml attaches to each build-N). A push to main that changes the page
# (the paths below, which tools/site.sh copies) runs it, and so does pages.yml, on main,
# once it has released a new game. The game, and the build number
# players see, change only with `just deploy` (#374). Pages replaces the whole
# site on each deploy, which is why the game goes up again with the page.
#
# Runs overlap: the deploy skill's changelog push and the new build's own deploy start minutes apart (#501). So
# there is one job, run one at a time, and it decides what to deploy only once it has its turn: main's page around
# the newest build released at that moment. Whichever run deploys last puts up the newest build, whatever order
# the runs come in. GitHub replaces a waiting run with a newer one, which deploys the newest build all the same.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'ui/site/**'
      - 'ui/brand/**'
      - 'ui/src/fonts/cinzel/**'
      - 'ui/src/fonts/noto-sans/**'
      - 'tools/site.sh'
      - 'tools/newest-build.sh'
      - 'ui/scripts/build-changes.ts'
      - 'ui/scripts/count-views.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      at-least:
        description: >-
          The build-N pages.yml has just released. GitHub's list of releases can lag a new one by a moment, so the
          job waits until it lists this build or a newer one.
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The one deploy at a time, across this workflow's runs: pushes, and pages.yml starting it for a new build.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # The highest build-N released, read now that this run has its turn. Not GitHub's "latest" release, which
      # just after a release is made can still name the build before it (#501).
      - name: The newest build's game
        env:
          GH_TOKEN: ${{ github.token }}
          AT_LEAST: ${{ inputs.at-least }}
        run: |
          want=${AT_LEAST#build-}
          for _ in $(seq 1 24); do
            tag=$(tools/newest-build.sh)
            if [ -n "$tag" ] && { [ -z "$want" ] || [ "${tag#build-}" -ge "$want" ]; }; then break; fi
            echo "The releases list ${tag:-none}, not yet $AT_LEAST; waiting." >&2
            tag=
            sleep 5
          done
          if [ -z "$tag" ]; then
            echo "No release ${AT_LEAST:-with a game} to deploy: deploy one with 'just deploy' first." >&2
            exit 1
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern play.tar.gz
          mkdir dist
          tar -C dist -xzf play.tar.gz
          echo "The landing page of $(git rev-parse --short HEAD) around the game of $tag" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The landing page around it
        # In the dev image: build-changes.ts is TypeScript, which its Node runs. GOATCOUNTER_URL, a repository
        # variable, puts the page view counter on the pages (docs/adr/0011); unset, nothing is counted.
        env:
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: ./dev.sh tools/site.sh dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

  # The game was smoke-tested when it was deployed: here, only that both pages are served.
  check:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The landing page and the game answer
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          curl -fsS --retry 5 --retry-all-errors "$url" | grep -q 'class="play"'
          curl -fsS --retry 5 --retry-all-errors "${url}play/" | grep -qi '<script'
