# Deploys the site to GitHub Pages: the landing page and changes page (ui/site/) of main's
# latest commit, around the game of the latest release (play.tar.gz, which
# pages.yml attaches to each build-N). A push to main that changes the page
# (the paths below, which tools/site.sh copies) runs it, and so does pages.yml
# once it has released a new game. The game, and the build number
# players see, change only with `just deploy` (#374). Pages replaces the whole
# site on each deploy, which is why the game goes up again with the page.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'ui/site/**'
      - 'ui/brand/**'
      - 'ui/src/fonts/cinzel/**'
      - 'ui/src/fonts/noto-sans/**'
      - 'tools/site.sh'
      - 'ui/scripts/build-changes.ts'
      - 'ui/scripts/count-views.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The build-N whose game goes up; pages.yml passes its own (#501).
        type: string
        required: false
    outputs:
      page_url:
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

# Every run deploys the same thing, main's page and the latest game, as they
# are when it starts: a newer run replaces a waiting one, and none overlap.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.game.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # The game of the tag pages.yml passes, or else of the highest build-N released. Not GitHub's "latest"
      # release: just after pages.yml makes a release, "latest" can still name the build before it (#501).
      - name: The latest release's game
        id: game
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag=${TAG:-$(tools/newest-build.sh)}
          if [ -z "$tag" ]; then
            echo "No release with a game yet: deploy one with 'just deploy' first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern play.tar.gz
          mkdir dist
          tar -C dist -xzf play.tar.gz
          echo "The landing page of $(git rev-parse --short HEAD) around the game of $tag" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The landing page around it
        # In the dev image: build-changes.ts is TypeScript, which its Node runs. GOATCOUNTER_URL, a repository
        # variable, puts the page view counter on the pages (docs/adr/0011); unset, nothing is counted.
        env:
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: ./dev.sh tools/site.sh dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # One deploy at a time, across this workflow's own runs and pages.yml's: the later one checks below after the
    # earlier has finished. (The workflow's concurrency above does not cover pages.yml's call of it.)
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: tools
      # A run that started before a new build was released (the deploy skill's changelog push, #501) must not put
      # the last build's game back over the new one when it deploys after the new build's own deploy.
      - name: Still the newest build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.build.outputs.tag }}
          PASSED: ${{ inputs.tag }}
        run: |
          newest=$(tools/newest-build.sh)
          if [ -n "$PASSED" ] || [ "$BUILT" = "$newest" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Not deployed: built around $BUILT, but $newest is released since; its own deploy carries the page." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: deployment
        if: steps.current.outputs.ok == 'true'
        uses: actions/deploy-pages@v5

  # The game was smoke-tested when it was deployed: here, only that both pages are served.
  check:
    needs: deploy
    if: needs.deploy.outputs.page_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The landing page and the game answer
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          curl -fsS --retry 5 --retry-all-errors "$url" | grep -q 'class="play"'
          curl -fsS --retry 5 --retry-all-errors "${url}play/" | grep -qi '<script'
